<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 326" width="470" height="326" role="img" aria-label="Two panels. Left, a closed container partly filled with a liquid: some molecules leave the surface as vapor (evaporation) while others return (condensation); when the two rates are equal, the vapor exerts a steady pressure, the vapor pressure. Right, a pot of water being heated from below, with bubbles of vapor forming throughout the liquid while air pressure pushes down on the surface. Bubbles form when the vapor pressure of the liquid equals the pressure above it. Stronger intermolecular forces mean lower vapor pressure and a higher boiling point."><rect width="470" height="326" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Evaporation, vapor pressure, and boiling</text><rect x="10" y="40" width="220" height="236" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><rect x="240" y="40" width="220" height="236" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Closed container</text><text x="350.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Boiling</text><path d="M40 90 h160 v160 h-160 z" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><rect x="40" y="170" width="160" height="80" fill="#dbe7f6"/><line x1="40.0" y1="170.0" x2="200.0" y2="170.0" stroke="#2f5fa8" stroke-width="2" /><circle cx="62.0" cy="110.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="110.0" cy="100.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="160.0" cy="118.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="86.0" cy="140.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="182.0" cy="146.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="132.0" cy="134.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="60.0" cy="190.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="90.0" cy="205.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="120.0" cy="188.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="150.0" cy="210.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="180.0" cy="192.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="75.0" cy="232.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="110.0" cy="232.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="145.0" cy="236.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="178.0" cy="228.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M100.0 176.0 L96.0 152.0" stroke="#c0392b" stroke-width="1.8" fill="none" marker-end="url(#arR)"/><path d="M146.0 150.0 L150.0 174.0" stroke="#2f5fa8" stroke-width="1.8" fill="none" marker-end="url(#arB)"/><text x="120.0" y="268.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Rates equal: vapor pressure</text><path d="M270 110 v94 a10 10 0 0 0 10 10 h140 a10 10 0 0 0 10 -10 v-94" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="2"/><circle cx="300" cy="186" r="9" fill="#fff" stroke="#2f5fa8" s