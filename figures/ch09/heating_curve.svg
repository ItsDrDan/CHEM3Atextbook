<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 462" width="470" height="462" role="img" aria-label="Heating curve for water: temperature in degrees Celsius on the vertical axis from −20 to 120, heat added on the horizontal axis. Segment 1, a rising slope from −20 to 0 °C: ice warms, q = m c delta T. Segment 2, a flat plateau at 0 °C: ice melts, q = n times delta H of fusion. Segment 3, a rising slope from 0 to 100 °C: liquid water warms, q = m c delta T. Segment 4, a long flat plateau at 100 °C: water boils, q = n times delta H of vaporization; it is the longest segment because vaporizing takes the most heat. Segment 5, a rising slope above 100 °C: steam warms. Slopes show temperature changes; plateaus show phase changes at constant temperature."><rect width="470" height="462" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Heating curve for water</text><line x1="62.0" y1="300.0" x2="450.0" y2="300.0" stroke="#2d3f4b" stroke-width="2" /><line x1="62.0" y1="300.0" x2="62.0" y2="50.0" stroke="#2d3f4b" stroke-width="2" /><line x1="57.0" y1="284.4" x2="62.0" y2="284.4" stroke="#2d3f4b" stroke-width="1.4" /><text x="53.0" y="288.4" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#2d3f4b" >−20</text><line x1="57.0" y1="253.1" x2="62.0" y2="253.1" stroke="#2d3f4b" stroke-width="1.4" /><text x="53.0" y="257.1" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#2d3f4b" >0</text><line x1="57.0" y1="221.9" x2="62.0" y2="221.9" stroke="#2d3f4b" stroke-width="1.4" /><text x="53.0" y="225.9" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#2d3f4b" >20</text><line x1="57.0" y1="190.6" x2="62.0" y2="190.6" stroke="#2d3f4b" stroke-width="1.4" /><text x="53.0" y="194.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#2d3f4b" >40</text><line x1="57.0" y1="159.4" x2="62.0" y2="159.4" stroke="#2d3f4b" stroke-width="1.4" /><text x="53.0" y="163.4" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#2d3f4b" >60</text><line x1="57.0" y1="128.1" x2="62.0" y2="128.1" stroke="#2d3f4b" stroke-width="1.4" /><text x="53.0" y="132.1" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#2d3f4b" >80</text><line x1="57.0" y1="96.9" x2="62.0" y2="96.9" stroke="#2d3f4b" stroke-width="1.4" /><text x="53.0" y="100.9" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#2d3f4b" >100</text><line x1="57.0" y1="65.6" x2="62.0" y2="65.6" stroke="#2d3f4b" stroke-width="1.4" /><text x="53.0" y="69.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#2d3f4b" >120</text><text x="20.0" y="175.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" transform="rotate(-90 20 175.0)">Temperature (°C)</text><text x="256.0" y="326.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Heat added (q) →</text><polyline points="62.0,284.4 85.3,253.1 139.6,253.1 190.0,96.9 411.2,96.9 438.4,65.6" fill="none" stroke="#c0392b" stroke-width="3.2" stroke-linejoin="round"/><line x1="62.0" y1="253.1" x2="450.0" y2="253.1" stroke="#c9d3dc" stroke-width="1" stroke-dasharray="4 4"/><line x1="62.0" y1="96.9" x2="450.0" y2="96.9" stroke="#c9d3dc" stroke-width="1" stroke-dasharray="4 4"/><circle cx="73.6" cy="268.8" r="10" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><text x="73.6" y="272.8" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1</text><circle cx="112.4" cy="253.1" r="10" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><text x="112.4" y="257.1" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2</text><circle cx="164.8" cy="175.0" r="10" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><text x="164.8" y="179.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >3</text><circle cx="300.6" cy="96.9" r="10" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><text x="300.6" y="100.9" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >4</text><circle cx="424.8" cy="81.2" r="10" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><text x="424.8" y="85.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >5</text><text x="70.0" y="352.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >1 Ice warms: q = mcΔT</text><text x="70.0" y="370.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >2 Ice melts at 0 °C: q = n·ΔH<tspan baseline-shift="sub" font-size="9">fus</tspan></text><text x="70.0" y="388.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >3 Liquid water warms: q = mcΔT</text><text x="70.0" y="406.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >4 Water boils at 100 °C: q = n·ΔH<tspan baseline-shift="sub" font-size="9">vap</tspan></text><text x="70.0" y="424.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >5 Steam warms: q = mcΔT</text><text x="235.0" y="450.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Slopes: temperature changes. Plateaus: phase changes at constant temperature.</text></svg>