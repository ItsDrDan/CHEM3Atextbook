amily="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >−273.15 °C</text><line x1="358.0" y1="318.0" x2="382.0" y2="318.0" stroke="#2d3f4b" stroke-width="2.2" /><text x="386.0" y="313.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >0 K</text><text x="10.0" y="333.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#55606b" >Absolute zero</text><text x="130.0" y="362.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >K = °C + 273.15</text><text x="340.0" y="362.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >°C = (°F − 32) ÷ 1.8</text><text x="235.0" y="380.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >A kelvin and a Celsius degree are the same size; a Celsius degree is 1.8 °F.</text></svg>