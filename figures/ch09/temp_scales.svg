<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 392" width="470" height="392" role="img" aria-label="Three thermometers side by side for the Fahrenheit, Celsius, and Kelvin scales, with dashed lines across them at four temperatures. Water boils: 212 °F, 100 °C, 373.15 K. Body temperature: 98.6 °F, 37.0 °C, 310.15 K. Water freezes: 32 °F, 0 °C, 273.15 K. Absolute zero: −459.67 °F, −273.15 °C, 0 K. Formulas: K = °C + 273.15, and °C = (°F − 32) divided by 1.8. A kelvin and a Celsius degree are the same size; a Celsius degree is 1.8 Fahrenheit degrees. The thermometers are not drawn to scale."><rect width="470" height="392" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Three temperature scales</text><text x="140.0" y="48.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >°F</text><rect x="131" y="60" width="18" height="270" rx="9" fill="#fff" stroke="#2d3f4b" stroke-width="1.8"/><circle cx="140.0" cy="336.0" r="14" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1.8"/><rect x="136" y="150" width="8" height="180" fill="#f2b8b0"/><text x="255.0" y="48.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >°C</text><rect x="246" y="60" width="18" height="270" rx="9" fill="#fff" stroke="#2d3f4b" stroke-width="1.8"/><circle cx="255.0" cy="336.0" r="14" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1.8"/><rect x="251" y="150" width="8" height="180" fill="#f2b8b0"/><text x="370.0" y="48.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >K</text><rect x="361" y="60" width="18" height="270" rx="9" fill="#fff" stroke="#2d3f4b" stroke-width="1.8"/><circle cx="370.0" cy="336.0" r="14" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1.8"/><rect x="366" y="150" width="8" height="180" fill="#f2b8b0"/><line x1="20.0" y1="72.0" x2="452.0" y2="72.0" stroke="#c9d3dc" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="128.0" y1="72.0" x2="152.0" y2="72.0" stroke="#2d3f4b" stroke-width="2.2" /><text x="156.0" y="67.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >212 °F</text><line x1="243.0" y1="72.0" x2="267.0" y2="72.0" stroke="#2d3f4b" stroke-width="2.2" /><text x="271.0" y="67.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >100 °C</text><line x1="358.0" y1="72.0" x2="382.0" y2="72.0" stroke="#2d3f4b" stroke-width="2.2" /><text x="386.0" y="67.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >373.15 K</text><text x="10.0" y="87.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#55606b" >Water boils</text><line x1="20.0" y1="150.0" x2="452.0" y2="150.0" stroke="#c9d3dc" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="128.0" y1="150.0" x2="152.0" y2="150.0" stroke="#2d3f4b" stroke-width="2.2" /><text x="156.0" y="145.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >98.6 °F</text><line x1="243.0" y1="150.0" x2="267.0" y2="150.0" stroke="#2d3f4b" stroke-width="2.2" /><text x="271.0" y="145.0" font-family="Lato, Helvetica,