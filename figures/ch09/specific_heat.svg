<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 346" width="470" height="346" role="img" aria-label="Bar chart of specific heat capacity in joules per gram per degree Celsius: liquid water 4.184, ethanol 2.42, aluminum 0.903, iron 0.449, copper 0.385, gold 0.128. Water has by far the highest value. A higher specific heat means more heat is needed for each 1 °C change, so water is hard to heat and slow to cool, while metals heat quickly."><rect width="470" height="346" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Specific heat capacity, c (J/g·°C)</text><line x1="128.0" y1="40.0" x2="128.0" y2="280.0" stroke="#c9d3dc" stroke-width="1" /><text x="128.0" y="298.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >0</text><line x1="195.1" y1="40.0" x2="195.1" y2="280.0" stroke="#c9d3dc" stroke-width="1" /><text x="195.1" y="298.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >1</text><line x1="262.2" y1="40.0" x2="262.2" y2="280.0" stroke="#c9d3dc" stroke-width="1" /><text x="262.2" y="298.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >2</text><line x1="329.3" y1="40.0" x2="329.3" y2="280.0" stroke="#c9d3dc" stroke-width="1" /><text x="329.3" y="298.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >3</text><line x1="396.4" y1="40.0" x2="396.4" y2="280.0" stroke="#c9d3dc" stroke-width="1" /><text x="396.4" y="298.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >4</text><text x="120.0" y="66.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="end" fill="#2d3f4b" >Water (liquid)</text><rect x="128" y="50" width="280.8" height="24" fill="#2f5fa8" stroke="#2d3f4b" stroke-width="1.2"/><text x="414.8" y="67.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >4.184</text><text x="120.0" y="106.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="end" fill="#2d3f4b" >Ethanol</text><rect x="128" y="90" width="162.4" height="24" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1.2"/><text x="296.4" y="107.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >2.42</text><text x="120.0" y="146.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="end" fill="#2d3f4b" >Aluminum</text><rect x="128" y="130" width="60.6" height="24" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1.2"/><text x="194.6" y="147.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >0.903</text><text x="120.0" y="186.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="end" fill="#2d3f4b" >Iron</text><rect x="128" y="170" width="30.1" height="24" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1.2"/><text x="164.1" y="187.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >0.449</text><text x="120.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="end" fill="#2d3f4b" >Copper</text><rect x="128" y="210" width="25.8" height="24" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1.2"/><text x="159.8" y="227.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >0.385</text><text x="120.0" y="266.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="end" fill="#2d3f4b" >Gold</text><rect x="128" y="250" width="8.6" height="24" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1.2"/><text x="142.6" y="267.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >0.128</text><text x="235.0" y="316.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Higher c: more heat needed for each 1 °C change.</text><text x="235.0" y="334.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Water is hard to heat and slow to cool; metals heat quickly.</text></svg>