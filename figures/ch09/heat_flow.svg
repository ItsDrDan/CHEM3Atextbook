<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 302" width="470" height="302" role="img" aria-label="Heat flows from hot to cold. Left, exothermic: arrows point outward from the system (the change) to the surroundings; q is less than 0; the system releases heat and the surroundings warm up. Examples: a hand warmer, burning fuel, freezing water. Right, endothermic: arrows point inward from the surroundings to the system; q is greater than 0; the system absorbs heat and the surroundings cool down. Examples: a cold pack, melting ice, evaporating sweat. Everything outside the system is the surroundings, such as your hand, the water, or the air."><rect width="470" height="302" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Heat flows from hot to cold</text><rect x="14" y="38" width="212" height="232" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#c0392b" >Exothermic</text><rect x="70" y="86" width="100" height="66" rx="12" fill="#fff7e6" stroke="#2d3f4b" stroke-width="1.8"/><text x="120.0" y="116.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >system</text><text x="120.0" y="134.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(the change)</text><path d="M64.0 119.0 L36.0 119.0" stroke="#c0392b" stroke-width="2.2" fill="none" marker-end="url(#arR)"/><path d="M176.0 119.0 L204.0 119.0" stroke="#c0392b" stroke-width="2.2" fill="none" marker-end="url(#arR)"/><path d="M120.0 82.0 L120.0 69.0" stroke="#c0392b" stroke-width="2.2" fill="none" marker-end="url(#arR)"/><path d="M120.0 156.0 L120.0 169.0" stroke="#c0392b" stroke-width="2.2" fill="none" marker-end="url(#arR)"/><text x="120.0" y="198.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#c0392b" >q &lt; 0</text><text x="120.0" y="216.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >System releases heat;</text><text x="120.0" y="232.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >surroundings warm up.</text><text x="120.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#55606b" >Hand warmer, burning fuel, freezing water</text><rect x="244" y="38" width="212" height="232" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="350.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2f5fa8" >Endothermic</text><rect x="300" y="86" width="100" height="66" rx="12" fill="#e8f1fb" stroke="#2d3f4b" stroke-width="1.8"/><text x="350.0" y="116.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >system</text><text x="350.0" y="134.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(the change)</text><path d="M264.0 119.0 L292.0 119.0" stroke="#2f5fa8" stroke-width="2.2" fill="none" marker-end="url(#arB)"/><path d="M436.0 119.0 L408.0 119.0" stroke="#2f5fa8" stroke-width="2.2" fill="none" marker-end="url(#arB)"/><path d="M350.0 67.0 L350.0 81.0" stroke="#2f5fa8" stroke-width="2.2" fill="none" marker-end="url(#arB)"/><path d="M350.0 171.0 L350.0 157.0" stroke="#2f5fa8" stroke-width="2.2" fill="none" marker-end="url(#arB)"/><text x="350.0" y="198.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2f5fa8" >q &gt; 0</text><text x="350.0" y="216.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >System absorbs heat;</text><text x="350.0" y="232.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >surroundings cool down.</text><text x="350.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#55606b" >Cold pack, melting ice, evaporating sweat</text><text x="235.0" y="292.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Everything outside the system is the surroundings (your hand, the water, the air).</text></svg>