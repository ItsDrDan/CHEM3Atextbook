<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 410" width="470" height="410" role="img" aria-label="Four panels showing the intermolecular forces. Dispersion, found in all molecules: two atoms whose electron clouds are briefly uneven, delta minus on one side and delta plus on the other; a brief uneven cloud induces one in a neighbor. Dipole–dipole, found in polar molecules: HCl molecules line up so the delta plus H end of one attracts the delta minus Cl end of another. Hydrogen bonding: two water molecules, with a dashed hydrogen bond from an H on one water to the O of another; it is a strong dipole–dipole attraction between H bonded to N, O, or F and a lone pair. Ion–dipole, found with ions in water: a sodium ion surrounded by four water molecules with their partially negative oxygen ends facing the cation. For molecules of similar size, from weakest to strongest: dispersion, dipole–dipole, hydrogen bond, ion–dipole."><rect width="470" height="410" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >The intermolecular forces</text><rect x="10" y="40" width="220" height="156" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Dispersion (all molecules)</text><rect x="240" y="40" width="220" height="156" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="350.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Dipole–dipole (polar molecules)</text><rect x="10" y="206" width="220" height="156" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Hydrogen bonding (H on N, O, F)</text><rect x="240" y="206" width="220" height="156" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="350.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ion–dipole (ions in water)</text><ellipse cx="70" cy="110" rx="34" ry="24" fill="#e6e1f5" stroke="#2d3f4b" stroke-width="1.3"/><ellipse cx="56" cy="110" rx="16" ry="18" fill="#b9addf" opacity="0.9"/><circle cx="70.0" cy="110.0" r="5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="1"/><text x="70.0" y="148.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >δ−    δ+</text><ellipse cx="170" cy="110" rx="34" ry="24" fill="#e6e1f5" stroke="#2d3f4b" stroke-width="1.3"/><ellipse cx="156" cy="110" rx="16" ry="18" fill="#b9addf" opacity="0.9"/><circle cx="170.0" cy="110.0" r="5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="1"/><text x="170.0" y="148.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >δ−    δ+</text><text x="120.0" y="172.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >A brief uneven electron cloud</text><text x="120.0" y="186.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >induces one in a neighbor.</text><circle cx="268.0" cy="100.0" r="10" fill="#fff" stroke="#2d3f4b" stroke-width="1.4"/><text x="268.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="298.0" cy="100.0" r="14" fill="#cfe8cf" stroke="#2d3f4b" stroke-width="1.4"/><text x="298.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cl</text><circle cx="338.0" cy="100.0" r="10" fill="#fff" stroke="#2d3f4b" stroke-width="1.4"/><text x="338.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="368.0" cy="100.0" r="14" fill="#cfe8cf" stroke="#2d3f4b" stroke-width="1.4"/><text x="368.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cl</text><line x1="312.0" y1="100.0" x2="326.0" y2="100.0" stroke="#2d3f4b" stroke-width="1.6" stroke-dasharray="3 3"/><text x="268.0" y="84.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >δ+</text><text x="298.0" y="84.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >δ−</text><text x="338.0" y="84.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >δ+</text><text x="368.0" y="84.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >δ−</text><circle cx="300.0" cy="140.0" r="10" fill="#fff" stroke="#2d3f4b" stroke-width="1.4"/><text x="300.0" y="144.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="330.0" cy="140.0" r="14" fill="#cfe8cf" stroke="#2d3f4b" stroke-width="1.4"/><text x="330.0" y="144.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cl</text><text x="410.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >HCl</text><text x="350.0" y="172.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >The δ+ end of one attracts</text><text x="350.0" y="186.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >the δ− end of another.</text><g transform="rotate(0 70 262)"><line x1="70.0" y1="262.0" x2="50.0" y2="278.0" stroke="#2d3f4b" stroke-width="2" /><line x1="70.0" y1="262.0" x2="90.0" y2="278.0" stroke="#2d3f4b" stroke-width="2" /><circle cx="70.0" cy="262.0" r="12" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.4"/><text x="70.0" y="266.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="50.0" cy="278.0" r="8" fill="#fff" stroke="#2d3f4b" stroke-width="1.4"/><text x="50.0" y="282.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="90.0" cy="278.0" r="8" fill="#fff" stroke="#2d3f4b" stroke-width="1.4"/><text x="90.0" y="282.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text></g><g transform="rotate(-60 170 276)"><line x1="170.0" y1="276.0" x2="150.0" y2="292.0" stroke="#2d3f4b" stroke-width="2" /><line x1="170.0" y1="276.0" x2="190.0" y2="292.0" stroke="#2d3f4b" stroke-width="2" /><circle cx="170.0" cy="276.0" r="12" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.4"/><text x="170.0" y="280.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="150.0" cy="292.0" r="8" fill="#fff" stroke="#2d3f4b" stroke-width="1.4"/><text x="150.0" y="296.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="190.0" cy="292.0" r="8" fill="#fff" stroke="#2d3f4b" stroke-width="1.4"/><text x="190.0" y="296.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text></g><line x1="94.0" y1="280.0" x2="154.0" y2="278.0" stroke="#2f5fa8" stroke-width="2.4" stroke-dasharray="4 3"/><text x="124.0" y="266.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2f5fa8" >H bond</text><text x="120.0" y="338.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Strong dipole–dipole: H on N, O, or F</text><text x="120.0" y="352.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >attracted to a lone pair on N, O, or F.</text><circle cx="350.0" cy="284.0" r="16" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.8"/><text x="350.0" y="289.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na<tspan baseline-shift="super" font-size="9">+</tspan></text><circle cx="396.0" cy="284.0" r="10" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.4"/><text x="396.0" y="288.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="408.0" cy="276.0" r="6" fill="#fff" stroke="#2d3f4b" stroke-width="1.1"/><circle cx="408.0" cy="292.0" r="6" fill="#fff" stroke="#2d3f4b" stroke-width="1.1"/><circle cx="350.0" cy="314.0" r="10" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.4"/><text x="350.0" y="318.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="358.0" cy="326.0" r="6" fill="#fff" stroke="#2d3f4b" stroke-width="1.1"/><circle cx="342.0" cy="326.0" r="6" fill="#fff" stroke="#2d3f4b" stroke-width="1.1"/><circle cx="304.0" cy="284.0" r="10" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.4"/><text x="304.0" y="288.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="292.0" cy="292.0" r="6" fill="#fff" stroke="#2d3f4b" stroke-width="1.1"/><circle cx="292.0" cy="276.0" r="6" fill="#fff" stroke="#2d3f4b" stroke-width="1.1"/><circle cx="350.0" cy="254.0" r="10" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.4"/><text x="350.0" y="258.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="342.0" cy="242.0" r="6" fill="#fff" stroke="#2d3f4b" stroke-width="1.1"/><circle cx="358.0" cy="242.0" r="6" fill="#fff" stroke="#2d3f4b" stroke-width="1.1"/><text x="350.0" y="350.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >The δ− O ends of water face the cation.</text><text x="235.0" y="380.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >For molecules of similar size, weakest → strongest:</text><text x="235.0" y="398.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >dispersion &lt; dipole–dipole &lt; H bond &lt; ion–dipole</text></svg>