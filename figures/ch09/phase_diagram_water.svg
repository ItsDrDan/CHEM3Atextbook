<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 414" width="470" height="414" role="img" aria-label="Schematic phase diagram of water, not to scale. Pressure in atmospheres is on the vertical axis and temperature in degrees Celsius on the horizontal axis. Three regions: solid (ice) at the upper left, liquid (water) at the top middle, and gas (water vapor) at the lower right. Three lines separate them, and on each line two phases coexist: the melting and freezing line between solid and liquid, which tilts slightly to the left as pressure rises; the boiling and condensing curve between liquid and gas; and the sublimation and deposition curve between solid and gas. All three lines meet at the triple point, 0.01 degrees Celsius and 0.006 atm, where solid, liquid, and gas coexist. A dashed horizontal line at 1 atm crosses the solid-liquid line at the normal melting point, 0 degrees Celsius, and the liquid-gas curve at the normal boiling point, 100 degrees Celsius."><title>Schematic phase diagram of water, not to scale. Pressure in atmospheres is on the vertical axis and temperature in degrees Celsius on the horizontal axis. Three regions: solid (ice) at the upper left, liquid (water) at the top middle, and gas (water vapor) at the lower right. Three lines separate them, and on each line two phases coexist: the melting and freezing line between solid and liquid, which tilts slightly to the left as pressure rises; the boiling and condensing curve between liquid and gas; and the sublimation and deposition curve between solid and gas. All three lines meet at the triple point, 0.01 degrees Celsius and 0.006 atm, where solid, liquid, and gas coexist. A dashed horizontal line at 1 atm crosses the solid-liquid line at the normal melting point, 0 degrees Celsius, and the liquid-gas curve at the normal boiling point, 100 degrees Celsius.</title><rect width="470" height="414" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="24.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Phase diagram of water (not to scale)</text><path d="M74.0 350.0 L74.0 42.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M74.0 350.0 L450.0 350.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="446.0" y="390.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="end" fill="#2d3f4b" >Temperature (°C) →</text><text x="24.0" y="201.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" transform="rotate(-90 24 201.0)">Pressure (atm) →</text><line x1="74.0" y1="168.0" x2="444.0" y2="168.0" stroke="#55606b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="66.0" y="173.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="end" fill="#2d3f4b" >1 atm</text><line x1="165.4" y1="168.0" x2="165.4" y2="350.0" stroke="#55606b" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="352.0" y1="168.0" x2="352.0" y2="350.0" stroke="#55606b" stroke-width="1.2" stroke-dasharray="3 4"/><text x="165.4" y="368.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >0 °C</text><text x="352.0" y="368.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >100 °C</text><path d="M176.0 286.0 L156.0 64.0" stroke="#2f5fa8" stroke-width="3.0" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M176.0 286.0 L180.4 285.4 L184.7 284.4 L189.1 283.1 L193.5 281.6 L197.8 280.0 L202.2 278.2 L206.6 276.3 L210.9 274.2 L215.3 272.1 L219.7 269.8 L224.0 267.4 L228.4 265.0 L232.8 262.5 L237.1 259.8 L241.5 257.1 L245.9 254.4 L250.2 251.5 L254.6 248.6 L259.0 245.6 L263.3 242.5 L267.7 239.4 L272.1 236.2 L276.4 232.9 L280.8 229.6 L285.2 226.2 L289.5 222.8 L293.9 219.3 L298.3 215.8 L302.6 212.2 L307.0 208.5 L311.4 204.8 L315.7 201.1 L320.1 197.3 L324.5 193.4 L328.8 189.5 L333.2 185.5 L337.6 181.5 L341.9 177.5 L346.3 173.4 L350.7 169.3 L355.0 165.1 L359.4 160.9 L363.8 156.6 L368.1 152.3 L372.5 147.9 L376.9 143.6 L381.2 139.1 L385.6 134.6 L390.0 130.1 L394.3 125.6 L398.7 121.0 L403.1 116.4 L407.4 111.7 L411.8 107.0 L416.2 102.3 L420.5 97.5 L424.9 92.7 L429.3 87.8 L433.6 82.9 L438.0 78.0" stroke="#c0392b" stroke-width="3.0" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M84.0 344.0 L86.3 344.0 L88.6 343.9 L90.9 343.8 L93.2 343.6 L95.5 343.4 L97.8 343.1 L100.1 342.7 L102.4 342.3 L104.7 341.8 L107.0 341.3 L109.3 340.6 L111.6 339.9 L113.9 339.1 L116.2 338.2 L118.5 337.3 L120.8 336.3 L123.1 335.2 L125.4 334.0 L127.7 332.7 L130.0 331.4 L132.3 329.9 L134.6 328.4 L136.9 326.8 L139.2 325.1 L141.5 323.4 L143.8 321.5 L146.1 319.6 L148.4 317.5 L150.7 315.4 L153.0 313.2 L155.3 310.9 L157.6 308.5 L159.9 306.0 L162.2 303.4 L164.5 300.8 L166.8 298.0 L169.1 295.1 L171.4 292.2 L173.7 289.1 L176.0 286.0" stroke="#2e7d32" stroke-width="3.0" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="112.0" y="128.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >SOLID</text><text x="112.0" y="146.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#55606b" >(ice)</text><text x="262.0" y="112.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >LIQUID</text><text x="262.0" y="130.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#55606b" >(water)</text><text x="300.0" y="262.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >GAS</text><text x="300.0" y="280.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#55606b" >(water vapor)</text><circle cx="176.0" cy="286.0" r="6.5" fill="#f3c34a" stroke="#2d3f4b" stroke-width="1.4"/><circle cx="165.4" cy="168.0" r="6" fill="#2f5fa8" stroke="#2d3f4b" stroke-width="1.4"/><circle cx="352.0" cy="168.0" r="6" fill="#c0392b" stroke="#2d3f4b" stroke-width="1.4"/><text x="188.0" y="308.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="start" fill="#2d3f4b" >Triple point</text><text x="188.0" y="323.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#55606b" >0.01 °C, 0.006 atm</text><text x="175.4" y="158.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="start" fill="#2f5fa8" >Normal melting point</text><text x="362.0" y="190.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="start" fill="#c0392b" >Normal</text><text x="362.0" y="205.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="start" fill="#c0392b" >boiling point</text><text x="168.0" y="84.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#2f5fa8" >melting / freezing</text><text x="410.0" y="78.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="end" fill="#c0392b" >boiling /</text><text x="410.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="end" fill="#c0392b" >condensing</text><text x="82.0" y="252.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#2e7d32" >sublimation /</text><text x="82.0" y="266.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#2e7d32" >deposition</text><text x="235.0" y="404.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >On a line, two phases coexist. Water’s solid–liquid line tilts left.</text></svg>