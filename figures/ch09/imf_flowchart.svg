<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" width="470" height="330" role="img" aria-label="Flowchart for deciding which intermolecular forces are present. Question 1: is it an ion or ionic compound mixed with a polar molecule? If yes, ion–dipole. If no, question 2: does the molecule have H bonded directly to N, O, or F? If yes, hydrogen bonding plus the weaker forces. If no, question 3: is the molecule polar, meaning polar bonds and an asymmetric shape? If yes, dipole–dipole plus dispersion. If no, dispersion forces only. Every molecule also has dispersion forces, and a molecule with hydrogen bonding also has dipole–dipole and dispersion forces."><rect width="470" height="330" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Which intermolecular forces are present?</text><rect x="105" y="40" width="260" height="46" rx="10" fill="#fff7e6" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="59.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Is it an ion (or ionic compound)</text><text x="235.0" y="75.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >mixed with a polar molecule?</text><path d="M235.0 86.0 L235.0 104.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="245.0" y="100.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" fill="#2d3f4b" >no</text><path d="M365.0 63.0 L392.0 63.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="378.0" y="54.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >yes</text><rect x="394" y="40" width="66" height="46" rx="10" fill="#fbe3d8" stroke="#2d3f4b" stroke-width="1.6"/><text x="427.0" y="59.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ion–</text><text x="427.0" y="75.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >dipole</text><rect x="105" y="106" width="260" height="46" rx="10" fill="#fff7e6" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="125.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Does the molecule have H bonded</text><text x="235.0" y="141.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >directly to N, O, or F?</text><path d="M365.0 129.0 L392.0 129.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="378.0" y="120.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >yes</text><rect x="394" y="106" width="66" height="46" rx="10" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="427.0" y="125.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H bond</text><text x="427.0" y="141.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >+ more</text><path d="M235.0 152.0 L235.0 170.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="245.0" y="166.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" fill="#2d3f4b" >no</text><rect x="105" y="172" width="260" height="46" rx="10" fill="#fff7e6" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="191.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Is the molecule polar?</text><text x="235.0" y="207.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >(polar bonds, asymmetric shape)</text><path d="M365.0 195.0 L392.0 195.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="378.0" y="186.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >yes</text><rect x="394" y="172" width="66" height="46" rx="10" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.6"/><text x="427.0" y="191.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Dipole–</text><text x="427.0" y="207.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >dipole +</text><path d="M235.0 218.0 L235.0 236.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="245.0" y="232.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" fill="#2d3f4b" >no</text><rect x="105" y="238" width="260" height="40" rx="10" fill="#efe3f7" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="262.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Dispersion forces only</text><text x="235.0" y="302.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Every molecule also has dispersion forces. A molecule with H bonding</text><text x="235.0" y="318.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >also has dipole–dipole and dispersion forces.</text></svg>