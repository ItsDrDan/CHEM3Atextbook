<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 424" width="470" height="424" role="img" aria-label="Four types of crystalline solids. Ionic, for example NaCl: a grid of alternating positive and negative ions held by ionic bonds; high melting point; conducts when melted or dissolved. Molecular, for example ice, dry ice, and sugar: separate molecules held together by intermolecular forces, shown as dashed attractions between water molecules; low melting point; does not conduct. Covalent network, for example diamond and quartz, SiO2: atoms joined in a web of covalent bonds; very high melting point; very hard. Metallic, for example iron, copper, and aluminum: metal cations in a sea of moving electrons; a wide range of melting points; conducts electricity."><rect width="470" height="424" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Types of crystalline solids</text><rect x="10" y="40" width="220" height="180" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ionic</text><text x="120.0" y="78.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#55606b" >NaCl</text><text x="120.0" y="196.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-ancho