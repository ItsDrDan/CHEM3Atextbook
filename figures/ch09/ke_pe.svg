<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 262" width="470" height="262" role="img" aria-label="Two kinds of energy in matter. Left panel, kinetic energy (energy of motion): cooler particles move slowly, shown with short arrows; hotter particles move faster in random directions, shown with long arrows. Faster particles mean a higher temperature; temperature measures the average kinetic energy. Right panel, potential energy (energy of position): two attracted particles close together have low potential energy; the same particles pulled apart have high potential energy. Separating particles takes energy, like stretching a spring. Chemical energy is stored this way, in bonds and between molecules."><rect width="470" height="262" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Two kinds of energy in matter</text><rect x="10" y="38" width="218" height="214" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><rect x="242" y="38" width="218" height="214" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="119.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Kinetic energy, KE (motion)</text><text x="351.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Potential energy, PE (position)</text><text x="64.0" y="84.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2f5fa8" >Cooler</text><text x="174.0" y="84.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b" >Hotter</text><line x1="119.0" y1="76.0" x2="119.0" y2="200.0" stroke="#c9d3dc" stroke-width="1.4" /><circle cx="40.0" cy="110.0" r="9" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.4"/><path d="M50.0 110.0 L60.0 107.0" stroke="#2f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arB)"/><circle cx="80.0" cy="104.0" r="9" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.4"/><path d="M90.0 104.0 L100.0 101.0" stroke="#2f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arB)"/><circle cx="54.0" cy="146.0" r="9" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.4"/><path d="M64.0 146.0 L74.0 143.0" stroke="#2f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arB)"/><circle cx="92.0" cy="150.0" r="9" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.4"/><path d="M102.0 150.0 L112.0 147.0" stroke="#2f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arB)"/><circle cx="44.0" cy="184.0" r="9" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.4"/><path d="M54.0 184.0 L64.0 181.0" stroke="#2f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arB)"/><circle cx="86.0" cy="188.0" r="9" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.4"/><path d="M96.0 188.0 L106.0 185.0" stroke="#2f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arB)"/><circle cx="140.0" cy="104.0" r="9" fill="#f9d9d4" stroke="#2d3f4b" stroke-width="1.4"/><path d="M148.5 107.1 L166.3 113.6" stroke="#c0392b" stroke-width="1.8" fill="none" marker-end="url(#arR)"/><circle cx="196.0" cy="112.0" r="9" fill="#f9d9d4" stroke="#2d3f4b" stroke-width="1.4"/><path d="M188.2 107.5 L171.8 98.0" stroke="#c0392b" stroke-width="1.8" fill="none" marker-end="url(#arR)"/><circle cx="150.0" cy="150.0" r="9" fill="#f9d9d4" stroke="#2d3f4b" stroke-width="1.4"/><path d="M156.9 144.2 L171.4 132.0" stroke="#c0392b" stroke-width="1.8" fill="none" marker-end="url(#arR)"/><circle cx="206.0" cy="152.0" r="9" fill="#f9d9d4" stroke="#2d3f4b" stroke-width="1.4"/><path d="M204.4 160.9 L201.1 179.6" stroke="#c0392b" stroke-width="1.8" fill="none" marker-end="url(#arR)"/><circle cx="142.0" cy="190.0" r="9" fill="#f9d9d4" stroke="#2d3f4b" stroke-width="1.4"/><path d="M150.9 191.6 L169.6 194.9" stroke="#c0392b" stroke-width="1.8" fill="none" marker-end="url(#arR)"/><circle cx="196.0" cy="188.0" r="9" fill="#f9d9d4" stroke="#2d3f4b" stroke-width="1.4"/><path d="M191.5 180.2 L182.0 163.8" stroke="#c0392b" stroke-width="1.8" fill="none" marker-end="url(#arR)"/><text x="119.0" y="222.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Faster particles = higher temperature</text><text x="119.0" y="240.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Temperature measures average KE</text><text x="351.0" y="84.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Attracted particles</text><circle cx="300.0" cy="118.0" r="13" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.4"/><circle cx="326.0" cy="118.0" r="13" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.4"/><text x="313.0" y="148.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Close together:</text><text x="313.0" y="162.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >LOW PE</text><circle cx="372.0" cy="118.0" r="13" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.4"/><circle cx="432.0" cy="118.0" r="13" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.4"/><line x1="386.0" y1="118.0" x2="418.0" y2="118.0" stroke="#2d3f4b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="402.0" y="148.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Pulled apart:</text><text x="402.0" y="162.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >HIGH PE</text><text x="351.0" y="190.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Separating particles takes energy,</text><text x="351.0" y="206.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >like stretching a spring.</text><text x="351.0" y="232.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Chemical energy is stored this way</text><text x="351.0" y="246.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >in bonds and between molecules.</text></svg>