<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 448" width="470" height="448" role="img" aria-label="The electromagnetic spectrum listed from longest wavelength and lowest energy at the top to shortest wavelength and highest energy at the bottom: radio waves (longer than about 1 meter; MRI scanners, radio), microwaves (about 1 millimeter to 1 meter; microwave ovens, cell phones), infrared (about 700 nanometers to 1 millimeter; heat lamps, pulse oximeter at 940 nanometers), visible light (about 400 to 700 nanometers; red through violet), ultraviolet (about 10 to 400 nanometers; sunburn, germicidal UV-C lamps), X-rays (about 0.01 to 10 nanometers; radiographs, CT scans), and gamma rays (shorter than about 0.01 nanometer; nuclear medicine, radiation therapy). An arrow down the side says wavelength gets shorter and frequency and energy get higher."><rect width="470" height="448" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><rect x="60" y="10" width="400" height="56" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.5"/><text x="72.0" y="32.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2d3f4b" >Radio waves</text><text x="72.0" y="53.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >over about 1 m</text><text x="450.0" y="32.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="1" font-weight="700" text-anchor="middle" fill="#2d3f4b" ></text><text x="450.0" y="53.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#2d3f4b" font-style="italic">MRI scanners, radio</text><rect x="60" y="72" width="400" height="56" rx="8" fill="#e9eff7" stroke="#2d3f4b" stroke-width="1.5"/><text x="72.0" y="94.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2d3f4b" >Microwaves</text><text x="72.0" y="115.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >about 1 mm to 1 m</text><text x="450.0" y="94.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="1" font-weight="700" text-anchor="middle" fill="#2d3f4b" ></text><text x="450.0" y="115.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#2d3f4b" font-style="italic">microwave ovens, cell phones</text><rect x="60" y="134" width="400" height="56" rx="8" fill="#fbe3d8" stroke="#2d3f4b" stroke-width="1.5"/><text x="72.0" y="156.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2d3f4b" >Infrared</text><text x="72.0" y="177.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >about 700 nm to 1 mm</text><text x="450.0" y="156.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="1" font-weight="700" text-anchor="middle" fill="#2d3f4b" ></text><text x="450.0" y="177.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#2d3f4b" font-style="italic">heat lamps, pulse oximeter (940 nm)</text><rect x="60" y="196" width="400" height="56" rx="8" fill="#fff3c4" stroke="#2d3f4b" stroke-width="1.5"/><text x="72.0" y="218.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2d3f4b" >Visible light</text><text x="72.0" y="239.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >about 400 to 700 nm</text><text x="450.0" y="218.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="1" font-weight="700" text-anchor="middle" fill="#2d3f4b" ></text><text x="450.0" y="239.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#2d3f4b" font-style="italic">red, orange, yellow, green, blue, violet</text><rect x="60" y="258" width="400" height="56" rx="8" fill="#e8e1f5" stroke="#2d3f4b" stroke-width="1.5"/><text x="72.0" y="280.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2d3f4b" >Ultraviolet</text><text x="72.0" y="301.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >about 10 to 400 nm</text><text x="450.0" y="280.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="1" font-weight="700" text-anchor="middle" fill="#2d3f4b" ></text><text x="450.0" y="301.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#2d3f4b" font-style="italic">sunburn, germicidal UV-C lamps</text><rect x="60" y="320" width="400" height="56" rx="8" fill="#dde3ee" stroke="#2d3f4b" stroke-width="1.5"/><text x="72.0" y="342.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2d3f4b" >X-rays</text><text x="72.0" y="363.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >about 0.01 to 10 nm</text><text x="450.0" y="342.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="1" font-weight="700" text-anchor="middle" fill="#2d3f4b" ></text><text x="450.0" y="363.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#2d3f4b" font-style="italic">radiographs, CT scans</text><rect x="60" y="382" width="400" height="56" rx="8" fill="#d5dbe6" stroke="#2d3f4b" stroke-width="1.5"/><text x="72.0" y="404.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2d3f4b" >Gamma rays</text><text x="72.0" y="425.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >under about 0.01 nm</text><text x="450.0" y="404.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="1" font-weight="700" text-anchor="middle" fill="#2d3f4b" ></text><text x="450.0" y="425.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#2d3f4b" font-style="italic">nuclear medicine, radiation therapy</text><path d="M16 20 L16 432" stroke="#2d3f4b" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="36.0" y="222.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" transform="rotate(90 36 222.0)">wavelength shorter, frequency and energy higher</text></svg>