<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 408" width="470" height="408" role="img" aria-label="Bohr model energy levels of hydrogen drawn as horizontal lines labeled n = 1 at the bottom through n = 5 near the top, getting closer together as n increases. An upward arrow from n = 1 to n = 2 shows an electron absorbing energy (excitation). A downward arrow from n = 3 to n = 2 with a wavy line shows an electron emitting a photon (relaxation). Below, hydrogen visible emission spectrum: four bright lines on a black background at 410, 434, 486, and 656 nanometers. Each line is one jump down between two energy levels."><rect width="470" height="408" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><line x1="90" y1="262" x2="330" y2="262" stroke="#2d3f4b" stroke-width="2.5"/><text x="80.0" y="267.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#2d3f4b" >n = 1</text><line x1="90" y1="162" x2="330" y2="162" stroke="#2d3f4b" stroke-width="2.5"/><text x="80.0" y="167.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#2d3f4b" >n = 2</text><line x1="90" y1="117" x2="330" y2="117" stroke="#2d3f4b" stroke-width="2.5"/><text x="80.0" y="122.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#2d3f4b" >n = 3</text><line x1="90" y1="88" x2="330" y2="88" stroke="#2d3f4b" stroke-width="2.5"/><text x="80.0" y="93.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#2d3f4b" >n = 4</text><line x1="90" y1="72" x2="330" y2="72" stroke="#2d3f4b" stroke-width="1.5"/><line x1="90" y1="63" x2="330" y2="63" stroke="#2d3f4b" stroke-width="1.5"/><text x="80.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#2d3f4b" >n = 5, 6 ...</text><text x="235.0" y="30.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Energy levels of the hydrogen atom</text><path d="M370 262 L370 62" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="380.0" y="150.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#2d3f4b" >higher</text><text x="380.0" y="166.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#2d3f4b" >energy</text><path d="M125 260 L125 165" stroke="#2f6f9a" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="133.0" y="215.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >absorb energy:</text><text x="133.0" y="230.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >excitation</text><path d="M240 118 L240 159" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M250 140 q8 -8 16 0 t16 0 t16 0" stroke="#c0392b" stroke-width="2" fill="none"/><text x="250.0" y="200.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >emit a photon:</text><text x="250.0" y="215.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >relaxation</text><rect x="40" y="290" width="400" height="50" fill="#111"/><rect x="73.29411764705883" y="290" width="4" height="50" fill="#7d4ccc"/><text x="75.3" y="358.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >410</text><rect x="101.52941176470588" y="290" width="4" height="50" fill="#4f5bd5"/><text x="103.5" y="358.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >434</text><rect x="162.70588235294116" y="290" width="4" height="50" fill="#2fa6c8"/><text x="164.7" y="358.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >486</text><rect x="362.70588235294116" y="290" width="4" height="50" fill="#e0322a"/><text x="364.7" y="358.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >656</text><text x="240.0" y="380.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Hydrogen emission lines, wavelength in nm (visible region)</text><text x="240.0" y="398.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Each line is one jump down between two energy levels.</text></svg>