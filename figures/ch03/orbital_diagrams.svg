<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 200" width="470" height="200" role="img" aria-label="Orbital diagrams. Nitrogen, 1s2 2s2 2p3: the 1s box and the 2s box each hold a pair of electrons drawn as one up arrow and one down arrow; the three 2p boxes each hold one up arrow. Oxygen, 1s2 2s2 2p4: 1s and 2s boxes paired; the first 2p box holds a pair and the other two hold one up arrow each. Each box is one orbital holding at most 2 electrons with opposite spins (Pauli). In the 2p subshell, electrons spread out one per box before pairing (Hund)."><rect width="470" height="200" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="10.0" y="30.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#2d3f4b" >Nitrogen</text><text x="10.0" y="50.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >1s² 2s² 2p³</text><rect x="150" y="10" width="34" height="30" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><path d="M161 35 V16 M156 21 L161 15 L166 21" stroke="#2d3f4b" stroke-width="2" fill="none"/><path d="M173 15 V34 M168 29 L173 35 L178 29" stroke="#2d3f4b" stroke-width="2" fill="none"/><text x="167.0" y="58.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >1s</text><rect x="206" y="10" width="34" height="30" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><path d="M217 35 V16 M212 21 L217 15 L222 21" stroke="#2d3f4b" stroke-width="2" fill="none"/><path d="M229 15 V34 M224 29 L229 35 L234 29" stroke="#2d3f4b" stroke-width="2" fill="none"/><text x="223.0" y="58.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >2s</text><rect x="262" y="10" width="34" height="30"