oke="#2d3f4b" stroke-width="2" fill="none"/><path d="M285 85 V104 M280 99 L285 105 L290 99" stroke="#2d3f4b" stroke-width="2" fill="none"/><rect x="296" y="80" width="34" height="30" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><path d="M307 105 V86 M302 91 L307 85 L312 91" stroke="#2d3f4b" stroke-width="2" fill="none"/><rect x="330" y="80" width="34" height="30" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><path d="M341 105 V86 M336 91 L341 85 L346 91" stroke="#2d3f4b" stroke-width="2" fill="none"/><text x="313.0" y="128.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >2p</text><text x="10.0" y="170.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >Each box is one orbital (holds at most 2 electrons, opposite spins: Pauli).</text><text x="10.0" y="190.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >In 2p, electrons spread out one per box before pairing (Hund).</text></svg>