<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 382" width="470" height="382" role="img" aria-label="Diagonal method for the order in which subshells fill. Subshells are written in rows: 1s; 2s 2p; 3s 3p 3d; 4s 4p 4d 4f; 5s 5p 5d 5f; 6s 6p 6d; 7s 7p. Red diagonal arrows run from upper right to lower left. Following them from the top gives the filling order: 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, 5s, 4d, 5p, 6s, 4f, 5d, 6p, 7s, 5f, 6d, 7p. Capacity: an s subshell holds 2 electrons, p holds 6, d holds 10, and f holds 14."><rect width="470" height="382" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="24.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Order in which subshells fill</text><path d="M108 35 L27 80" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M108 73 L27 118" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M178 73 L27 156" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M178 111 L27 194" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M248 111 L27 232" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M248 149 L27 270" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M318 149 L27 308" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M318 187 L97 308" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="46" y="42" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="70.0" y="61.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1s</text><rect x="46" y="80" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="70.0" y="99.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2s</text><rect x="116" y="80" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="140.0" y="99.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2p</text><rect x="46" y="118" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="70.0" y="137.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >3s</text><rect x="116" y="118" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="140.0" y="137.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >3p</text><rect x="186" y="118" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="210.0" y="137.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >3d</text><rect x="46" y="156" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="70.0" y="175.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >4s</text><rect x="116" y="156" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="140.0" y="175.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >4p</text><rect x="186" y="156" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="210.0" y="175.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >4d</