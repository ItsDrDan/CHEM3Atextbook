 font-weight="800" text-anchor="middle" fill="#2d3f4b" >6d</text><rect x="46" y="270" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="70.0" y="289.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >7s</text><rect x="116" y="270" width="48" height="28" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="1.2"/><text x="140.0" y="289.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >7p</text><text x="360.0" y="80.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#2d3f4b" >Follow each red</text><text x="360.0" y="97.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#2d3f4b" >arrow from top</text><text x="360.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#2d3f4b" >right to bottom</text><text x="360.0" y="131.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#2d3f4b" >left, starting</text><text x="360.0" y="148.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#2d3f4b" >at the top.</text><text x="235.0" y="350.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d 7p</text><text x="235.0" y="372.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Capacity: s holds 2, p holds 6, d holds 10, f holds 14 electrons</text></svg>