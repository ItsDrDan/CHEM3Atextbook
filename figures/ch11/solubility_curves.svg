<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 328" width="470" height="328" role="img" aria-label="Two graphs of solubility versus temperature. Left, solids, in grams per 100 g of water from 0 to 100 °C: potassium nitrate rises steeply from about 13 g at 0 °C to about 246 g at 100 °C; sodium chloride is nearly flat, from about 36 g to about 40 g. Right, a gas: oxygen dissolved in water in contact with air, in milligrams per liter, falls from about 14.6 mg/L at 0 °C to about 6.4 mg/L at 40 °C. Most solids dissolve better in hot water; gases dissolve better in cold water."><rect width="470" height="328" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Temperature and solubility</text><text x="145.0" y="40.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Solids: usually rise</text><line x1="60.0" y1="250.0" x2="230.0" y2="250.0" stroke="#2d3f4b" stroke-width="1.8"/><line x1="60.0" y1="250.0" x2="60.0" y2="54.0" stroke="#2d3f4b" stroke-width="1.8"/><line x1="60.0" y1="250.0" x2="60.0" y2="254.0" stroke="#2d3f4b" stroke-width="1.2"/><text x="60.0" y="266.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >0</text><line x1="145.0" y1="250.0" x2="145.0" y2="254.0" stroke="#2d3f4b" stroke-width="1.2"/><text x="145.0" y="266.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >50</text><line x1="230.0" y1="250.0" x2="230.0" y2="254.