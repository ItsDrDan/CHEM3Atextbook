<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 278" width="470" height="278" role="img" aria-label="Three beakers of solution. Unsaturated: fewer dissolved particles than the maximum; more solid would dissolve. Saturated: the maximum amount is dissolved at this temperature; extra solid stays undissolved on the bottom. Supersaturated: more dissolved than the maximum; it is unstable, and a seed crystal dropped in makes solid crash out. Solubility is the most solute that dissolves in a given amount of solvent at a given temperature."><rect width="470" height="278" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Unsaturated, saturated, and supersaturated</text><rect x="40" y="87.5" width="78" height="81.5" fill="#dbe7f6"/><path d="M39 60 v110 h80 v-110" fill="none" stroke="#2d3f4b" stroke-width="2.2"/><circle cx="61.7" cy="133.0" r="3" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="70.4" cy="137.1" r="3" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="87.3" cy="100.5" r="3" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="46.9" cy="152.9" r="3" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="63.1" cy="111.9" r="3" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="111.7" cy="128.0" r="3" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="101.2" cy="128.4" r="3" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="88.2" cy="106.2" r="3" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="0.8"/><text x="79.0" y="192.0" font-family="Lato, Helvetica, A