<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 328" width="470" height="328" role="img" aria-label="Henry's law, shown with two soda bottles. Left, sealed: the space above the liquid holds CO2 at high pressure, and many CO2 molecules are dissolved in the soda. Right, opened: the CO2 pressure above the liquid drops, CO2 escapes from the bottle, fewer molecules stay dissolved, and bubbles form. More gas pressure above a liquid means more gas dissolves at the same temperature."><rect width="470" height="328" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Henry's law: gas pressure and solubility</text><path d="M90 50 h70 v20 l20 20 v170 a10 10 0 0 1 -10 10 h-90 a10 10 0 0 1 -10 -10 v-170 l20 -20 z" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><rect x="72" y="112" width="106" height="146" fill="#e3f2e1"/><line x1="72.0" y1="112.0" x2="178.0" y2="112.0" stroke="#2e7d32" stroke-width="1.6"/><rect x="88" y="38" width="74" height="12" rx="3" fill="#55606b"/><circle cx="128.5" cy="84.7" r="3.4" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="82.7" cy="95.6" r="3.4" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="98.9" cy="83.7" r="3.4" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="115.7" cy="95.2" r="3.4" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="169.0" cy="89.8" r="3.4" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="169.4" cy="105.8" r="3.4" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="101.8" cy="78.2" r="3.4" fill="#f2b8b0" stroke="#2d3