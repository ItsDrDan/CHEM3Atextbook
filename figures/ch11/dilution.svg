text-anchor="middle" fill="#2d3f4b" >moles of solute stay the same: M<tspan baseline-shift="sub" font-size="10">1</tspan>V<tspan baseline-shift="sub" font-size="10">1</tspan> = M<tspan baseline-shift="sub" font-size="10">2</tspan>V<tspan baseline-shift="sub" font-size="10">2</tspan></text><text x="235.0" y="292.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Only water is added, so V goes up and M goes down (inverse).</text></svg>