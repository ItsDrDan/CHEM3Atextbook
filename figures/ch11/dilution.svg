<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 318" width="470" height="318" role="img" aria-label="Diluting a stock solution. A beaker of concentrated stock solution (molarity M1) with many solute particles. A pipet removes volume V1 of it and transfers it to a volumetric flask, which is then filled with water to the line, giving a diluted solution with molarity M2 and volume V2 and the same solute particles spread out. The moles of solute stay the same: M1 V1 = M2 V2. Only water is added, so the volume goes up and the molarity goes down, an inverse relationship."><rect width="470" height="318" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Diluting a stock solution</text><rect x="31" y="94.0" width="88" height="95.0" fill="#c9b6e4"/><path d="M30 70 v120 h90 v-120" fill="none" stroke="#2d3f4b" stroke-width="2.2"/><text x="75.0" y="214.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >stock: M<tspan baseline-shift="sub" font-size="10">1</tspan></text><text x="75.0" y="232.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >concentrated</text><circle cx="84.6" cy="161.8" r="3" fill="#7b4fa0" stroke="#2d3f4b" stroke-width="0.6"/><circle cx="98.0" cy="179.1" r="3" fill="#7b4fa0" stroke="#2d3f4b" stroke-width="0.6"/><circle cx="93.7" cy="177.3" r="3" fill="#7b4fa0" stroke="#2d3f4b" stroke-width="0.6"/><circle cx="38.3" cy="138.0" r="3" fill="#7b4fa0" stroke="#2d3f4b" stroke-width="0.6"/><circle cx