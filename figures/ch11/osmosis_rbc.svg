<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 292" width="470" height="292" role="img" aria-label="Red blood cells in three solutions. Hypotonic, with fewer solutes outside the cell than inside: water flows into the cell, which swells and may burst (hemolysis). Isotonic, with equal solute concentrations: there is no net flow of water, and the cell keeps its normal disk shape. Hypertonic, with more solutes outside: water flows out of the cell, which shrinks and develops a spiky surface (crenation). Blue arrows show the net flow of water, from lower to higher solute concentration. 0.9% NaCl (normal saline) is isotonic with blood."><rect width="470" height="292" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Red blood cells in three solutions</text><rect x="14" y="40" width="130" height="200" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="79.0" y="62.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Hypotonic</text><circle cx="79.0" cy="140.0" r="36" fill="#f6cbc4" stroke="#2d3f4b" stroke-width="1.6"/><path d="M137.0 140.0 L119.0 140.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><path d="M79.0 198.0 L79.0 180.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><path d="M21.0 140.0 L39.0 140.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><path d="M79.0 82.0 L79.0 100.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><text x="79.0" y="208.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >fewer solutes outside</text><text x="79.0" y="224.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >cell swells, may burst</text><rect x="170" y="40" width="130" height="200" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="62.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Isotonic</text><ellipse cx="235" cy="140" rx="38" ry="24" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1.6"/><ellipse cx="235" cy="140" rx="18" ry="9" fill="#e79a90"/><path d="M179.0 134.0 L193.0 134.0" stroke="#2f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arB)"/><path d="M193.0 146.0 L179.0 146.0" stroke="#2f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arB)"/><text x="235.0" y="208.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >equal solutes</text><text x="235.0" y="224.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >no net water flow</text><rect x="326" y="40" width="130" height="200" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="391.0" y="62.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Hypertonic</text><polygon points="423.5,140.0 428.4,146.4 419.1,150.4 418.4,157.5 407.2,158.0 401.0,164.0 391.0,160.8 381.0,164.0 374.8,158.0 363.6,157.5 362.9,150.4 353.6,146.4 358.5,140.0 353.6,133.6 362.9,129.6 363.6,122.5 374.8,122.0 381.0,116.0 391.0,119.2 401.0,116.0 407.2,122.0 418.4,122.5 419.1,129.6 428.4,133.6" fill="#e79a90" stroke="#2d3f4b" stroke-width="1.6"/><path d="M425.0 140.0 L445.0 140.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><path d="M391.0 170.0 L391.0 188.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><path d="M357.0 140.0 L337.0 140.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><path d="M391.0 110.0 L391.0 92.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><text x="391.0" y="208.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >more solutes outside</text><text x="391.0" y="224.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >cell shrinks (crenation)</text><text x="235.0" y="262.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Blue arrows: net flow of water, from lower to higher solute concentration.</text><text x="235.0" y="280.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >0.9% NaCl (normal saline) is isotonic with blood.</text></svg>