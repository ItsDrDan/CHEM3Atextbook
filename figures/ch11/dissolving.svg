, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Ion–dipole attractions pull the ions out of the crystal;</text><text x="235.0" y="240.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >each ion is surrounded by water molecules (hydrated).</text><text x="235.0" y="276.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >"Like dissolves like": polar or ionic solutes dissolve in polar solvents;</text><text x="235.0" y="294.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >nonpolar solutes dissolve in nonpolar solvents.</text></svg>