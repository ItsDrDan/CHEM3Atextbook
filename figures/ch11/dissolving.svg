<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 306" width="470" height="306" role="img" aria-label="How an ionic compound dissolves in water. On the left, a crystal of NaCl made of alternating sodium and chloride ions. An arrow points to two dissolved ions on the right: a sodium ion surrounded by six water molecules with their partially negative oxygen ends facing it, and a chloride ion surrounded by six water molecules with their partially positive hydrogen ends facing it. Ion–dipole attractions pull the ions out of the crystal, and each ion is surrounded by water molecules (hydrated). Like dissolves like: polar or ionic solutes dissolve in polar solvents, and nonpolar solutes dissolve in nonpolar solvents."><rect width="470" height="306" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >How an ionic compound dissolves in water</text><rect x="10" y="38" width="450" height="214" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><circle cx="40.0" cy="120.0" r="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="40.0" y="124.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >+</text><circle cx="40.0" cy="146.0" r="11" fill="#cfe8cf" stroke="#2d3f4b" stroke-width="1.2"/><text x="40.0" y="150.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >−</text><circle cx="40.0" cy="172.0" r="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="40.0" y="176.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >+</text><circle cx="66.0" cy="120.0" r="11" fill="#cfe8cf" stroke="#2d3f4b" stroke-width="1.2"/><text x="66.0" y="124.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >−</text><circle cx="66.0" cy="146.0" r="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="66.0" y="150.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >+</text><circle cx="66.0" cy="172.0" r="11" fill="#cfe8cf" stroke="#2d3f4b" stroke-width="1.2"/><text x="66.0" y="176.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >−</text><circle cx="92.0" cy="120.0" r="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="92.0" y="124.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >+</text><circle cx="92.0" cy="146.0" r="11" fill="#cfe8cf" stroke="#2d3f4b" stroke-width="1.2"/><text x="92.0" y="150.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >−</text><circle cx="92.0" cy="172.0" r="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="92.0" y="176.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >+</text><text x="66.0" y="196.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NaCl crystal</text><path d="M120.0 146.0 L160.0 146.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><circle cx="230.0" cy="120.0" r="10" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.4"/><text x="230.0" y="124.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weig