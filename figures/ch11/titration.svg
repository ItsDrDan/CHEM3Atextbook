<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 400" width="470" height="400" role="img" aria-label="An acid–base titration. A buret, read from 0.00 mL at the top, holds sodium hydroxide of known molarity. Below it, a flask holds the acid and an indicator, colorless at the start. Base is added drop by drop until the endpoint, when the solution turns a first lasting faint pink. Steps: 1, moles of base = liters times molarity; 2, use the mole ratio from the balanced equation; 3, molarity of acid = moles of acid divided by liters of acid. The volume used is the final buret reading minus the initial reading."><rect width="470" height="400" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >An acid–base titration</text><rect x="96" y="36" width="20" height="170" rx="3" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><rect x="98" y="60" width="16" height="140" fill="#dbe7f6"/><line x1="96.0" y1="48.0" x2="104.0" y2="48.0" stroke="#2d3f4b" stroke-width="1"/><line x1="96.0" y1="64.0" x2="104.0" y2="64.0" stroke="#2d3f4b" stroke-width="1"/><line x1="96.0" y1="80.0" x2="104.0" y2="80.0" stroke="#2d3f4b" stroke-width="1"/><line x1="96.0" y1="96.0" x2="104.0" y2="96.0" stroke="#2d3f4b" stroke-width="1"/><line x1="96.0" y1="112.0" x2="104.0" y2="112.0" stroke="#2d3f4b" stroke-width="1"/><line x1="96.0" y1="128.0" x2="104.0" y2="128.0" stroke="#2d3f4b" stroke-width="1"/><line x1="96.0" y1="144.0" x2="104.0" y2="144.0" stroke="#2d3f4b" stroke-width="1"/><line x1="96.0" y1="160.0" x2="104.0" y2="160.0" stroke="#2d3f4b" stroke-width="1"/><line x1="96.0" y1="176.0" x2="104.0" y2="176.0" stroke="#2d3f4b" stroke-width="1"/><line x1="96.0" y1="192.0" x2="104.0" y2="192.0" stroke="#2d3f4b" stroke-width="1"/><text x="124.0" y="52.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#2d3f4b" >0.00 mL</text><text x="124.0" y="70.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" text-anchor="start" fill="#2d3f4b" >buret: NaOH,</text><text x="124.0" y="84.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" text-anchor="start" fill="#2d3f4b" >known M</text><path d="M102 206 h8 v14 h-2 v10 h-4 v-10 h-2 z" fill="#55606b"/><circle cx="106.0" cy="238.0" r="3" fill="#dbe7f6" stroke="#2f5fa8" stroke-width="1"/><path d="M96 250 h20 v30 l40 60 a8 8 0 0 1 -7 12 h-86 a8 8 0 0 1 -7 -12 l40 -60 z" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><path d="M72 316 h68 l16 24 a8 8 0 0 1 -7 12 h-86 a8 8 0 0 1 -7 -12 z" fill="#f5f6fb"/><text x="106.0" y="372.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >acid + indicator</text><text x="106.0" y="388.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >colorless at start</text><path d="M170.0 320.0 L230.0 320.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M290 250 h20 v30 l40 60 a8 8 0 0 1 -7 12 h-86 a8 8 0 0 1 -7 -12 l40 -60 z" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><path d="M266 316 h68 l16 24 a8 8 0 0 1 -7 12 h-86 a8 8 0 0 1 -7 -12 z" fill="#f7c6dc"/><text x="300.0" y="372.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >endpoint</text><text x="300.0" y="388.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >first lasting faint pink</text><rect x="250" y="40" width="210" height="170" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="262.0" y="70.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >1. mol base = L × M</text><text x="262.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >2. mole ratio from</text><text x="262.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >    the balanced equation</text><text x="262.0" y="136.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >3. M acid = mol acid ÷ L acid</text><text x="355.0" y="170.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Volume used = final − initial</text><text x="355.0" y="188.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >buret reading</text></svg>