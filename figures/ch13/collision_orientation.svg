<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 356" width="470" height="356" role="img" aria-label="Collision theory for carbon monoxide reacting with nitrogen dioxide to form carbon dioxide and nitric oxide. Top panel, effective: the carbon end of CO strikes an oxygen atom of NO2 with enough energy, the oxygen atom transfers, and CO2 and NO form. Bottom panel, not effective: the oxygen end of CO hits the nitrogen side of NO2, and the two molecules bounce apart unchanged. Effective collisions need the right orientation and at least the activation energy."><rect width="470" height="356" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A collision must have the right orientation</text><text x="235.0" y="40.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >CO + NO<tspan baseline-shift="sub" font-size="10">2</tspan> → CO<tspan baseline-shift="sub" font-size="10">2</tspan> + NO</text><rect x="10" y="52" width="450" height="128" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.6"/><text x="22.0" y="72.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2e7d32" >Effective: C of CO hits an O of NO<tspan baseline-shift="sub" font-size="10">2</tspan>, with enough energy</text><line x1="40.0" y1="120.0" x2="62.0" y2="120.0" stroke="#2d3f4b" stroke-width="3"/><circle cx="40.0" cy="120.0" r="11" fill="#e57373" stroke="#2d3f4b" stroke-width="1.3"/><text x="40.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="62.0" cy="120.0" r="12" fill="#555" stroke="#2d3f4b" stroke-width="1.3"/><text x="62.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#fff" >C</text><path d="M88.0 120.0 L118.0 120.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><line x1="170.0" y1="120.0" x2="148.0" y2="120.0" stroke="#2d3f4b" stroke-width="3"/><line x1="170.0" y1="120.0" x2="182.0" y2="101.0" stroke="#2d3f4b" stroke-width="3"/><circle cx="148.0" cy="120.0" r="11" fill="#e57373" stroke="#2d3f4b" stroke-width="1.3"/><text x="148.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="182.0" cy="101.0" r="11" fill="#e57373" stroke="#2d3f4b" stroke-width="1.3"/><text x="182.0" y="105.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="170.0" cy="120.0" r="12" fill="#7fa7e0" stroke="#2d3f4b" stroke-width="1.3"/><text x="170.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >N</text><path d="M206.0 120.0 L250.0 120.0" stroke="#2e7d32" stroke-width="2.6" fill="none" marker-end="url(#arG)"/><line x1="282.0" y1="120.0" x2="326.0" y2="120.0" stroke="#2d3f4b" stroke-width="3"/><circle cx="282.0" cy="120.0" r="11" fill="#e57373" stroke="#2d3f4b" stroke-width="1.3"/><text x="282.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="304.0" cy="120.0" r="12" fill="#555" stroke="#2d3f4b" stroke-width="1.3"/><text x="304.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#fff" >C</text><circle cx="326.0" cy="120.0" r="11" fill="#e57373" stroke="#2d3f4b" stroke-width="1.3"/><text x="326.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><line x1="380.0" y1="120.0" x2="402.0" y2="120.0" stroke="#2d3f4b" stroke-width="3"/><circle cx="380.0" cy="120.0" r="12" fill="#7fa7e0" stroke="#2d3f4b" stroke-width="1.3"/><text x="380.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >N</text><circle cx="402.0" cy="120.0" r="11" fill="#e57373" stroke="#2d3f4b" stroke-width="1.3"/><text x="402.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><text x="304.0" y="154.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >CO<tspan baseline-shift="sub" font-size="10">2</tspan></text><text x="391.0" y="154.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NO</text><text x="345.0" y="124.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >+</text><text x="150.0" y="170.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >reaction happens</text><rect x="10" y="192" width="450" height="128" rx="10" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.6"/><text x="22.0" y="212.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#c0392b" >Not effective: O of CO hits the N side, so they bounce apart</text><line x1="40.0" y1="262.0" x2="62.0" y2="262.0" stroke="#2d3f4b" stroke-width="3"/><circle cx="40.0" cy="262.0" r="12" fill="#555" stroke="#2d3f4b" stroke-width="1.3"/><text x="40.0" y="266.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#fff" >C</text><circle cx="62.0" cy="262.0" r="11" fill="#e57373" stroke="#2d3f4b" stroke-width="1.3"/><text x="62.0" y="266.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><path d="M88.0 262.0 L118.0 262.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><line x1="150.0" y1="262.0" x2="172.0" y2="262.0" stroke="#2d3f4b" stroke-width="3"/><line x1="150.0" y1="262.0" x2="138.0" y2="243.0" stroke="#2d3f4b" stroke-width="3"/><circle cx="172.0" cy="262.0" r="11" fill="#e57373" stroke="#2d3f4b" stroke-width="1.3"/><text x="172.0" y="266.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="138.0" cy="243.0" r="11" fill="#e57373" stroke="#2d3f4b" stroke-width="1.3"/><text x="138.0" y="247.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="150.0" cy="262.0" r="12" fill="#7fa7e0" stroke="#2d3f4b" stroke-width="1.3"/><text x="150.0" y="266.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >N</text><path d="M206.0 262.0 L250.0 262.0" stroke="#c0392b" stroke-width="2.6" fill="none" marker-end="url(#arR)"/><line x1="282.0" y1="250.0" x2="304.0" y2="250.0" stroke="#2d3f4b" stroke-width="3"/><circle cx="282.0" cy="250.0" r="12" fill="#555" stroke="#2d3f4b" stroke-width="1.3"/><text x="282.0" y="254.5" font-family="Lato, Helvetica, 