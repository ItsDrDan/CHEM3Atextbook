<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" width="470" height="330" role="img" aria-label="Four ways to speed up a reaction, in four panels. More concentration: a box with a few particles becomes a box with many particles, so there are more collisions per second. Higher temperature: cool, slow particles become hot, fast-moving particles, so collisions are more frequent and more energetic. More surface area: one solid lump is broken into a powder, so more particles are exposed. Add a catalyst: a small energy diagram shows the dashed catalyzed path with a lower hill, a lower activation energy. Each change raises the number of effective collisions per second."><rect width="470" height="330" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Four ways to speed up a reaction</text><rect x="10" y="40" width="220" height="124" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >More concentration</text><text x="120.0" y="154.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >more collisions per second</text><rect x="240" y="40" width="220" height="124" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="350.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Higher temperature</text><text x="350.0" y="154.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >faster and harder collisions</text><rect x="10" y="172" width="220" height="124" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="192.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >More surface area</text><text x="120.0" y="286.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >more particles exposed</text><rect x="240" y="172" width="220" height="124" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="350.0" y="192.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Add a catalyst</text><text x="350.0" y="286.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >lower activation energy</text><rect x="24" y="68" width="86" height="58" rx="4" fill="#fff" stroke="#2d3f4b" stroke-width="1.2"/><circle cx="50.4" cy="111.2" r="4.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="87.6" cy="87.0" r="4.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="71.7" cy="94.9" r="4.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="80.9" cy="108.8" r="4.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><rect x="130" y="68" width="86" height="58" rx="4" fill="#fff" stroke="#2d3f4b" stroke-width="1.2"/><circle cx="204.9" cy="115.4" r="4.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="151.8" cy="80.0