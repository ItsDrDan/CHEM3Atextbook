<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 336" width="470" height="336" role="img" aria-label="Hemoglobin and oxygen, Hb plus O2 in equilibrium with HbO2, simplified. Left panel, in the lungs: the oxygen pressure in the alveoli is high, so the equilibrium shifts right and red blood cells load oxygen; arrows point from oxygen molecules into the cell. Right panel, in working tissues: oxygen pressure is low, so the equilibrium shifts left and HbO2 releases oxygen; arrows point out of the cell. Bottom: carbon monoxide binds hemoglobin far more tightly than oxygen, so hemoglobin tied up as HbCO cannot carry oxygen. That binding is also an equilibrium, one that lies far to the right."><rect width="470" height="336" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Hemoglobin and oxygen: one equilibrium, two places</text><text x="150.0" y="52.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#2d3f4b" >Hb + O<tspan baseline-shift="sub" font-size="10">2</tspan></text><path d="M162.0 45.0 H202.0 l-7 -5" stroke="#2d3f4b" stroke-width="2" fill="none"/><path d="M202.0 51.0 H162.0 l7 5" stroke="#2d3f4b" stroke-width="2" fill="none"/><text x="210.0" y="52.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#2d3f4b" >HbO<tspan baseline-shift="sub" font-size="10">2</tspan></text><text x="290.0" y="52.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#55606b" >(simplified)</text><rect x="10" y="70" width="220" height="180" rx="10" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.6"/><text x="120.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#c0392b" >In the lungs (alveoli)</text><ellipse cx="120" cy="150" rx="46" ry="26" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1.6"/><ellipse cx="120" cy="150" rx="20" ry="9" fill="#e79a90"/><line x1="35.0" y1="186.0" x2="45.0" y2="186.0" stroke="#2d3f4b" stroke-width="2"/><circle cx="35.0" cy="186.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><circle cx="45.0" cy="186.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><path d="M40.0 176.0 L92.0 162.6" stroke="#c0392b" stroke-width="1.4" fill="none" marker-end="url(#arR)"/><line x1="75.0" y1="118.0" x2="85.0" y2="118.0" stroke="#2d3f4b" stroke-width="2"/><circle cx="75.0" cy="118.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><circle cx="85.0" cy="118.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><path d="M80.0 128.0 L106.0 138.8" stroke="#c0392b" stroke-width="1.4" fill="none" marker-end="url(#arR)"/><line x1="115.0" y1="186.0" x2="125.0" y2="186.0" stroke="#2d3f4b" stroke-width="2"/><circle cx="115.0" cy="186.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><circle cx="125.0" cy="186.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><path d="M120.0 176.0 L120.0 162.6" stroke="#c0392b" stroke-width="1.4" fill="none" marker-end="url(#arR)"/><line x1="155.0" y1="118.0" x2="165.0" y2="118.0" stroke="#2d3f4b" stroke-width="2"/><circle cx="155.0" cy="118.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><circle cx="165.0" cy="118.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><path d="M160.0 128.0 L134.0 138.8" stroke="#c0392b" stroke-width="1.4" fill="none" marker-end="url(#arR)"/><line x1="195.0" y1="186.0" x2="205.0" y2="186.0" stroke="#2d3f4b" stroke-width="2"/><circle cx="195.0" cy="186.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><circle cx="205.0" cy="186.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><path d="M200.0 176.0 L148.0 162.6" stroke="#c0392b" stroke-width="1.4" fill="none" marker-end="url(#arR)"/><text x="120.0" y="212.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >high O<tspan baseline-shift="sub" font-size="10">2</tspan> pressure</text><text x="120.0" y="228.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#c0392b" >→ shifts RIGHT</text><text x="120.0" y="244.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >hemoglobin loads O<tspan baseline-shift="sub" font-size="10">2</tspan></text><rect x="240" y="70" width="220" height="180" rx="10" fill="#eef3fb" stroke="#2f5fa8" stroke-width="1.6"/><text x="350.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2f5fa8" >In working tissues</text><ellipse cx="350" cy="150" rx="46" ry="26" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1.6"/><ellipse cx="350" cy="150" rx="20" ry="9" fill="#e79a90"/><line x1="265.0" y1="186.0" x2="275.0" y2="186.0" stroke="#2d3f4b" stroke-width="2"/><circle cx="265.0" cy="186.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><circle cx="275.0" cy="186.0" r="5" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><path d="M314.0 166.2 L270.0 176.0" stroke="#2f5fa8" stroke-width="1.4" fill="none" marker-end="url(#arB)"/><line x1="305.0" y1="118.0" x2="315.0" y2="118.0" st