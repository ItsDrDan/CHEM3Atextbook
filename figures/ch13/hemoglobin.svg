<tspan baseline-shift="sub" font-size="10">2</tspan></text><rect x="10" y="262" width="450" height="64" rx="10" fill="#f6f6f6" stroke="#55606b" stroke-width="1.6"/><text x="235.0" y="284.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Carbon monoxide: Hb + CO → HbCO binds far more tightly than O<tspan baseline-shift="sub" font-size="10">2</tspan>,</text><text x="235.0" y="302.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >so hemoglobin tied up as HbCO cannot carry O<tspan baseline-shift="sub" font-size="10">2</tspan> (shown → for simplicity;</text><text x="235.0" y="318.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >it is also an equilibrium, which lies far to the right).</text></svg>