<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 356" width="470" height="356" role="img" aria-label="Breathing rate shifts the carbon dioxide equilibrium in blood: CO2 plus H2O in equilibrium with carbonic acid, H2CO3, in equilibrium with hydrogen ion plus bicarbonate ion. Breathing fast, hyperventilation: more CO2 is breathed out, so CO2 is removed, the equilibrium shifts left, there are fewer hydrogen ions, and blood pH rises, respiratory alkalosis. Breathing slow or blocked, hypoventilation: CO2 builds up in the blood, the equilibrium shifts right, there are more hydrogen ions, and blood pH falls, respiratory acidosis. Normal arterial blood pH is about 7.35 to 7.45."><rect width="470" height="356" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Breathing rate shifts the CO<tspan baseline-shift="sub" font-size="10">2</tspan> equilibrium in blood</text><text x="20.0" y="58.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" text-anchor="start" fill="#2d3f4b" >CO<tspan baseline-shift="sub" font-size="10">2</tspan> + H<tspan baseline-shift="sub" font-size="10">2</tspan>O</text><path d="M125.0 51.0 H155.0 l-7 -5" stroke="#2d3f4b" stroke-width="2" fill="none"/><path d="M155.0 57.0 H125.0 l7 5" stroke="#2d3f4b" stroke-width="2" fill="none"/><text x="166.0" y="58.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" text-anchor="start" fill="#2d3f4b" >H<tspan baseline-shift="sub" font-size="10">2</tspan>CO<tspan baseline-shift="sub" font-size="10">3</tspan></text><path d="M235.0 51.0 H265.0 l-7 -5" stroke="#2d3f4b" stroke-width="2" fill="none"/><path d="M265.0 57.0 H235.0 l7 5" stroke="#2d3f4b" stroke-width="2" fill="none"/><text x="276.0" y="58.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" text-anchor="start" fill="#2d3f4b" >H<tspan baseline-shift="super" font-size="10">+</tspan> + HCO<tspan baseline-shift="sub" font-size="10">3</tspan><tspan baseline-shift="super" font-size="10">−</tspan></text><text x="20.0" y="78.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#55606b" >(blood)</text><text x="166.0" y="78.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#55606b" >carbonic acid</text><text x="276.0" y="78.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#55606b" >H ion + bicarbonate</text><rect x="10" y="94" width="450" height="108" rx="10" fill="#eef3fb" stroke="#2f5fa8" stroke-width="1.6"/><text x="24.0" y="118.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" text-anchor="start" fill="#2f5fa8" >Breathing fast (hyperventilation)</text><text x="36.0" y="144.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >more CO<tspan baseline-shift="sub" font-size="10">2</tspan> breathed out → CO<tspan baseline-shift="sub" font-size="10">2</tspan> removed</text><text x="36.0" y="164.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >shift LEFT ← : fewer H<tspan baseline-shift="super" font-size="10">+</tspan> ions</text><text x="36.0" y="184.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >blood pH rises (respiratory alkalosis)</text><rect x="10" y="214" width="450" height="108" rx="10" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.6"/><text x="24.0" y="238.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" text-anchor="start" fill="#c0392b" >Breathing slow or blocked (hypoventilation)</text><text x="36.0" y="264.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >CO<tspan baseline-shift="sub" font-size="10">2</tspan> builds up in the blood</text><text x="36.0" y="284.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >shift RIGHT → : more H<tspan baseline-shift="super" font-size="10">+</tspan> ions</text><text x="36.0" y="304.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >blood pH falls (respiratory acidosis)</text><text x="235.0" y="344.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Normal arterial blood pH is about 7.35 to 7.45.</text></svg>