<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 296" width="470" height="296" role="img" aria-label="What the size of the equilibrium constant K tells you. A number line runs from 10 to the minus 30, through 1, to 10 to the 30. Three boxes below it. K much less than 1: an equilibrium mixture that is mostly reactant squares, with almost no product: mostly reactants at equilibrium. K about 1: about half reactant squares and half product circles: sizable amounts of both. K much greater than 1: mostly product circles: mostly products at equilibrium. K equals products divided by reactants."><rect width="470" height="296" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >What the size of K tells you</text><path d="M30.0 90.0 L446.0 90.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><line x1="30.0" y1="82.0" x2="30.0" y2="98.0" stroke="#2d3f4b" stroke-width="2"/><line x1="60.0" y1="84.0" x2="60.0" y2="96.0" stroke="#2d3f4b" stroke-width="2"/><text x="60.0" y="76.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >10<tspan baseline-shift="super" font-size="10">−30</tspan></text><line x1="150.0" y1="84.0" x2="150.0" y2="96.0" stroke="#2d3f4b" stroke-width="2"/><text x="150.0" y="76.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >10<tspan baseline-shift="super" font-size="10">−3</tspan></text><line x1="235.0" y1="84.0" x2="235.0" y2="96.0" stroke="#2d3f4b" stroke-width="2"/><text x="235.0" y="76.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1</text><line x1="320.0" y1="84.0" x2="320.0" y2="96.0" stroke="#2d3f4b" stroke-width="2"/><text x="320.0" y="76.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >10<tspan baseline-shift="super" font-size="10">3</tspan></text><line x1="410.0" y1="84.0" x2="410.0" y2="96.0" stroke="#2d3f4b" stroke-width="2"/><text x="410.0" y="76.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >10<tspan baseline-shift="super" font-size="10">30</tspan></text><text x="446.0" y="112.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="end" fill="#2d3f4b" >K</text><rect x="12" y="124" width="138" height="128" rx="10" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.6"/><text x="81.0" y="148.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#c0392b" >K ≪ 1</text><text x="81.0" y="234.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >mostly reactants</text><text x="81.0" y="248.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >at equilibrium</text><rect x="166" y="124" width="138" height="128" rx="10" fill="#f3f3f3" stroke="#55606b" stroke-width="1.6"/><text x="235.0" y="148.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-an