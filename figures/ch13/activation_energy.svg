<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 358" width="470" height="358" role="img" aria-label="Energy diagram for an exothermic reaction. The vertical axis is energy and the horizontal axis is reaction progress. Reactants start at a medium energy, the path climbs over a hill, and products end at a lower energy. The height of the hill above the reactants is the activation energy, Ea. A dashed second path, with a catalyst, has a lower hill, so a lower activation energy. The energy difference between reactants and products, delta H, is the same for both paths. A catalyst lowers the energy hill for both directions and does not change delta H."><rect width="470" height="358" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Activation energy, with and without a catalyst</text><path d="M60.0 300.0 L440.0 300.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><path d="M60.0 300.0 L60.0 50.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><text x="250.0" y="322.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Reaction progress</text><text x="46.0" y="175.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font