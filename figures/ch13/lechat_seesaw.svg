<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 498" width="470" height="498" role="img" aria-label="Le Chatelier's principle shown as a seesaw with reactant squares on the left and product circles on the right. Step 1, at equilibrium: four reactants and four products, the seesaw level; rates are equal and amounts constant. Step 2, stress: extra reactant is added, eight squares on the left, and the seesaw tips; there are more forward collisions. Step 3, the system shifts right, toward products: some of the new reactant becomes product, six and six, and a new equilibrium is reached. Add a substance and the reaction shifts away from it; remove a substance and it shifts toward it."><rect width="470" height="498" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Le Chatelier's principle: add a reactant</text><text x="20.0" y="44.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start" fill="#2d3f4b" >1. At equilibrium</text><text x="20.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#55606b" >rates equal; amounts constant</text><path d="M217 150 L235 114 L253 150 z" fill="#c9d3dc" stroke="#2d3f4b" stroke-width="1.6"/><line x1=