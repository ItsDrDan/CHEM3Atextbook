<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 362" width="470" height="362" role="img" aria-label="Squeezing a gas mixture of dinitrogen tetroxide and nitrogen dioxide, N2O4 in equilibrium with 2 NO2: one mole of gas on the left and two moles on the right. Before, at equilibrium in a large container: 6 N2O4 molecules and 8 NO2 molecules, 14 molecules in all. A piston squeezes the container to a smaller volume. After, the equilibrium has shifted left: 8 N2O4 and 4 NO2, 12 molecules, because pairs of NO2 combined. A smaller volume, or higher pressure, shifts the reaction toward fewer moles of gas; a larger volume, or lower pressure, shifts it toward more moles of gas."><rect width="470" height="362" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Squeezing a gas mixture: count moles of gas</text><text x="160.0" y="46.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="end" fill="#2d3f4b" >N<tspan baseline-shift="sub" font-size="10">2</tspan>O<tspan baseline-shift="sub" font-size="10">4</tspan>(g)</text><path d="M168.0 39.0 H202.0 l-7 -5" stroke="#2d3f4b" stroke-width="2" fill="none"/><path d="M202.0 45.0 H168.0 l7 5" stroke="#2d3f4b" stroke-width="2" fill="none"/><text x="210.0" y="46.0" font-