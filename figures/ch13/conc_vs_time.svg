<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 336" width="470" height="336" role="img" aria-label="Graph of concentration versus time for a reaction that starts with only reactant. The reactant concentration, a solid line, starts high and falls; the product concentration, a dashed line, starts at zero and rises. After a while both lines become flat: at equilibrium the concentrations are constant, but they are not equal. In this example the product ends up at about twice the reactant concentration."><rect width="470" height="336" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Concentrations level off at equilibrium</text><path d="M60.0 280.0 L440.0 280.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><path d="M60.0 280.0 L60.0 50.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><text x="250.0" y="302.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Time</text><text x="46.0" y="165.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" transform="rotate(-90 46 165.0)">Concentration</text><polyline points="60.0,68.4 64.5,77.0 69.0,85.2 73.5,92.8 78.0,99