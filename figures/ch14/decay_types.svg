<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 396" width="470" height="396" role="img" aria-label="Four kinds of radioactive decay, each shown as a nucleus of protons and neutrons giving off radiation. Alpha decay: the nucleus throws out a helium-4 nucleus of 2 protons and 2 neutrons, written with mass number 4 and atomic number 2; the new nucleus has A minus 4 and Z minus 2. Beta decay: a neutron changes into a proton and an electron, which leaves as a beta particle with mass number 0 and charge minus 1; A stays the same and Z goes up by 1. Positron emission: a proton changes into a neutron and a positron, mass number 0 and charge plus 1; A stays the same and Z goes down by 1. Gamma emission: the nucleus releases energy only as a gamma ray, mass number 0 and charge 0; A and Z stay the same."><rect width="470" height="396" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b4fa0"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Four kinds of radioactive decay</text><rect x="10" y="36" width="22