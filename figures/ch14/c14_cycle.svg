<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 340" width="470" height="340" role="img" aria-label="How carbon-14 is made and used for dating. In the upper atmosphere, a neutron from cosmic rays hits a nitrogen-14 nucleus and makes carbon-14 and a proton. The carbon-14 joins oxygen to make carbon dioxide. Plants take in this carbon dioxide, and animals eat the plants, so every living thing keeps a constant ratio of carbon-14 to carbon-12. At death no new carbon-14 comes in; the carbon-14 already there decays to nitrogen-14 by beta decay, and the ratio falls. The half-life is 5730 years, and the method is useful to about 50,000 years."><rect width="470" height="340" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b4fa0"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Carbon-14: made in the air, kept while alive</text><rect x="10" y="36" width="450" height="92" rx="10" fill="#eef4fb" stroke="#2d3f4b" stroke-width="1.6"/><text x="24.0" y="56.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2f5fa8" >Upper atmosphere</text><text x="24.0" y="76.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#2d3f4b" >cosmic-ray neutron</text><text x="57.0" y="95.8" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#2d3f4b" >1</text><text x="57.0" y="108.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#2d3f4b" >0</text><text x="59.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >n</text><text x="84.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2d3f4b" >+</text><text x="115.0" y="95.8" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#2d3f4b" >14</text><text x="115.0" y="108.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#2d3f4b" >7</text><text x="117.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >N</text><text x="146.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2d3f4b" >→</text><text x="183.0" y="95.8" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#c0392b" >14</text><text x="183.0" y="108.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#c0392b" >6</text><text x="185.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#c0392b" >C</text><text x="212.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2d3f4b" >+</text><text x="239.0" y="95.8" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#2d3f4b" >1</text><text x="239.0" y="108.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#2d3f4b" >1</text><text x="241.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >H</text><text x="400.0" y="72.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >C-14 joins O₂</text><text x="400.0" y="90.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >to make ¹⁴CO₂</text><path d="M400.0 100.0 L400.0 150.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="10" y="150" width="450" height="110" rx="10" fill="#f1f8ef" stroke="#2d3f4b" stroke-width="1.6"/><text x="24.0" y="172.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2e7d32" >While alive: constant C-14/C-12 ratio</text><path d="M80 245 v-40" stroke="#2e7d32" stroke-width="4"/><ellipse cx="68" cy="205" rx="14" ry="8" fill="#9ccc8f" stroke="#2e7d32"/><ellipse cx="92" cy="198" rx="14" ry="8" fill="#9ccc8f" stroke="#2e7d32"/><text x="80.0" y="254.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >plants take in CO₂</text><path d="M140.0 215.0 L200.0 215.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="170.0" y="206.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >eaten</text><ellipse cx="250" cy="220" rx="30" ry="16" fill="#f3e1c7" stroke="#2d3f4b" stroke-width="1.4"/><circle cx="284.0" cy="206.0" r="10" fill="#f3e1c7" stroke="#2d3f4b" stroke-width="1.4"/><line x1="232.0" y1="234.0" x2="232.0" y2="242.0" stroke="#2d3f4b" stroke-width="2"/><line x1="244.0" y1="234.0" x2="244.0" y2="242.0" stroke="#2d3f4b" stroke-width="2"/><line x1="258.0" y1="234.0" x2="258.0" y2="242.0" stroke="#2d3f4b" stroke-width="2"/><line x1="270.0" y1="234.0" x2="270.0" y2="242.0" stroke="#2d3f4b" stroke-width="2"/><text x="254.0" y="254.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >animals eat plants</text><path d="M320.0 215.0 L372.0 215.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="410.0" y="196.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >at death:</text><text x="410.0" y="212.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >no new C-14</text><text x="410.0" y="228.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >C-14 decays,</text><text x="410.0" y="244.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >ratio falls</text><rect x="10" y="276" width="450" height="52" rx="10" fill="#fdf3ec" stroke="#2d3f4b" stroke-width="1.6"/><text x="39.0" y="297.8" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#c0392b" >14</text><text x="39.0" y="310.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#c0392b" >6</text><text x="41.0" y="306.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#c0392b" >C</text><text x="68.0" y="306.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2d3f4b" >→</text><text x="101.0" y="297.8" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#2d3f4b" >14</text><text x="101.0" y="310.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#2d3f4b" >7</text><text x="103.0" y="306.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >N</text><text x="130.0" y="306.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2d3f4b" >+</text><text x="159.0" y="297.8" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#2d3f4b" >0</text><text x="159.0" y="310.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" text-anchor="end" fill="#2d3f4b" >−1</text><text x="161.0" y="306.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >e</text><text x="330.0" y="300.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#d35400" >half-life 5730 years</text><text x="330.0" y="318.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >useful to about 50,000 years</text></svg>