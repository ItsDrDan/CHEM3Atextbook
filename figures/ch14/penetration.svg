<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 314" width="470" height="314" role="img" aria-label="Penetrating power of alpha, beta, and gamma radiation. Three barriers stand in a row: a sheet of paper (or skin), a sheet of aluminum (or about 5 mm of wood), and a thick block of lead (or thick concrete). The alpha particle arrow, in red, stops at the paper. The beta particle arrow, in blue, passes the paper and stops at the aluminum. The gamma ray, a purple wave, passes the paper and aluminum and comes out of the lead weakened. Alpha is stopped by paper, beta by aluminum, and gamma needs lead or concrete."><rect width="470" height="314" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b4fa0"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >How far each kind of radiation gets</text><rect x="10" y="36" width="450" height="250" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><rect x="150" y="58" width="6" height="170" fill="#f3ead2" stroke="#2d3f4b" stroke-width="1.4"/><text x="153.0" y="246.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Paper</text><rect x="250" y="58" width="14" height="170" fill="#cfd6dc" stroke="#2d3f4b" stroke-width="1.4"/><text x="257.0" y="246.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Aluminum</text><rect x="350" y="58" width="30" height="170" fill="#8d969e" stroke="#2d3f4b" stroke-width="1.4"/><text x="365.0" y="246.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Lead</text><text x="155.0" y="262.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >or skin</text><text x="257.0" y="262.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >or wood, ~5 mm</text><text x="365.0" y="262.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >or thick concrete</text><text x="153.0" y="276.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="1" font-weight="700" text-anchor="middle" fill="#2d3f4b" ></text><text x="22.0" y="89.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start" fill="#c0392b" >α alpha</text><path d="M84.0 84.0 L147.0 84.0" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arR)"/><text x="22.0" y="145.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start" fill="#2f5fa8" >β beta</text><path d="M84.0 140.0 L247.0 140.0" stroke="#2f5fa8" stroke-width="3" fill="none" marker-end="url(#arB)"/><text x="22.0" y="201.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start" fill="#7b4fa0" >γ gamma</text><polyline points="84