<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 388" width="470" height="388" role="img" aria-label="A fission chain reaction. One neutron hits a uranium-235 nucleus, which splits into two smaller fragment nuclei and releases energy and three neutrons. Each of those three neutrons hits another uranium-235 nucleus, which splits and releases three more neutrons, so the next step has nine neutrons, and the number keeps growing. Each split releases energy and 2 to 3 neutrons. A critical mass is enough uranium-235 for the chain to keep going."><rect width="470" height="388" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b4fa0"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A fission chain reaction</text><text x="28.0" y="166.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >n</text><circle cx="30.0" cy="180.0" r="4.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1.2"/><path d="M36.0 180.0 L80.0 180.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><circle cx="100.0" cy="180.0" r="15" fill="#f5d9a8" stroke="#2d3f4b" stroke-width="1.6"/><text x="100.0" y="183.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >U-235</text><path d="M100.0 164.0 L100.0 136.0" stroke="#7b4fa0" stroke-width="1.4" fill="none" marker-end="url(#arP)"/><circle cx="100.0" cy="128.0" r="8" fill="#e3c7e8" stroke="#2d3f4b" stroke-width="1.2"/><text x="100.0" y="116.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7b4fa0" >fragment</text><path d="M100.0 196.0 L100.0 224.0" stroke="#7b4fa0" stroke-width="1.4" fill="none" marker-end="url(#arP)"/><circle cx="100.0" cy="232.0" r="8" fill="#e3c7e8" stroke="#2d3f4b" stroke-width="1.2"/><text x="100.0" y="252.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#7b4fa0" >fragment</text><path d="M116.0 180.0 L212.0 90.0" stroke="#2d3f4b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><circle cx="230.0" cy="90.0" r="15" fill="#f5d9a8" stroke="#2d3f4b" stroke-width="1.6"/><text x="230.0" y="93.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >U-235</text><path d="M116.0 180.0 L212.0 180.0" stroke="#2d3f4b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><circle cx="230.0" cy="180.0" r="15" fill="#f5d9a8" stroke="#2d3f4b" stroke-width="1.6"/><text x="230.0" y="183.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >U-235</text><path d="M116.0 180.0 L212.0 270.0" stroke="#2d3f4b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><circle cx="230.0" cy="270.0" r="15" fill="#f5d9a8" stroke="#2d3f4b" stroke-width="1.6"/><text x="230.0" y="273.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="8.5