 r="10" fill="#f5d9a8" stroke="#2d3f4b" stroke-width="1.6"/><text x="364.0" y="303.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="8" font-weight="800" text-anchor="middle" fill="#2d3f4b" >U</text><path d="M375.0 300.0 L410.0 306.0" stroke="#55606b" stroke-width="1" fill="none" marker-end="url(#ar)" stroke-dasharray="3 2"/><text x="100.0" y="330.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#c0392b" >1 neutron</text><text x="230.0" y="330.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#c0392b" >3 neutrons</text><text x="364.0" y="330.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#c0392b" >9 neutrons …</text><text x="235.0" y="356.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Each split releases energy and 2–3 neutrons.</text><text x="235.0" y="374.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Critical mass: enough U-235 for the chain to keep going.</text></svg>