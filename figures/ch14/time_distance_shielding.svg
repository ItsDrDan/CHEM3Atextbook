<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 266" width="470" height="266" role="img" aria-label="Three ways to lower a radiation dose. Time: a clock face; spend less time near the source. Distance: a radioactive source with marks at 1 meter and 2 meters; doubling the distance gives one-fourth the dose. Shielding: a gamma ray passes into a lead barrier and comes out much weaker; examples are a lead apron, lead glass, and concrete. ALARA means keeping doses as low as reasonably achievable."><rect width="470" height="266" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b4fa0"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Three ways to lower your dose</text><rect x="10" y="36" width="144" height="196" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="82.0" y="58.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2f5fa8" >Time</text><circle cx="82.0" cy="120.0" r="34" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><line x1="82.0" y1="120.0" x2="82.0" y2="96.0" stroke="#2d3f4b" stroke-width="2.4"/><line x1="82.0" y1="120.0" x2="102.0" y2="128.0" stroke="#2d3f4b" stroke-width="2.4"/><path d="M82 86 A34 34 0 0 1 116 120 L82 120 Z" fill="#cfe0f5" opacity="0.8"/><text x="82.0" y="186.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >less time near</text><text x="82.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >the source</text><rect x="163" y="36" width="144" height="196" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="58.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2e7d32" >Distance</text><circle cx="183.0" cy="120.0" r="8" fill="#f6d36b" stroke="#2d3f4b" stroke-width="1.4"/><text x="183.0" y="124.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#2d3f4b" >☢</text><line x1="193.0" y1="120.0" x2="293.0" y2="120.0" stroke="#c9d3dc" stroke-width="1" stroke-dasharray="3 3"/><text x="223.0" y="108.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >1 m</text><text x="281.0" y="108.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >2 m</text><line x1="223.0" y1="112.0" x2="223.0" y2="128.0" stroke="#2d3f4b" stroke-width="1.6"/><line x1="281.0" y1="112.0" x2="281.0" y2="128.0" stroke="#2d3f4b" stroke-width="1.6"/><text x="223.0" y="146.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >dose D</text><text x="281.0" y="146.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >D ÷ 4</text><text x="235.0" y="186.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >2× the distance</text><text x="235.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >= ¼ the dose</text><rect x="316" y="36" width="144" height="196" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="388.0" y="58.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#7b4fa0" >Shielding</text><circle cx="340.0" cy="120.0" r="8" fill="#f6d36b" stroke="#2d3f4b" stroke-width="1.4"/><text x="340.0" y="124.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#2d3f4b" >☢</text><polyline points="350.0,120.0 351.5,123.2 353.0,123.8 354.5,121.2 356.0,117.6 357.5,116.0 359.0,117.6 360.5,121.2 362.0,123.8 363.5,123.2 365.0,120.0 366.5,116.8 368.0,116.2 369.5,118.8 371.0,122.4 372.5,124.0 374.0,122.4 375.5,118.8 377.0,116.2 378.5,116.8 380.0,120.0 381.5,123.2 383.0,123.8 384.5,121.2 386.0,117.6 387.5,116.0 389.0,117.6 390.5,121.2 392.0,123.8 393.5,123.2 395.0,120.0" fill="none" stroke="#7b4fa0" stroke-width="2"/><rect x="398" y="88" width="16" height="64" fill="#8d969e" stroke="#2d3f4b"/><polyline points="416.0,120.0 417.5,121.2 419.0,121.4 420.5,120.5 422.0,119.1 423.5,118.5 425.0,119.1 426.5,120.5 428.0,121.4 429.5,121.2 431.0,120.0 432.5,118.8 434.0,118.6 435.5,119.5 437.0,120.9 438.5,121.5 440.0,120.9 441.5,119.5 443.0,118.6 444.5,118.8 446.0,120.0" fill="none" stroke="#7b4fa0" stroke-width="1.4"/><text x="388.0" y="186.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >lead apron, lead</text><text x="388.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >glass, concrete</text><text x="235.0" y="252.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >ALARA: keep doses as low as reasonably achievable.</text></svg>