<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" width="470" height="330" role="img" aria-label="A decay curve. The percent of a radioisotope remaining is plotted against the number of half-lives, from 0 to 5. The curve starts at 100 percent and falls to 50 percent after 1 half-life, 25 percent after 2, 12.5 percent after 3, 6.25 percent after 4, and 3.13 percent after 5. A second scale shows the times for technetium-99m, whose half-life is 6 hours: 0, 6, 12, 18, 24, and 30 hours. Amount left equals the initial amount times one-half to the power n."><rect width="470" height="330" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b4fa0"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Half-life: half is left after each half-life</text><line x1="66.0" y1="266.0" x2="416.0" y2="266.0" stroke="#2d3f4b" stroke-width="1.8"/><line x1="66.0" y1="266.0" x2="66.0" y2="52.0" stroke="#2d3f4b" stroke-width="1.8"/><line x1="66.0" y1="266.0" x2="66.0" y2="270.0" stroke="#2d3f4b" stroke-width="1.2"/><text x