<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 320" width="470" height="320" role="img" aria-label="A simplified nuclear power plant. Inside a containment building, the reactor core holds fuel rods of uranium-235 pellets and movable control rods that absorb neutrons; water flows through the core as both coolant and moderator. Hot water from the core flows to a steam generator and returns cooler. Steam from the steam generator turns a turbine, which spins a generator that makes electricity. The used steam is cooled back to water in a condenser by cooling water from the ocean or a cooling tower, and the water is pumped back to the steam generator."><rect width="470" height="320" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b4fa0"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A nuclear power plant (simplified)</text><rect x="20" y="60" width="130" height="190" rx="4" fill="#eef1f4" stroke="#2d3f4b" stroke-width="2"/><text x="85.0" y="52.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >containment</text><rect x="32" y="96" width="96" height="124" rx="6" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><rect x="42" y="130" width="8" height="82" fill="#f5d9a8" stroke="#2d3f4b" stroke-width="1"/><rect x="59" y="130" width="8" height="82" fill="#f5d9a8" stroke="#2d3f4b" stroke-width="1"/><rect x="76" y="130" width="8" height="82" fill="#f5d9a8" stroke="#2d3f4b" stroke-width="1"/><rect x="93" y="130" width="8" height="82" fill="#f5d9a8" stroke="#2d3f4b" stroke-width="1"/><rect x="110" y="130" width="8" height="82" fill="#f5d9a8" stroke="#2d3f4b" stroke-width="1"/><rect x="51" y="104" width="6" height="58" fill="#55606b"/><rect x="68" y="104" width="6" height="58" fill="#55606b"/><rect x="85" y="104" width="6" height="58" fill="#55606b"/><rect x="102" y="104" width="6" height="58" fill="#55606b"/><text x="80.0" y="238.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >reactor core</text><rect x="190" y="80" width="60" height="120" rx="6" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="220.0" y="236.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >steam</text><text x="220.0" y="249.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >generator</text><path d="M128 120 H186" stroke="#c0392b" stroke-width="3.5" fill="none" marker-end="url(#arR)"/><path d="M190 180 H132" stroke="#2f5fa8" stroke-width="3.5" fill="none" marker-end="url(#arB)"/><text x="166.0" y="111.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#c0392b" >hot</text><text x="166.0" y="198.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2f5fa8" >cooler</text><path d="M250 110 H292" stroke="#55606b" stroke-width="3.5" fill="none" marker-end="url(#ar)"/><text x="270.0" y="100.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#2d3f4b" >steam</text><polygon points="296,86 336,98 336,122 296,134" fill="#e7ecf0" stroke="#2d3f4b" stroke-width="1.6"/><text x="316.0" y="76.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >turbine</text><line x1="336.0" y1="110.0" x2="358.0" y2="110.0" stroke="#2d3f4b" stroke-width="3"/><circle cx="380.0" cy="110.0" r="22" fill="#fff3d6" stroke="#2d3f4b" stroke-width="1.8"/><text x="380.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >G</text><text x="380.0" y="76.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >generator</text><path d="M402 110 H452" stroke="#d35400" stroke-width="2.4" fill="none" marker-end="url(#arO)"/><text x="428.0" y="130.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#d35400" >electricity</text><rect x="270" y="170" width="170" height="44" rx="6" fill="#e3f0fb" stroke="#2d3f4b" stroke-width="1.6"/><text x="355.0" y="197.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >condenser</text><path d="M316 134 V166" stroke="#55606b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M270 206 H236 V206 V204" stroke="#2f5fa8" stroke-width="2.4" fill="none"/><path d="M236.0 207.0 L236.0 203.0" stroke="#2f5fa8" stroke-width="2.4" fill="none" marker-end="url(#arB)"/><path d="M330 248 V218" stroke="#2f5fa8" stroke-width="2.2" fill="none" marker-end="url(#arB)"/><path d="M380 216 V246" stroke="#2f5fa8" stroke-width="2.2" fill="none" marker-end="url(#arB)"/><text x="355.0" y="266.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" fill="#2f5fa8" >cooling water</text><text x="355.0" y="280.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(ocean or cooling tower)</text><text x="20.0" y="276.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#2d3f4b" >fuel rods: U-235 pellets</text><text x="20.0" y="292.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#2d3f4b" >control rods: absorb neutrons</text><text x="20.0" y="308.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#2d3f4b" >water: coolant + moderator</text></svg>