troke="#2d3f4b" stroke-width="1.4"/><text x="141.0" y="146.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" text-anchor="middle" fill="#fff" >+</text><circle cx="159" cy="141" r="10" fill="#cfd6dc" stroke="#2d3f4b" stroke-width="1.4"/><text x="159.0" y="145.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >n</text><circle cx="141" cy="159" r="10" fill="#cfd6dc" stroke="#2d3f4b" stroke-width="1.4"/><text x="141.0" y="163.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >n</text><circle cx="159" cy="159" r="10" fill="#d9534f" stroke="#2d3f4b" stroke-width="1.4"/><text x="159.0" y="164.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" text-anchor="middle" fill="#fff" >+</text><circle cx="150" cy="150" r="10" fill="#d9534f" stroke="#2d3f4b" stroke-width="1.4"/><text x="150.0" y="155.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" text-anchor="middle" fill="#fff" >+</text><circle cx="150" cy="134" r="10" fill="#cfd6dc" stroke="#2d3f4b" stroke-width="1.4"/><text x="150.0" y="138.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >n</text><line x1="168" y1="156" x2="300" y2="190" stroke="#2d3f4b" stroke-width="1.2"/><text x="305.0" y="184.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >Nucleus:</text><text x="305.0" y="203.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >protons (+) and</text><text x="305.0" y="221.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >neutrons (n); almost</text><text x="305.0" y="239.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >all of the mass</text><line x1="255" y1="90" x2="300" y2="60" stroke="#2d3f4b" stroke-width="1.2"/><text x="305.0" y="55.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >Electron cloud:</text><text x="305.0" y="74.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >electrons (&#8722;) move</text><text x="305.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >through mostly</text><text x="305.0" y="110.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >empty space</text><text x="235.0" y="300.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Not to scale: if the nucleus were the size of a pea,</text><text x="235.0" y="318.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >the atom would be about the size of a football stadium.</text></svg>