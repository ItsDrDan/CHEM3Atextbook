<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" width="470" height="330" role="img" aria-label="Model of an atom. A tiny central nucleus contains protons, marked plus, and neutrons, marked n; it holds almost all of the mass. Electrons, marked minus, move through a large, mostly empty electron cloud around the nucleus. Not to scale: if the nucleus were the size of a pea, the atom would be about the size of a football stadium."><rect width="470" height="330" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker>
<pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fdf0d8"/><circle cx="2" cy="2" r="1" fill="#d4a24c"/></pattern>
