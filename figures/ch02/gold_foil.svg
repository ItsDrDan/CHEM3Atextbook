<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 322" width="470" height="322" role="img" aria-label="Rutherford gold foil experiment. A beam of positively charged alpha particles from a source is aimed at a thin gold foil, with a detector screen around it. Most alpha particles pass straight through the foil; a few are deflected at large angles or bounce back. Conclusion: an atom is mostly empty space with a tiny, dense, positively charged nucleus."><rect width="470" height="322" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker>
<pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fdf0d8"/><circle cx="2" cy="2" r="1" fill="#d4a24c"/></pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5e8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8cc286" stroke-width="1.6"/></pattern></defs><rect x="10" y="80" width="60" height="50" rx="6" fill="#eef5fb" stroke="#2d3f4b" stroke-width="2"/><text x="40.0" y="102.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >alpha</text><text x="40.0" y="118.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >source</text><rect x="70" y="98" width="70" height="14" fill="#f2f2f2" stroke="#2d3f4b" stroke-width="1.5"/><rect x="230" y="40" width="10" height="130" fill="#e8c35a" stroke="#2d3f4b" stroke-width="1.5"/><text x="235.0" y="30.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >gold foil</text><path d="M330 20 A150 150 0 0 1 330 190" fill="none" stroke="#9aa" stroke-width="10" opacity=".5"/><text x="395.0" y="212.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >detector screen</text><path d="M140 91 L325 85.4" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M140 98 L325 95.2" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M140 105 L325 105.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M140 112 L325 114.8" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M140 119 L325 124.6" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M150 105 L232 105" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M235 101 Q240 60 300 30" stroke="#c0392b" stroke-width="2.6" fill="none" marker-end="url(#ar)"/><path d="M235 103 Q200 95 170 70" stroke="#c0392b" stroke-width="2.6" fill="none" marker-end="url(#ar)"/><text x="10.0" y="250.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >Most alpha particles pass straight through.</text><text x="10.0" y="270.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >A few bounce off at large angles (red arrows).</text><text x="10.0" y="290.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >Conclusion: an atom is mostly empty space with a</text><text x="10.0" y="310.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#2d3f4b" >tiny, dense, positively charged nucleus.</text></svg>