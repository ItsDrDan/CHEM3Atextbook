<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 270" width="470" height="270" role="img" aria-label="Ion formation. A sodium atom, 11 protons and 11 electrons, charge 0, loses 1 electron to become a sodium ion, Na plus, with 11 protons and 10 electrons, charge 1+: a cation. A chlorine atom, 17 protons and 17 electrons, charge 0, gains 1 electron to become a chloride ion, Cl minus, with 17 protons and 18 electrons, charge 1 minus: an anion. The number of protons never changes when an ion forms; only the number of electrons does."><rect width="470" height="270" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker>
<pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fdf0d8"/><circle cx="2" cy="2" r="1" fill="#d4a24c"/></pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5e8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8cc286" stroke-width="1.6"/></pattern></defs><rect x="10" y="20" width="130" height="78" rx="10" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><text x="75.0" y="44.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na atom</text><text x="75.0" y="66.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >11 p&#8314;, 11 e&#8315;</text><text x="75.0" y="86.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >charge: 0</text><path d="M146 59 L196 59" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="171.0" y="48.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >loses</text><text x="171.0" y="82.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >1 e&#8315;</text><rect x="202" y="20" width="130" height="78" rx="10" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><text x="267.0" y="44.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na&#8314; ion</text><text x="267.0" y="66.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >11 p&#8314;, 10 e&#8315;</text><text x="267.0" y="86.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >charge: 1+</text><text x="400.0" y="52.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >cation</text><text x="400.0" y="72.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(positive)</text><rect x="10" y="130" width="130" height="78" rx="10" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><text x="75.0" y="154.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cl atom</text><text x="75.0" y="176.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >17 p&#8314;, 17 e&#8315;</text><text x="75.0" y="196.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >charge: 0</text><path d="M146 169 L196 169" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="171.0" y="158.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >gains</text><text x="171.0" y="192.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >1 e&#8315;</text><rect x="202" y="130" width="130" height="78" rx="10" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><text x="267.0" y="154.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cl&#8315; ion</text><text x="267.0" y="176.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >17 p&#8314;, 18 e&#8315;</text><text x="267.0" y="196.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >charge: 1&#8722;</text><text x="400.0" y="162.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >anion</text><text x="400.0" y="182.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(negative)</text><text x="235.0" y="240.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >The number of protons never changes when an ion forms;</text><text x="235.0" y="258.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >only the number of electrons does.</text></svg>