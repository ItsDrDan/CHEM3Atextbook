<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" width="470" height="330" role="img" aria-label="Isotope notation: the element symbol X with the mass number A written at the upper left and the atomic number Z at the lower left. A equals protons plus neutrons; Z equals protons. Below, three isotopes of hydrogen: hydrogen-1 with 1 proton and 0 neutrons, hydrogen-2 (deuterium) with 1 proton and 1 neutron, and hydrogen-3 (tritium) with 1 proton and 2 neutrons; each has 1 electron."><rect width="470" height="330" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker>
<pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fdf0d8"/><circle cx="2" cy="2" r="1" fill="#d4a24c"/></pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#eaf5e8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8cc286" stroke-width="1.6"/></pattern></defs><text x="110.0" y="95.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" text-anchor="middle" fill="#2d3f4b" >X</text><text x="62.0" y="52.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A</text><text x="62.0" y="118.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Z</text><line x1="78" y1="44" x2="190" y2="30" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="28.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >mass number A = protons + neutrons</text><line x1="78" y1="112" x2="190" y2="130" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="136.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >atomic number Z = protons</text><line x1="140" y1="80" x2="190" y2="82" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="87.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >element symbol</text><line x1="10" y1="160" x2="460" y2="160" stroke="#bbb" stroke-dasharray="5 5"/><circle cx="80" cy="215" r="44" fill="#eef2fb" stroke="#2d3f4b" stroke-dasharray="4 4"/><circle cx="80" cy="215" r="11" fill="#d9534f" stroke="#2d3f4b" stroke-width="1.4"/><text x="80.0" y="220.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" text-anchor="middle" fill="#fff" >+</text><circle cx="120" cy="195" r="7" fill="#4a6fd1" stroke="#2d3f4b" stroke-width="1.2"/><text x="120.0" y="199.5" font-family="Lato, Helvetica, Arial, sans-serif"