<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 400" width="470" height="400" role="img" aria-label="A map connecting four quantities in boxes: hydronium concentration and hydroxide concentration across the top, pH and pOH across the bottom. Across the top: hydronium concentration times hydroxide concentration equals 1.0 times 10 to the minus 14. Across the bottom: pH plus pOH equals 14.00. Down the left: pH equals minus log of hydronium concentration, and back up: hydronium concentration equals 10 to the minus pH. Down the right: pOH equals minus log of hydroxide concentration, and back up: hydroxide concentration equals 10 to the minus pOH. All values are at 25 degrees Celsius; start from whatever you are given."><rect width="470" height="400" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="26.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Moving among pH, pOH, [H<tspan baseline-shift="sub" font-size="11">3</tspan>O<tspan baseline-shift="super" font-size="11">+</tspan>], and [OH<tspan baseline-shift="super" font-size="11">−</tspan>]</text><rect x="20" y="56" width="150" height="52" rx="10" fill="#fde9e7" stroke="#2d3f4b" stroke-width="1.6"/><text x="95.0" y="90.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" text-anchor="middle" fill="#2d3f4b" >[H<tspan baseline-shift="sub" font-size="11">3</tspan>O<tspan baseline-shift="super" font-size="11">+</tspan>]</text><rect x="300" y="56" width="150" height="52" rx="10" fill="#e3ecf8" stroke="#2d3f4b" stroke-width="1.6"/><text x="375.0" y="90.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" text-anchor="middle" fill="#2d3f4b" >[OH<tspan baseline-shift="super" font-size="11">−</tspan>]</text><rect x="20" y="226" width="150" height="52" rx="10" fill="#fde9e7" stroke="#2d3f4b" stroke-width="1.6"/><text x="95.0" y="260.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" text-anchor="middle" fill="#2d3f4b" >pH</text><rect x="300" y="226" width="150" height="52" rx="10" fill="#e3ecf8" stroke="#2d3f4b" stroke-width="1.6"/><text x="375.0" y="260.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" text-anchor="middle" fill="#2d3f4b" >pOH</text><line x1="170.0" y1="82.0" x2="300.0" y2="82.0" stroke="#2d3f4b" stroke-width="2.2"/><text x="235.0" y="72.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >[H<tspan baseline-shift="sub" font-size="11">3</tspan>O<tspan baseline-shift="super" font-size="11">+</tspan>][OH<tspan baseline-shift="super" font-size="11">−</tspan>]</text><text x="235.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >= 1.0 × 10<tspan baseline-shift="super" font-size="11">−14</tspan></text><line x1="170.0" y1="252.0" x2="300.0" y2="252.0" stroke="#2d3f4b" stroke-width="2.2"/><text x="235.0" y="242.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >pH + pOH</text><text x="235.0" y="274.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >= 14.00</text><path d="M50.0 110.0 L50.0 222.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="58.0" y="160.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >−log</text><path d="M140.0 222.0 L140.0 110.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="148.0" y="180.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >10<tspan baseline-shift="super" font-size="11">−pH</tspan></text><path d="M420.0 110.0 L420.0 222.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="412.0" y="160.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >−log</text><path d="M330.0 222.0 L330.0 110.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="322.0" y="180.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >10<tspan baseline-shift="super" font-size="11">−pOH</tspan></text><text x="235.0" y="314.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >pH = −log[H<tspan baseline-shift="sub" font-size="11">3</tspan>O<tspan baseline-shift="super" font-size="11">+</tspan>];  [H<tspan baseline-shift="sub" font-size="11">3</tspan>O<tspan baseline-shift="super" font-size="11">+</tspan>] = 10<tspan baseline-shift="super" font-size="11">−pH</tspan></text><text x="235.0" y="342.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >pOH = −log[OH<tspan baseline-shift="super" font-size="11">−</tspan>];  [OH<tspan baseline-shift="super" font-size="11">−</tspan>] = 10<tspan baseline-shift="super" font-size="11">−pOH</tspan></text><text x="235.0" y="384.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#55606b" >All at 25 °C. Start from whatever you are given.</text></svg>