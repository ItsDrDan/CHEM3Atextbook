<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" width="470" height="300" role="img" aria-label="The reaction HF plus H2O in equilibrium with F minus plus H3O plus, with labels. HF is the acid and F minus is its conjugate base; a red bracket above connects them and reads pair 1: HF loses H plus to become F minus. H2O is the base and H3O plus is its conjugate acid; a blue bracket below connects them and reads pair 2: H2O gains H plus to become H3O plus. Each pair differs by exactly one H plus, one proton. The labels name each role, so the colors are not needed to read the figure."><rect width="470" height="300" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="26.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Conjugate acid–base pairs</text><text x="50.0" y="150.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#2d3f4b" >HF</text><text x="100.0" y="150.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2d3f4b" >+</text><text x="150.0" y="150.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H<tspan baseline-shift="sub" font-size="15">2</tspan>O</text><text x="225.0" y="148.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#2d3f4b" >⇌</text><text x="300.0" y="150.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#2d3f4b" >F<tspan baseline-shift="super" font-size="16">−</tspan></text><text x="355.0" y="150.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2d3f4b" >+</text><text x="410.0" y="150.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H<tspan baseline-shift="sub" font-size="15">3</tspan>O<tspan baseline-shift="super" font-size="16">+</tspan></text><text x="50.0" y="180.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#c0392b" >acid</text><text x="150.0" y="180.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2f5fa8" >base</text><text x="300.0" y="180.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#c0392b" >conjugate</text><text x="300.0" y="198.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#c0392b" >base</text><text x="410.0" y="180.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2f5fa8" >conjugate</text><text x="410.0" y="198.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2f5fa8" >acid</text><path d="M50 122 V90 H300 V122" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arR)"/><text x="175.0" y="82.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#c0392b" >pair 1: HF loses H<tspan baseline-shift="super" font-size="11">+</tspan> → F<tspan baseline-shift="super" font-size="11">−</tspan></text><path d="M150 208 V240 H410 V208" fill="none" stroke="#2f5fa8" stroke-width="2.4" marker-end="url(#arB)"/><text x="280.0" y="262.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2f5fa8" >pair 2: H<tspan baseline-shift="sub" font-size="11">2</tspan>O gains H<tspan baseline-shift="super" font-size="11">+</tspan> → H<tspan baseline-shift="sub" font-size="11">3</tspan>O<tspan baseline-shift="super" font-size="11">+</tspan></text><text x="235.0" y="292.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Each pair differs by exactly one H<tspan baseline-shift="super" font-size="11">+</tspan> (one proton).</text></svg>