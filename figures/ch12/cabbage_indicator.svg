<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" width="470" height="300" role="img" aria-label="Six beakers of red cabbage indicator in solutions of different pH, each labeled with its pH range and color name: pH 1 to 2 red, pH 3 to 4 pink, pH 5 to 7 purple, pH 8 blue, pH 9 to 11 green, and pH 12 to 14 yellow. Acidic solutions give red and pink; basic solutions give blue, green, and yellow. Colors are approximate and vary with the cabbage."><rect width="470" height="300" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="26.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Red cabbage indicator colors</text><rect x="21" y="84.2" width="64" height="84.8" fill="#c2185b"/><path d="M20 60 v110 h66 v-110" fill="none" stroke="#2d3f4b" stroke-width="2.2"/><text x="53.0" y="196.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >pH 1–2</text><text x="53.0" y="216.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >red</text><rect x="94" y="84.2" width="64" height="84.8" fill="#d81b60"/><path d="M93 60 v110 h66 v-110" fill="none" stroke="#2d3f4b" stroke-width="2.2"/><text x="126.0" y="196.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >pH 3–4</text><text x="126.0" y="216.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" 