<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 470" width="470" height="470" role="img" aria-label="How a buffer resists pH change. Top: a buffer contains a weak acid, HA, and its conjugate base, A minus, for example carbonic acid and bicarbonate in blood. Left, add acid: the base part reacts, A minus plus H3O plus gives HA plus water, so the strong acid is used up and a weak acid forms. Right, add base: the acid part reacts, HA plus OH minus gives A minus plus water, so the strong base is used up and a weak base forms. Either way the pH changes only a little, until one part of the buffer runs out."><rect width="470" height="470" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="26.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#2d3f4b" >How a buffer resists pH change</text><rect x="30" y="46" width="410" height="98" rx="10" fill="#f3eef8" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="72.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Buffer: a weak acid + its conjugate base</text><text x="235.0" y="100.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#2d3f4b" >HA (weak acid)   and   A<tspan baseline-shift="super" font-size="11">−</tspan> (conjugate base)</text><text x="235.0" y="126.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#2d3f4b" >e.g., H<tspan baseline-shift="sub" font-size="11">2</tspan>CO<tspan baseline-shift="sub" font-size="11">3</tspan> and HCO<tspan baseline-shift="sub" font-size="11">3</tspan><tspan baseline-shift="super" font-size="11">−</tspan> in blood</text><path d="M160.0 148.0 L95.0 196.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M310.0 148.0 L375.0 196.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="10" y="200" width="220" height="190" rx="10" fill="#fde9e7" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#c0392b" >Add acid (H<tspan baseline-shift="sub" font-size="11">3</tspan>O<tspan baseline-shift="super" font-size="11">+</tspan>)</text><text x="120.0" y="252.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >the base part reacts:</text><text x="120.0" y="284.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A<tspan baseline-shift="super" font-size="11">−</tspan> + H<tspan baseline-shift="sub" font-size="11">3</tspan>O<tspan baseline-shift="super" font-size="11">+</tspan></text><text x="120.0" y="308.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >→ HA + H<tspan baseline-shift="sub" font-size="11">2</tspan>O</text><text x="120.0" y="342.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >strong acid is used up;</text><text x="120.0" y="362.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >a weak acid forms</text><rect x="240" y="200" width="220" height="190" rx="10" fill="#e3ecf8" stroke="#2d3f4b" stroke-width="1.6"/><text x="350.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2f5fa8" >Add base (OH<tspan baseline-shift="super" font-size="11">−</tspan>)</text><text x="350.0" y="252.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >the acid part reacts:</text><text x="350.0" y="284.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >HA + OH<tspan baseline-shift="super" font-size="11">−</tspan></text><text x="350.0" y="308.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >→ A<tspan baseline-shift="super" font-size="11">−</tspan> + H<tspan baseline-shift="sub" font-size="11">2</tspan>O</text><text x="350.0" y="342.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >strong base is used up;</text><text x="350.0" y="362.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >a weak base forms</text><text x="235.0" y="420.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Either way, the pH changes only a little,</text><text x="235.0" y="442.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >until one part of the buffer runs out.</text></svg>