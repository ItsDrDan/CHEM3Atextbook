<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 684" width="470" height="684" role="img" aria-label="The pH scale from 0 at the top to 14 at the bottom, with the hydronium ion concentration from 1 M (10 to the 0) at pH 0 to 10 to the minus 14 M at pH 14. Lower pH is more acidic; higher pH is more basic. Typical values: stomach acid 1.5 to 3.5, lemon juice about 2, cola about 2.5, vinegar about 3, black coffee about 5, milk about 6.5, pure water 7.00 (neutral), blood 7.35 to 7.45 (a narrow boxed band just above 7), baking soda in water about 8.3, milk of magnesia about 10.5, household ammonia about 11.5, bleach about 12.5, drain cleaner about 14. Each step of one pH unit is a tenfold change in hydronium ion concentration."><rect width="470" height="684" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="26.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#2d3f4b" >The pH scale</text><rect x="150" y="40.0" width="34" height="40" fill="#b71c1c" opacity="0.85"/><text x="140.0" y="65.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >0</text><rect x="150" y="80.0" width="34" height="40" fill="#c62828" opacity="0.85"/><text x="140.0" y="105.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >1</text><rect x="150" y="120.0" width="34" height="40" fill="#d84315" opacity="0.85"/><text x="140.0" y="145.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >2</text><rect x="150" y="160.0" width="34" height="40" fill="#ef6c00" opacity="0.85"/><text x="140.0" y="185.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >3</text><rect x="150" y="200.0" width="34" height="40" fill="#f9a825" opacity="0.85"/><text x="140.0" y="225.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >4</text><rect x="150" y="240.0" width="34" height="40" fill="#c0ca33" opacity="0.85"/><text x="140.0" y="265.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >5</text><rect x="150" y="280.0" width="34" height="40" fill="#7cb342" opacity="0.85"/><text x="140.0" y="305.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >6</text><rect x="150" y="320.0" width="34" height="40" fill="#43a047" opacity="0.85"/><text x="140.0" y="345.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >7</text><rect x="150" y="360.0" width="34" height="40" fill="#00897b" opacity="0.85"/><text x="140.0" y="385.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >8</text><rect x="150" y="400.0" width="34" height="40" fill="#0097a7" opacity="0.85"/><text x="140.0" y="425.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >9</text><rect x="150" y="440.0" width="34" height="40" fill="#0277bd" opacity="0.85"/><text x="140.0" y="465.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >10</text><rect x="150" y="480.0" width="34" height="40" fill="#1565c0" opacity="0.85"/><text x="140.0" y="505.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >11</text><rect x="150" y="520.0" width="34" height="40" fill="#283593" opacity="0.85"/><text x="140.0" y="545.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >12</text><rect x="150" y="560.0" width="34" height="40" fill="#4527a0" opacity="0.85"/><text x="140.0" y="585.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >13</text><rect x="150" y="600.0" width="34" height="40" fill="#6a1b9a" opacity="0.85"/><text x="140.0" y="625.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >14</text><rect x="150" y="40.0" width="34" height="600" fill="none" stroke="#2d3f4b" stroke-width="1.6"/><text x="140.0" y="32.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end" fill="#2d3f4b" >pH</text><text x="14.0" y="32.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#2d3f4b" >[H<tspan baseline-shift="sub" font-size="11">3</tspan>O<tspan baseline-shift="super" font-size="11">+</tspan>] (M)</text><text x="14.0" y="65.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#55606b" >10<tspan baseline-shift="super" font-size="11">0</tspan></text><text x="14.0" y="145.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#55606b" >10<tspan baseline-shift="super" font-size="11">−2</tspan></text><text x="14.0" y="225.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#55606b" >10<tspan baseline-shift="super" font-size="11">−4</tspan></text><text x="14.0" y="345.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#55606b" >10<tspan baseline-shift="super" font-size="11">−7</tspan></text><text x="14.0" y="465.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#55606b" >10<tspan baseline-shift="super" font-size="11">−10</tspan></text><text x="14.0" y="545.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#55606b" >10<tspan baseline-shift="super" font-size="11">−12</tspan></text><text x="14.0" y="625.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#55606b" >10<tspan baseline-shift="super" font-size="11">−14</tspan></text><line x1="184.0" y1="120.0" x2="206.0" y2="120.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="120.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="125.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >stomach acid (1.5–3.5)</text><line x1="184.0" y1="140.0" x2="206.0" y2="142.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="140.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="147.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >lemon juice (about 2)</text><line x1="184.0" y1="164.0" x2="206.0" y2="164.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="164.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="169.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >cola soft drink (about 2.5)</text><line x1="184.0" y1="180.0" x2="206.0" y2="186.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="180.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="191.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >vinegar (about 3)</text><line x1="184.0" y1="260.0" x2="206.0" y2="260.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="260.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="265.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >black coffee (about 5)</text><line x1="184.0" y1="320.0" x2="206.0" y2="320.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="320.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="325.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >milk (about 6.5)</text><line x1="184.0" y1="340.0" x2="206.0" y2="342.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="340.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="347.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >pure water (7.00, neutral)</text><line x1="184.0" y1="392.0" x2="206.0" y2="392.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="392.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="397.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >baking soda in water (about 8.3)</text><line x1="184.0" y1="480.0" x2="206.0" y2="480.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="480.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="485.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >milk of magnesia (about 10.5)</text><line x1="184.0" y1="520.0" x2="206.0" y2="520.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="520.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="525.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >household ammonia (about 11.5)</text><line x1="184.0" y1="564.0" x2="206.0" y2="564.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="564.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="569.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >bleach (about 12.5)</text><line x1="184.0" y1="612.0" x2="206.0" y2="612.0" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="184.0" cy="612.0" r="2.5" fill="#2d3f4b" stroke="#2d3f4b" stroke-width="0.5"/><text x="210.0" y="617.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >drain cleaner (about 14)</text><rect x="146" y="354.0" width="42" height="4.0" fill="none" stroke="#000" stroke-width="2.4"/><line x1="188.0" y1="356.0" x2="206.0" y2="367.0" stroke="#c0392b" stroke-width="2"/><text x="210.0" y="372.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#c0392b" >blood (7.35–7.45)</text><path d="M110.0 308.0 L110.0 76.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="100.0" y="192.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" transform="rotate(-90 100 192.0)">more acidic</text><path d="M110.0 372.0 L110.0 604.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="100.0" y="488.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" transform="rotate(-90 100 488.0)">more basic</text><text x="235.0" y="670.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Each step of 1 pH unit is a 10-fold change in [H<tspan baseline-shift="sub" font-size="11">3</tspan>O<tspan baseline-shift="super" font-size="11">+</tspan>].</text></svg>