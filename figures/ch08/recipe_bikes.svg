<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 378" width="470" height="378" role="img" aria-label="A balanced equation as a recipe, using bicycles. One frame plus 2 wheels makes 1 bicycle: Frame + 2 Wheel gives Bicycle. Below: with 4 frames and 6 wheels, the 4 frames are enough for 4 bikes, but the 6 wheels are enough for only 3 bikes. Answer: 3 bicycles. The wheels run out first, so they are limiting; one frame is left over, in excess."><rect width="470" height="378" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A balanced equation is a recipe</text><path d="M48 96 L70 72 L92 96 L48 96 M70 72 L76 62 M72 62 h12" stroke="#c0392b" stroke-width="3.5" fill="none" stroke-linejoin="round"/><text x="70.0" y="120.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >1 frame</text><text x="122.0" y="90.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#2d3f4b" >+</text><circle cx="160" cy="84" r="16" fill="#fff" stroke="#2d3f4b" stroke-width="3"/><circle cx="160" cy="84" r="3" fill="#2d3f4b"/><circle cx="200" cy="84" r="16" fill="#fff" stroke="#2d3f4b" stroke-width="3"/><circle cx="200" cy="84" r="3" fill="#2d3f4b"/><text x="180.0" y="120.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >2 wheels</text><path d="M232.0 84.0 L276.0 84.0" stroke="#2d3f4b" stroke-width="2.6" fill="none" marker-end="url(#ar)"/><circle cx="324" cy="92" r="16" fill="#fff" stroke="#2d3f4b" stroke-width="3"/><circle cx="324" cy="92" r="3" fill="#2d3f4b"/><circle cx="376" cy="92" r="16" fill="#fff" stroke="#2d3f4b" stroke-width="3"/><circle cx="376" cy="92" r="3" fill="#2d3f4b"/><path d="M328 92 L350 68 L372 92 L328 92 M350 68 L356 58 M352 58 h12" stroke="#c0392b" stroke-width="3.5" fill="none" stroke-linejoin="round"/><text x="350.0" y="128.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >1 bicycle</text><text x="235.0" y="158.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Frame + 2 Wheel → Bicycle</text><line x1="20" y1="176" x2="450" y2="176" stroke="#c9d3dc" stroke-width="1.5"/><text x="235.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >You have 4 frames and 6 wheels. How many bicycles?</text><path d="M28 262 L50 238 L72 262 L28 262 M50 238 L56 228 M52 228 h12" stroke="#c0392b" stroke-width="3.5" fill="none" stroke-linejoin="round"/><path d="M78 262 L100 238 L122 262 L78 262 M100 238 L106 228 M102 228 h12" stroke="#c0392b" stroke-width="3.5" fill="none" stroke-linejoin="round"/><path d="M128 262 L150 238 L172 262 L128 262 M150 238 L156 228 M152 228 h12" stroke="#c0392b" stroke-width="3.5" fill="none" stroke-linejoin="round"/><path d="M178 262 L200 238 L222 262 L178 262 M200 238 L206 228 M202 228 h12" stroke="#c0392b" stroke-width="3.5" fill="none" stroke-linejoin="round"/><circle cx="250" cy="232" r="15" fill="#fff" stroke="#2d3f4b" stroke-width="3"/><circle cx="250" cy="232" r="3" fill="#2d3f4b"/><circle cx="294" cy="232" r="15" fill="#fff" stroke="#2d3f4b" stroke-width="3"/><circle cx="294" cy="232" r="3" fill="#2d3f4b"/><circle cx="338" cy="232" r="15" fill="#fff" stroke="#2d3f4b" stroke-width="3"/><circle cx="338" cy="232" r="3" fill="#2d3f4b"/><circle cx="250" cy="276" r="15" fill="#fff" stroke="#2d3f4b" stroke-width="3"/><circle cx="250" cy="276" r="3" fill="#2d3f4b"/><circle cx="294" cy="276" r="15" fill="#fff" stroke="#2d3f4b" stroke-width="3"/><circle cx="294" cy="276" r="3" fill="#2d3f4b"/><circle cx="338" cy="276" r="15" fill="#fff" stroke="#2d3f4b" stroke-width="3"/><circle cx="338" cy="276" r="3" fill="#2d3f4b"/><text x="110.0" y="290.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >4 frames → enough for 4 bikes</text><text x="338.0" y="316.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >6 wheels → enough for only 3 bikes</text><text x="235.0" y="346.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Answer: 3 bicycles. Wheels run out first: they are LIMITING.</text><text x="235.0" y="366.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >One frame is left over (in excess).</text></svg>