<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 308" width="470" height="308" role="img" aria-label="Two energy diagrams. Exothermic: the reactants line is higher than the products line; a red arrow points down from reactants to products; delta H is less than 0, heat is released, and the surroundings warm up. Endothermic: the reactants line is lower than the products line; a blue arrow points up; delta H is greater than 0, heat is absorbed, and the surroundings cool down."><rect width="470" height="308" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="115.0" y="46.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Exothermic</text><path d="M20.0 250.0 L20.0 64.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="14.0" y="160.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" transform="rotate(-90 14 160)">energy</text><line x1="40" y1="100" x2="110" y2="100" stroke="#2d3f4b" stroke-width="3"/><text x="75.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >reactants</text><line x1="130" y1="200" x2="200" y2="200" stroke="#2d3f4b" stroke-width="3"/><text x="165.0" y="192.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >products</text><path d="M120.0 100.0 L120.0 196.0" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="115.0" y="276.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#c0392b" >ΔH &lt; 0: heat released</text><text x="115.0" y="296.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >surroundings warm up</text><text x="350.0" y="46.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Endothermic</text><path d="M255.0 250.0 L255.0 64.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="249.0" y="160.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" transform="rotate(-90 249 160)">energy</text><line x1="275" y1="200" x2="345" y2="200" stroke="#2d3f4b" stroke-width="3"/><text x="310.0" y="192.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >reactants</text><line x1="365" y1="100" x2="435" y2="100" stroke="#2d3f4b" stroke-width="3"/><text x="400.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >products</text><path d="M355.0 200.0 L355.0 104.0" stroke="#2f6f9a" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="350.0" y="276.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2f6f9a" >ΔH &gt; 0: heat absorbed</text><text x="350.0" y="296.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >surroundings cool down</text></svg>