<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 458" width="470" height="458" role="img" aria-label="The stoichiometry road map. Top row: grams of A (given) and grams of B (wanted). Middle row: moles of A and moles of B. Grams of A divided by the molar mass of A gives moles of A; moles of A times the mole ratio from the balanced equation coefficients gives moles of B; moles of B times the molar mass of B gives grams of B. Other entry points into moles of A: liters of gas at STP divided by 22.4 liters per mole, and liters of solution times molarity. From moles of B you can also find heat in kilojoules using the enthalpy change per mole (Section 8.6). Every route passes through the mole ratio between moles of A and moles of B."><rect width="470" height="458" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >The stoichiometry road map</text><rect x="14" y="44" width="180" height="58" rx="10" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.8"/><text x="104.0" y="69.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >grams of A</text><text x="104.0" y="87.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(given)</text><rect x="276" y="44" width="180" height="58" rx="10" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.8"/><text x="366.0" y="69.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >grams of B</text><text x="366.0" y="87.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(wanted)</text><rect x="14" y="170" width="180" height="58" rx="10" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.8"/><text x="104.0" y="194.7" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >moles of A</text><text x="104.0" y="214.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" ></text><rect x="276" y="170" width="180" height="58" rx="10" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.8"/><text x="366.0" y="194.7" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >moles of B</text><text x="366.0" y="214.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" ></text><path d="M104.0 104.0 L104.0 166.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="112.0" y="140.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >÷ molar mass A</text><path d="M366.0 168.0 L366.0 106.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="358.0" y="140.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#2d3f4b" >× molar mass B</text><path d="M196.0 199.0 L272.0 199.0" stroke="#2d3f4b" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="235.0" y="190.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >mole ratio</text><text x="235.0" y="220.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2d3f4b" >(coefficients)</text><rect x="14" y="282" width="180" height="62" rx="10" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.8"/><text x="104.0" y="309.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >liters of gas at STP</text><text x="104.0" y="325.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >÷ 22.4 L/mol</text><path d="M104.0 282.0 L104.0 232.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="14" y="360" width="180" height="62" rx="10" fill="#efe3f7" stroke="#2d3f4b" stroke-width="1.8"/><text x="104.0" y="387.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >liters of solution</text><text x="104.0" y="403.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >× molarity (mol/L)</text><path d="M194 391 C 230 391, 230 230, 190 222" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="276" y="282" width="180" height="62" rx="10" fill="#fbe3d8" stroke="#2d3f4b" stroke-width="1.8"/><text x="366.0" y="309.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >heat (kJ)</text><text x="366.0" y="325.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2d3f4b" >× ΔH per mol (Sec 8.6)</text><path d="M366.0 232.0 L366.0 278.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="235.0" y="446.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Every route passes through the mole ratio between moles of A and moles of B.</text></svg>