<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 504" width="470" height="504" role="img" aria-label="The mole road map. Three boxes stacked vertically: GRAMS (mass of a sample) at the top, MOLES (the hub) in the middle, and PARTICLES (atoms, molecules, ions) at the bottom. Between grams and moles: going down, divide by molar mass in grams per mole; going up, multiply by molar mass. Between moles and particles: going down, multiply by Avogadro’s number, 6.0221 times 10 to the 23; going up, divide by Avogadro’s number. Always go through moles; there is no direct path from grams to particles. Subscripts link moles of a compound to moles of each element in it: 1 mole of H2O contains 2 moles of H and 1 mole of O."><rect width="470" height="504" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="24.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >The mole road map</text><rect x="135" y="40" width="200" height="62" rx="10" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.8"/><text x="235.0" y="66.4" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >GRAMS</text><text x="235.0" y="87.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2d3f4b" >mass of a sample</text><rect x="135" y="190" width="200" height="62" rx="10" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.8"/><text x="235.0" y="216.4" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >MOLES</text><text x="235.0" y="237.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2d3f4b" >the hub</text><rect x="135" y="340" width="200" height="62" rx="10" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.8"/><text x="235.0" y="366.4" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >PARTICLES</text><text x="235.0" y="387.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2d3f4b" >atoms, molecules, ions</text><path d="M205 104 L205 186" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M265 186 L265 104" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="195.0" y="138.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#2d3f4b" >÷ molar mass</text><text x="275.0" y="138.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#2d3f4b" >× molar mass</text><text x="195.0" y="156.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end" fill="#2d3f4b" >(g/mol)</text><text x="275.0" y="156.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3f4b" >(g/mol)</text><path d="M205 254 L205 336" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M265 336 L265 254" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="195.0" y="290.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#2d3f4b" >× 6.0221×10<tspan baseline-shift="super" font-size="11">23</tspan></text><text x="275.0" y="290.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#2d3f4b" >÷ 6.0221×10<tspan baseline-shift="super" font-size="11">23</tspan></text><text x="195.0" y="308.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end" fill="#2d3f4b" >(Avogadro)</text><text x="275.0" y="308.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3f4b" >(Avogadro)</text><path d="M337 221 C 420 221, 420 221, 420 221" stroke="#2d3f4b" stroke-width="0"/><text x="235.0" y="430.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Always go through MOLES. There is no direct path</text><text x="235.0" y="448.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >from grams to particles.</text><text x="235.0" y="474.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Subscripts link moles of a compound to moles of each</text><text x="235.0" y="492.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >element in it: 1 mol H<tspan baseline-shift="sub" font-size="11">2</tspan>O contains 2 mol H and 1 mol O.</text></svg>