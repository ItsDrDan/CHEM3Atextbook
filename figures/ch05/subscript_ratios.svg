<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 258" width="470" height="258" role="img" aria-label="Subscripts as mole ratios. Top: one CO2 molecule drawn as a carbon atom between two oxygen atoms; 1 CO2 to 1 C to 2 O, so 1 mole of CO2 contains 1 mole of C and 2 moles of O. Bottom: one Mg(OH)2 formula unit drawn as a magnesium ion with an OH group on each side; 1 Mg(OH)2 to 1 Mg to 2 O to 2 H; the 2 outside the parentheses multiplies both O and H."><rect width="470" height="258" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="24.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Subscripts are mole ratios</text><circle cx="70" cy="80" r="16" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.6"/><text x="70.0" y="85.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="110" cy="80" r="18" fill="#d9dde2" stroke="#2d3f4b" stroke-width="1.6"/><text x="110.0" y="85.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><circle cx="150" cy="80" r="16" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.6"/><text x="150.0" y="85.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><text x="110.0" y="124.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >one CO<tspan baseline-shift="sub" font-size="11">2</tspan> molecule</text><text x="330.0" y="64.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1 CO<tspan baseline-shift="sub" font-size="11">2</tspan> : 1 C : 2 O</text><text x="330.0" y="90.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >1 mol CO<tspan baseline-shift="sub" font-size="11">2</tspan> contains</text><text x="330.0" y="108.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >1 mol C and 2 mol O</text><line x1="20" y1="146" x2="450" y2="146" stroke="#c9d3dc" stroke-width="1.5"/><circle cx="110" cy="200" r="22" fill="#cfe8cf" stroke="#2d3f4b" stroke-width="1.6"/><text x="110.0" y="205.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Mg</text><circle cx="56" cy="200" r="16" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.6"/><text x="56.0" y="205.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="164" cy="200" r="16" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.6"/><text x="164.0" y="205.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="30" cy="200" r="10" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><text x="30.0" y="205.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="190" cy="200" r="10" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><text x="190.0" y="205.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="110.0" y="244.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >one Mg(OH)<tspan baseline-shift="sub" font-size="11">2</tspan> formula unit</text><text x="330.0" y="184.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1 Mg(OH)<tspan baseline-shift="sub" font-size="11">2</tspan> : 1 Mg : 2 O : 2 H</text><text x="330.0" y="210.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >The 2 outside the parentheses</text><text x="330.0" y="228.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >multiplies both O and H.</text></svg>