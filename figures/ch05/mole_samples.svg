<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 306" width="470" height="306" role="img" aria-label="One mole of each of four substances shown in identical containers, each holding the same number of particles, 6.0221 times 10 to the 23. Carbon, C: 12.011 grams, a thin layer of black solid (about 5 mL). Water, H2O: 18.015 grams of liquid (about 18 mL). Table salt, NaCl: 58.44 grams, the tallest pile, of white solid (about 27 mL). Mercury, Hg: 200.59 grams of dense silver liquid (about 15 mL). The masses differ because each particle has a different mass."><rect width="470" height="306" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="24.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >One mole of each: same number of particles</text><path d="M22 70 L22 150 Q22 158 30 158 L90 158 Q98 158 98 150 L98 70" fill="none" stroke="#2d3f4b" stroke-width="2"/><rect x="24" y="146" width="72" height="11" fill="#555c63" stroke="#2d3f4b" stroke-width="1"/><text x="60.0" y="182.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Carbon</text><text x="60.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><text x="60.0" y="224.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >12.011 g</text><path d="M139 70 L139 150 Q139 158 147 158 L207 158 Q215 158 215 150 L215 70" fill="none" stroke="#2d3f4b" stroke-width="2"/><rect x="141" y="121" width="72" height="36" fill="#9cc9ea" stroke="#2d3f4b" stroke-width="1"/><text x="177.0" y="182.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Water</text><text x="177.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H<tspan baseline-shift="sub" font-size="11">2</tspan>O</text><text x="177.0" y="224.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >18.015 g</text><path d="M256 70 L256 150 Q256 158 264 158 L324 158 Q332 158 332 150 L332 70" fill="none" stroke="#2d3f4b" stroke-width="2"/><rect x="258" y="103" width="72" height="54" fill="#f1f1f1" stroke="#2d3f4b" stroke-width="1"/><text x="294.0" y="182.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Table salt</text><text x="294.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NaCl</text><text x="294.0" y="224.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >58.44 g</text><path d="M373 70 L373 150 Q373 158 381 158 L441 158 Q449 158 449 150 L449 70" fill="none" stroke="#2d3f4b" stroke-width="2"/><rect x="375" y="127" width="72" height="30" fill="#b8bec6" stroke="#2d3f4b" stroke-width="1"/><text x="411.0" y="182.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Mercury</text><text x="411.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Hg</text><text x="411.0" y="224.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >200.59 g</text><text x="235.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Each holds 6.0221 × 10<tspan baseline-shift="super" font-size="11">23</tspan> particles (atoms, molecules, or formula units).</text><text x="235.0" y="276.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Their masses differ because each particle has a different mass.</text><text x="235.0" y="296.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(Sample heights are drawn to scale by volume.)</text></svg>