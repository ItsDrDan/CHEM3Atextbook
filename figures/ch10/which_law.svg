<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 352" width="470" height="352" role="img" aria-label="Flowchart: which gas equation should I use? If the gas changes from one set of conditions to another (1 to 2), use the combined gas law, P1 V1 over T1 = P2 V2 over T2, and cross out whatever stays constant (n, P, V, or T). If there is only one set of conditions, use the ideal gas law, PV = nRT, with R = 0.082058 L·atm/(mol·K); at STP (273 K and 1 atm), 1 mol of gas = 22.4 L. For a reaction, use moles and mole ratios (Section 10.5). Always use T in kelvins and match the pressure units to R (atm with 0.082058)."><rect width="470" height="352" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Which gas equation should I use?</text><rect x="85" y="40" width="300" height="48" rx="10" fill="#fff7e6" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="59.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Does the gas change from one set</text><text x="235.0" y="77.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >of conditions to another (1 → 2)?</text><path d="M160.0 88.0 L110.0 120.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="118.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="end" fill="#2d3f4b" >yes</text><path d="M310.0 88.0 L360.0 120.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="352.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" fill="#2d3f4b" >no</text><rect x="14" y="122" width="206" height="108" rx="10" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="117.0" y="153.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Combined gas law</text><text x="117.0" y="171.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >P<tspan baseline-shift="sub" font-size="10">1</tspan>V<tspan baseline-shift="sub" font-size="10">1</tspan>/T<tspan baseline-shift="sub" font-size="10">1</tspan> = P<tspan baseline-shift="sub" font-size="10">2</tspan>V<tspan baseline-shift="sub" font-size="10">2</tspan>/T<tspan baseline-shift="sub" font-size="10">2</tspan></text><text x="117.0" y="189.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Cross out what stays</text><text x="117.0" y="207.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >constant (n, P, V, or T).</text><rect x="250" y="122" width="206" height="108" rx="10" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.6"/><text x="353.0" y="153.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ideal gas law</text><text x="353.0" y="171.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >PV = nRT</text><text x="353.0" y="189.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >One set of conditions;</text><text x="353.0" y="207.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >R = 0.082058 L·atm/(mol·K)</text><rect x="250" y="250" width="206" height="62" rx="10" fill="#efe3f7" stroke="#2d3f4b" stroke-width="1.6"/><text x="353.0" y="276.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >At STP (273 K, 1 atm):</text><text x="353.0" y="294.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >1 mol gas = 22.4 L</text><path d="M353.0 230.0 L353.0 248.0" stroke="#2d3f4b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><rect x="14" y="250" width="206" height="62" rx="10" fill="#fbe3d8" stroke="#2d3f4b" stroke-width="1.6"/><text x="117.0" y="276.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Reaction? Use moles and</text><text x="117.0" y="294.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >mole ratios (Section 10.5).</text><text x="235.0" y="340.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Always: T in K; match P units to R (atm with 0.082058).</text></svg>