<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 342" width="470" height="342" role="img" aria-label="A mercury barometer: a glass tube, closed at the top, stands upside down in a dish of mercury. Above the mercury in the tube is a vacuum. Air pressure pushes down on the mercury in the dish and holds up a column of mercury 760 mm tall at sea level. Pressure units: 1 atm = 760 mmHg = 760 torr = 101,325 Pa = 101.325 kPa = 14.7 psi. Higher air pressure pushes the mercury column higher."><rect width="470" height="342" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A mercury barometer</text><path d="M112 48 h22 v236" fill="none" stroke="#2d3f4b" stroke-width="2.2"/><path d="M112 48 v236" stroke="#2d3f4b" stroke-width="2.2"/><rect x="114" y="84" width="18" height="214" fill="#b8c2cc"/><text x="160.0" y="66.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#2d3f4b" >vacuum</text><line x1="136.0" y1="64.0" x2="156.0" y2="64.0" stroke="#55606b" stroke-width="1"/><path d="M40 262 v50 h168 v-50" fill="none" stroke="#2d3f4b" stroke-width="2.2"/><rect x="42" y="282" width="164" height="28" fill="#b8c2cc"/><text x="124.0" y="330.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >dish of mercury (Hg)</text><line x1="92.0" y1="84.0" x2="92.0" y2="282.0" stroke="#c0392b" stroke-width="1.6"/><line x1="86.0" y1="84.0" x2="98.0" y2="84.0" stroke="#c0392b" stroke-width="1.6"/><line x1="86.0" y1="282.0" x2="98.0" y2="282.0" stroke="#c0392b" stroke-width="1.6"/><text x="84.0" y="180.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="end" fill="#c0392b" >760 mm</text><text x="84.0" y="196.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="end" fill="#c0392b" >at sea level</text><path d="M60.0 238.0 L60.0 276.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><path d="M180.0 238.0 L180.0 276.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><text x="232.0" y="300.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#2f5fa8" >air pressure pushes</text><text x="232.0" y="314.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#2f5fa8" >on the dish</text><rect x="262" y="60" width="196" height="170" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="360.0" y="82.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Pressure units</text><text x="360.0" y="108.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1 atm = 760 mmHg</text><text x="360.0" y="132.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >= 760 torr</text><text x="360.0" y="156.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >= 101,325 Pa</text><text x="360.0" y="180.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >= 101.325 kPa</text><text x="360.0" y="204.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >= 14.7 psi</text><text x="360.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Higher air pressure pushes</text><text x="360.0" y="272.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >the mercury column higher.</text></svg>