<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 272" width="470" height="272" role="img" aria-label="Kinetic molecular theory of gases. Left: a square container with eleven widely spaced gas particles, each with an arrow showing it moving in a random direction; one particle is shown hitting the wall. Right, the five main ideas: 1, particles are tiny and far apart, so most of a gas is empty space. 2, they move constantly and randomly in straight lines. 3, collisions are elastic, so no energy is lost, and hits on the walls cause pressure. 4, there are no attractions or repulsions between particles. 5, the average kinetic energy is proportional to the Kelvin temperature."><rect width="470" height="272" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Kinetic molecular theory of gases</text><rect x="14" y="40" width="200" height="200" fill="#fff" stroke="#2d3f4b" stroke-width="2.4"/><circle cx="146.6" cy="192.4" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M141.6 191.8 L129.7 190.3" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="116.1" cy="120.4" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M121.1 120.3 L133.1 120.0" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="75.2" cy="75.3" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M74.9 80.3 L74.1 92.2" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="69.9" cy="108.2" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M69.4 113.2 L68.0 125.1" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="41.8" cy="107.9" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M39.9 112.5 L35.5 123.7" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="126.7" cy="85.1" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M131.3 87.3 L142.1 92.4" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="59.3" cy="147.8" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M55.4 151.0 L46.3 158.8" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="157.0" cy="195.8" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M152.7 198.3 L142.4 204.5" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="40.3" cy="182.0" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M40.4 177.0 L40.8 165.0" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="94.9" cy="169.1" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M93.4 173.9 L89.7 185.3" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="190.3" cy="201.4" r="5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><path d="M191.6 196.6 L194.7 185.0" stroke="#2f5fa8" stroke-width="1.3" fill="none" marker-end="url(#arB)"/><circle cx="200.0" cy="110.0" r="5" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><path d="M196.0 104.0 L180.0 92.0" stroke="#c0392b" stroke-width="1.4" fill="none" marker-end="url(#arR)"/><text x="206.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="start" fill="#c0392b" >hit</text><text x="114.0" y="258.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Gas particles in a container</text><text x="228.0" y="56.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#2d3f4b" >1. Particles are tiny and far apart;</text><text x="228.0" y="74.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#2d3f4b" >   most of a gas is empty space.</text><text x="228.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#2d3f4b" >2. They move constantly, randomly,</text><text x="228.0" y="110.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#2d3f4b" >   in straight lines.</text><text x="228.0" y="128.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#2d3f4b" >3. Collisions are elastic (no energy</text><text x="228.0" y="146.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#2d3f4b" >   is lost); hits on the walls</text><text x="228.0" y="164.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#2d3f4b" >   cause pressure.</text><text x="228.0" y="182.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#2d3f4b" >4. No attractions or repulsions</text><text x="228.0" y="200.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#2d3f4b" >   between particles.</text><text x="228.0" y="218.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#2d3f4b" >5. Average kinetic energy is</text><text x="228.0" y="236.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="start" fill="#2d3f4b" >   proportional to Kelvin temperature.</text></svg>