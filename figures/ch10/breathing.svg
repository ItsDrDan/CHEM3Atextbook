<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 324" width="470" height="324" role="img" aria-label="Breathing follows Boyle's law. Left, inhale: the diaphragm contracts and moves down, the lungs expand, lung volume increases, and pressure in the lungs drops below air pressure, so air flows in. Right, exhale: the diaphragm relaxes and moves up, lung volume decreases, and pressure in the lungs rises above air pressure, so air flows out. Air always flows from higher pressure to lower pressure."><rect width="470" height="324" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Breathing follows Boyle's law</text><rect x="14" y="40" width="212" height="250" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="62.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2f5fa8" >Inhale</text><ellipse cx="86" cy="150" rx="33.0" ry="49.0" fill="#f9d9d4" stroke="#2d3f4b" stroke-width="1.6"/><ellipse cx="154" cy="150" rx="33.0" ry="49.0" fill="#f9d9d4" stroke="#2d3f4b" stroke-width="1.6"/><line x1="120.0" y1="74.0" x2="120.0" y2="110.0" stroke="#2d3f4b" stroke-width="4"/><path d="M44 208 Q120 216 196 208" fill="none" stroke="#2e7d32" stroke-width="4"/><text x="120.0" y="234.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >diaphragm contracts, moves down</text><path d="M144.0 96.0 L128.0 108.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><text x="164.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" fill="#2f5fa8" >air in</text><text x="120.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >lung volume increases</text><text x="120.0" y="274.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >pressure in lungs drops below</text><text x="120.0" y="286.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >air pressure</text><rect x="244" y="40" width="212" height="250" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="350.0" y="62.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#c0392b" >Exhale</text><ellipse cx="316" cy="142" rx="27.0" ry="41.0" fill="#f9d9d4" stroke="#2d3f4b" stroke-width="1.6"/><ellipse cx="384" cy="142" rx="27.0" ry="41.0" fill="#f9d9d4" stroke="#2d3f4b" stroke-width="1.6"/><line x1="350.0" y1="74.0" x2="350.0" y2="110.0" stroke="#2d3f4b" stroke-width="4"/><path d="M274 200 Q350 186 426 200" fill="none" stroke="#2e7d32" stroke-width="4"/><text x="350.0" y="234.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2e7d32" >diaphragm relaxes, moves up</text><path d="M358.0 104.0 L376.0 90.0" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arR)"/><text x="382.0" y="90.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" fill="#c0392b" >air out</text><text x="350.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >lung volume decreases</text><text x="350.0" y="274.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >pressure in lungs rises above</text><text x="350.0" y="286.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >air pressure</text><text x="235.0" y="312.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Air always flows from higher pressure to lower pressure.</text></svg>