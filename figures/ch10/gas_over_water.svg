<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 336" width="470" height="336" role="img" aria-label="Collecting a gas over water, as in Experiment 8a. A graduated gas collection tube is inverted in a beaker of water, with magnesium reacting with hydrochloric acid at the bottom; bubbles of hydrogen rise and collect at the top of the tube, mixed with water vapor. Air pressure pushes down on the water in the beaker. When the water levels inside and outside the tube match, P atm = P of H2 + P of H2O, so P of H2 = P atm minus P of H2O. Water vapor pressure: 17.5 mmHg at 20 °C, 23.8 mmHg at 25 °C, 31.8 mmHg at 30 °C, and 47.1 mmHg at 37 °C. Look it up at the water temperature."><rect width="470" height="336" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Collecting a gas over water</text><path d="M30 150 v150 a8 8 0 0 0 8 8 h184 a8 8 0 0 0 8 -8 v-150" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="2"/><rect x="31" y="170" width="198" height="136" fill="#dbe7f6"/><line x1="30.0" y1="170.0" x2="230.0" y2="170.0" stroke="#2f5fa8" stroke-width="1.6"/><rect x="108" y="44" width="44" height="236" rx="4" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><rect x="110" y="170" width="40" height="108" fill="#dbe7f6"/><line x1="110.0" y1="170.0" x2="150.0" y2="170.0" stroke="#2f5fa8" stroke-width="1.6"/><circle cx="120.8" cy="127.0" r="3.2" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><circle cx="133.7" cy="104.8" r="3.2" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><circle cx="122.2" cy="137.9" r="3.2" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><circle cx="138.5" cy="108.3" r="3.2" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><circle cx="130.1" cy="79.1" r="3.2" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><circle cx="116.3" cy="93.4" r="3.2" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><circle cx="132.4" cy="61.5" r="3.2" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><circle cx="138.1" cy="78.7" r="3.2" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><circle cx="142.6" cy="69.0" r="3.2" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="116.9" cy="159.7" r="3.2" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="121.3" cy="66.9" r="3.2" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="130.0" cy="262.0" r="3.5" fill="#fff" stroke="#2f5fa8" stroke-width="1.2"/><circle cx="130.0" cy="248.0" r="3.5" fill="#fff" stroke="#2f5fa8" stroke-width="1.2"/><circle cx="128.0" cy="232.0" r="3.5" fill="#fff" stroke="#2f5fa8" stroke-width="1.2"/><rect x="120" y="282" width="20" height="8" fill="#55606b"/><text x="130.0" y="322.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Mg + HCl at the bottom</text><line x1="108.0" y1="60.0" x2="116.0" y2="60.0" stroke="#2d3f4b" stroke-width="1"/><line x1="108.0" y1="84.0" x2="116.0" y2="84.0" stroke="#2d3f4b" stroke-width="1"/><line x1="108.0" y1="108.0" x2="116.0" y2="108.0" stroke="#2d3f4b" stroke-width="1"/><line x1="108.0" y1="132.0" x2="116.0" y2="132.0" stroke="#2d3f4b" stroke-width="1"/><line x1="108.0" y1="156.0" x2="116.0" y2="156.0" stroke="#2d3f4b" stroke-width="1"/><line x1="108.0" y1="180.0" x2="116.0" y2="180.0" stroke="#2d3f4b" stroke-width="1"/><line x1="108.0" y1="204.0" x2="116.0" y2="204.0" stroke="#2d3f4b" stroke-width="1"/><line x1="108.0" y1="228.0" x2="116.0" y2="228.0" stroke="#2d3f4b" stroke-width="1"/><line x1="108.0" y1="252.0" x2="116.0" y2="252.0" stroke="#2d3f4b" stroke-width="1"/><text x="158.0" y="72.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" fill="#2d3f4b" >H<tspan baseline-shift="sub" font-size="10">2</tspan> + water vapor</text><path d="M70.0 130.0 L70.0 166.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><path d="M196.0 130.0 L196.0 166.0" stroke="#2f5fa8" stroke-width="2" fill="none" marker-end="url(#arB)"/><text x="196.0" y="122.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#2f5fa8" >P<tspan baseline-shift="sub" font-size="10">atm</tspan></text><rect x="250" y="50" width="208" height="250" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="354.0" y="74.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >When the water levels match:</text><text x="354.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#c0392b" >P<tspan baseline-shift="sub" font-size="10">atm</tspan> = P<tspan baseline-shift="sub" font-size="10">H₂</tspan> + P<tspan baseline-shift="sub" font-size="10">H₂O</tspan></text><text x="354.0" y="134.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >so P<tspan baseline-shift="sub" font-size="10">H₂</tspan> = P<tspan baseline-shift="sub" font-size="10">atm</tspan> − P<tspan baseline-shift="sub" font-size="10">H₂O</tspan></text><text x="354.0" y="166.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Water vapor pressure</text><text x="300.0" y="190.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >20 °C</text><text x="400.0" y="190.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >17.5 mmHg</text><text x="300.0" y="212.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >25 °C</text><text x="400.0" y="212.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >23.8 mmHg</text><text x="300.0" y="234.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >30 °C</text><text x="400.0" y="234.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >31.8 mmHg</text><text x="300.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >37 °C</text><text x="400.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >47.1 mmHg</text><text x="354.0" y="284.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#55606b" >Look it up at the water temperature.</text></svg>