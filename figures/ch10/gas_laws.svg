<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 458" width="470" height="458" role="img" aria-label="Four panels showing the simple gas laws. Boyle's law, P and V: pushing a piston down raises the pressure and shrinks the volume; an inverse relationship, P1 V1 = P2 V2, at constant moles and temperature. Charles's law, V and T: a warm balloon is bigger than a cold one; a direct relationship, V1 over T1 = V2 over T2, at constant moles and pressure. Gay-Lussac's law, P and T: heating gas in a rigid can makes the particles move faster and raises the pressure; a direct relationship, P1 over T1 = P2 over T2, at constant moles and volume. Avogadro's law, V and n: adding more moles of gas makes a balloon bigger; a direct relationship, V1 over n1 = V2 over n2, at constant pressure and temperature. Temperatures in every gas law must be in kelvins."><rect width="470" height="458" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >The simple gas laws</text><rect x="10" y="40" width="220" height="186" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Boyle's law: P and V</text><text x="120.0" y="192.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >P<tspan baseline-shift="sub" font-size="10">1</tspan>V<tspan baseline-shift="sub" font-size="10">1</tspan> = P<tspan baseline-shift="sub" font-size="10">2</tspan>V<tspan baseline-shift="sub" font-size="10">2</tspan></text><text x="120.0" y="212.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#55606b" >inverse relationship; constant n, T</text><rect x="240" y="40" width="220" height="186" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="350.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Charles's law: V and T</text><text x="350.0" y="192.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >V<tspan baseline-shift="sub" font-size="10">1</tspan>/T<tspan baseline-shift="sub" font-size="10">1</tspan> = V<tspan baseline-shift="sub" font-size="10">2</tspan>/T<tspan baseline-shift="sub" font-size="10">2</tspan></text><text x="350.0" y="212.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#55606b" >direct relationship; constant n, P</text><rect x="10" y="236" width="220" height="186" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Gay-Lussac's law: P and T</text><text x="120.0" y="388.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >P<tspan baseline-shift="sub" font-size="10">1</tspan>/T<tspan baseline-shift="sub" font-size="10">1</tspan> = P<tspan baseline-shift="sub" font-size="10">2</tspan>/T<tspan baseline-shift="sub" font-size="10">2</tspan></text><text x="120.0" y="408.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#55606b" >direct relationship; constant n, V</text><rect x="240" y="236" width="220" height="186" rx="10" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.6"/><text x="350.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Avogadro's law: V and n</text><text x="350.0" y="388.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >V<tspan baseline-shift="sub" font-size="10">1</tspan>/n<tspan baseline-shift="sub" font-size="10">1</tspan> = V<tspan baseline-shift="sub" font-size="10">2</tspan>/n<tspan baseline-shift="sub" font-size="10">2</tspan></text><text x="350.0" y="408.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#55606b" >direct relationship; constant P, T</text><path d="M36 72 v76 h56 v-76" fill="none" stroke="#2d3f4b" stroke-width="2"/><rect x="38" y="78" width="52" height="8" fill="#55606b"/><line x1="64.0" y1="78.0" x2="64.0" y2="68.0" stroke="#55606b" stroke-width="4"/><circle cx="49.7" cy="134.0" r="3.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="74.3" cy="105.0" r="3.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="63.8" cy="114.5" r="3.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="69.9" cy="131.1" r="3.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="48.2" cy="93.9" r="3.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="77.1" cy="113.7" r="3.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="74.2" cy="92.6" r="3.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><circle cx="61.9" cy="127.9" r="3.5" fill="#9fb6d6" stroke="#2d3f4b" stroke-width="1"/><text x="64.0" y="166.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2d3f4b" >low P, big V</text><path d="M140 72 v76 h56 