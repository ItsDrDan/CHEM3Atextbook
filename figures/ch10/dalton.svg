"13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Each gas: P<tspan baseline-shift="sub" font-size="10">i</tspan> = X<tspan baseline-shift="sub" font-size="10">i</tspan> × P<tspan baseline-shift="sub" font-size="10">total</tspan>   (X = mole fraction)</text><text x="235.0" y="290.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Same container and temperature: each gas pushes as if it were alone.</text></svg>