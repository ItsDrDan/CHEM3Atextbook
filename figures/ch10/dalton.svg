<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 302" width="470" height="302" role="img" aria-label="Dalton's law of partial pressures. Three equal containers at the same temperature: O2 alone has a pressure of 0.20 atm; N2 alone has 0.80 atm; the two mixed together in one container have a total pressure of 1.00 atm. P total = P1 + P2 + P3 and so on. For each gas, the partial pressure P i = X i times P total, where X is the mole fraction. In the same container and temperature, each gas pushes as if it were alone."><rect width="470" height="302" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5fa8"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Dalton's law of partial pressures</text><rect x="14" y="44" width="130" height="130" fill="#fff" stroke="#2d3f4b" stroke-width="2.2"/><circle cx="73.6" cy="115.8" r="5" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><circle cx="127.4" cy="105.1" r="5" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><circle cx="79.9" cy="119.0" r="5" fill="#f2b8b0" stroke="#2d3f4b" stroke-width="1"/><text x="79.0" y="192.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O<tspan baseline-shift="sub" font-size="10">2</tspan> alone</text><text x="79.0" y="212.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >P = 0.20 atm</text><rect x="170" y="44" width="130" height="130"