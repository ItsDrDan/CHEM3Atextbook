<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 388" width="470" height="388" role="img" aria-label="Top: a scale of electronegativity difference, delta EN, from 0 to 3.3, divided into three bands: 0 to 0.4 nonpolar covalent, 0.4 to 2.0 polar covalent, and above 2.0 ionic. Examples using yellow-sheet values: Cl-Cl 0.0, C-H 0.4, O-H 1.4, Na-Cl 2.1. Bottom: carbon dioxide is linear, O=C=O, with two bond dipole arrows pointing outward toward the oxygen atoms in opposite directions, so they cancel and CO2 is a nonpolar molecule. Water is bent, with bond dipole arrows pointing from each H toward O; they add to a net dipole pointing toward the oxygen side, so water is a polar molecule, with partial negative charge on O and partial positive charges on the H atoms. Arrows point toward the more electronegative atom. SNAP: symmetrical is nonpolar; asymmetrical is polar."><rect width="470" height="388" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Bond type from electronegativity difference (ΔEN)</text><rect x="30.0" y="60" width="49.6969696969697" height="34" fill="#e3f2e1" stroke="#2d3f4b"/><rect x="79.6969696969697" y="60" width="198.7878787878788" height="34" fill="#fde9c8" stroke="#2d3f4b"/><rect x="278.4848484848485" y="60" width="161.5151515151515" height="34" fill="#dbe7f6" stroke="#2d3f4b"/><text x="54.8" y="82.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NP</text><text x="179.1" y="82.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >polar covalent</text><text x="359.2" y="82.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >ionic</text><text x="30.0" y="112.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >0</text><text x="79.7" y="112.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >0.4</text><text x="278.5" y="112.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >2.0</text><text x="440.0" y="112.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >3.3</text><text x="235.0" y="136.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >0–0.4 nonpolar covalent (NP) · 0.4–2.0 polar covalent · above 2.0 ionic</text><text x="235.0" y="154.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Examples: Cl–Cl 0.0 · C–H 0.4 · O–H 1.4 · Na–Cl 2.1 (yellow-sheet values)</text><text x="235.0" y="182.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Polar bonds, polar or nonpolar molecule?</text><line x1="60" y1="240" x2="180" y2="240" stroke="#2d3f4b" stroke-width="3"/><circle cx="60" cy="240" r="15" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.6"/><text x="60.0" y="245.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="120" cy="240" r="15" fill="#e9eef4" stroke="#2d3f4b" stroke-width="1.6"/><text x="120.0" y="245.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><circle cx="180" cy="240" r="15" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.6"/><text x="180.0" y="245.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><path d="M108.0 212.0 L72.0 212.0" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><path d="M132.0 212.0 L168.0 212.0" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="120.0" y="310.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >CO<tspan baseline-shift="sub" font-size="11">2</tspan>: linear, dipoles cancel</text><text x="120.0" y="328.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NONPOLAR molecule</text><line x1="350" y1="230" x2="308" y2="260" stroke="#2d3f4b" stroke-width="3"/><line x1="350" y1="230" x2="392" y2="260" stroke="#2d3f4b" stroke-width="3"/><circle cx="350" cy="230" r="15" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.6"/><text x="350.0" y="235.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="308" cy="260" r="15" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><text x="308.0" y="265.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="392" cy="260" r="15" fill="#fff" stroke="#2d3f4b" stroke-width="1.6"/><text x="392.0" y="265.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><path d="M320.0 268.0 L338.0 254.0" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><path d="M380.0 268.0 L362.0 254.0" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><path d="M436.0 270.0 L436.0 232.0" stroke="#2f6f9a" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="444.0" y="256.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2f6f9a" >net</text><text x="350.0" y="206.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >δ−</text><text x="308.0" y="292.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >δ+</text><text x="392.0" y="292.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >δ+</text><text x="350.0" y="310.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >H<tspan baseline-shift="sub" font-size="11">2</tspan>O: bent, dipoles add</text><text x="350.0" y="328.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >POLAR molecule</text><text x="235.0" y="356.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Arrows point toward the more electronegative atom.</text><text x="235.0" y="376.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >SNAP: Symmetrical = Nonpolar; Asymmetrical = Polar.</text></svg>