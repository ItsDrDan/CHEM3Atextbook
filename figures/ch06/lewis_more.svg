ans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#2d3f4b" >+</text><text x="120.0" y="324.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >NH<tspan baseline-shift="sub" font-size="11">4</tspan><tspan baseline-shift="super" font-size="11">+</tspan>: 5 + 4 − 1 = 8 e⁻</text><line x1="346.0" y1="244.0" x2="364.0" y2="244.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="346.0" y1="250.0" x2="364.0" y2="250.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="346.0" y1="256.0" x2="364.0" y2="256.0" stroke="#2d3f4b" stroke-width="2.2"/><text x="333.0" y="257.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><text x="377.0" y="257.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >N</text><circle cx="316.0" cy="246.0" r="2.3" fill="#2d3f4b"/><circle cx="316.0" cy="254.0" r="2.3" fill="#2d3f4b"/><circle cx="394.0" cy="254.0" r="2.3" fill="#2d3f4b"/><circle cx="394.0" cy="246.0" r="2.3" fill="#2d3f4b"/><path d="M299 226 h-8 v48 h8 M411 226 h8 v48 h-8" stroke="#2d3f4b" stroke-width="2" fill="none"/><text x="429.0" y="230.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#2d3f4b" >−</text><text x="355.0" y="324.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >CN<tspan baseline-shift="super" font-size="11">−</tspan>: 4 + 5 + 1 = 10 e⁻</text><text x="235.0" y="352.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Ions go in square brackets with the charge outside.</text><text x="235.0" y="370.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Add one electron per nega