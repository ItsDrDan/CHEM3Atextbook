<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 382" width="470" height="382" role="img" aria-label="Four more Lewis structures. Methanol, CH3OH: a carbon bonded to three H atoms and to O; O bonded to H, with two lone pairs on O. Ethylene, C2H4: two carbon atoms joined by a double bond, each also bonded to two H atoms. Ammonium ion, NH4+: N bonded to four H atoms, no lone pairs, in square brackets with a + charge; electron count 5 + 4 - 1 = 8. Cyanide ion, CN-: C triple-bonded to N, one lone pair on each atom, in square brackets with a - charge; electron count 4 + 5 + 1 = 10. Ions go in square brackets with the charge outside; add one electron per negative charge and subtract one per positive charge."><rect width="470" height="382" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >More Lewis structures</text><line x1="103.0" y1="92.0" x2="125.0" y2="92.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="151.0" y1="92.0" x2="165.0" y2="92.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="77.0" y1="92.0" x2="59.0" y2="92.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="90.0" y1="79.0" x2="90.0" y2="65.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="90.0" y1="105.0" x2="90.0" y2="119.0" stroke="#2d3f4b" stroke-width="2.2"/><text x="90.0" y="99.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><text x="138.0" y="99.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><text x="178.0" y="99.