<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 494" width="470" height="494" role="img" aria-label="Four steps for drawing the Lewis structure of formaldehyde, CH2O. Step 1, skeleton: carbon in the center with O above and two H atoms below; hydrogen is never central. Step 2, count valence electrons: 4 from C, 1 from each H, 6 from O, total 12. Step 3, connect atoms with single bonds (6 electrons) and place the remaining 6 electrons as three lone pairs on O; carbon now has only 6 electrons. Step 4, move one lone pair from O to make a C=O double bond; check: C has 8 electrons, O has 8, each H has 2, and all 12 electrons are used."><rect width="470" height="494" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Drawing the Lewis structure of CH<tspan baseline-shift="sub" font-size="11">2</tspan>O (formaldehyde)</text><rect x="14" y="40" width="442" height="104" rx="10" fill="#f8fafc" stroke="#c9d3dc" stroke-width="1.3"/><text x="28.0" y="64.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start" fill="#2d3f4b" >Step 1. Skeleton: C in the center</text><text x="28.0" y="82.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3f4b" >(H is never central)</text><text x="330.0" y="105.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><text x="330.0" y="69.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><text x="290.0" y="127.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="370.0" y="127.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><rect x="14" y="152" width="442" height="104" rx="10" fill="#f8fafc" stroke="#c9d3dc" stroke-width="1.3"/><text x="28.0" y="176.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start" fill="#2d3f4b" >Step 2. Count: 4 + 2(1) + 6 = 12 e⁻</text><text x="330.0" y="217.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><text x="330.0" y="181.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><text x="290.0" y="239.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="370.0" y="239.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="28.0" y="216.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3f4b" >C 4, H 1 each, O 6</text><rect x="14" y="264" width="442" height="104" rx="10" fill="#f8fafc" stroke="#c9d3dc" stroke-width="1.3"/><text x="28.0" y="288.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start" fill="#2d3f4b" >Step 3. Single bonds, then lone pairs</text><text x="28.0" y="306.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3f4b" >6 e⁻ in bonds; 6 left go on O</text><line x1="330.0" y1="309.0" x2="330.0" y2="299.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="318.6" y1="328.3" x2="301.4" y2="337.7" stroke="#2d3f4b" stroke-width="2.2"/><line x1="341.4" y1="328.3" x2="358.6" y2="337.7" stroke="#2d3f4b" stroke-width="2.2"/><text x="330.0" y="329.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><text x="330.0" y="293.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><text x="290.0" y="351.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="370.0" y="351.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="347.0" cy="290.0" r="2.3" fill="#2d3f4b"/><circle cx="347.0" cy="282.0" r="2.3" fill="#2d3f4b"/><circle cx="334.0" cy="269.0" r="2.3" fill="#2d3f4b"/><circle cx="326.0" cy="269.0" r="2.3" fill="#2d3f4b"/><circle cx="313.0" cy="282.0" r="2.3" fill="#2d3f4b"/><circle cx="313.0" cy="290.0" r="2.3" fill="#2d3f4b"/><rect x="14" y="376" width="442" height="104" rx="10" fill="#f8fafc" stroke="#c9d3dc" stroke-width="1.3"/><text x="28.0" y="400.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start" fill="#2d3f4b" >Step 4. C has only 6 e⁻: share a</text><text x="28.0" y="418.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3f4b" >lone pair from O → C=O double bond</text><line x1="327.0" y1="421.0" x2="327.0" y2="411.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="333.0" y1="421.0" x2="333.0" y2="411.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="318.6" y1="440.3" x2="301.4" y2="449.7" stroke="#2d3f4b" stroke-width="2.2"/><line x1="341.4" y1="440.3" x2="358.6" y2="449.7" stroke="#2d3f4b" stroke-width="2.2"/><text x="330.0" y="441.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><text x="330.0" y="405.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><text x="290.0" y="463.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="370.0" y="463.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="347.0" cy="402.0" r="2.3" fill="#2d3f4b"/><circle cx="347.0" cy="394.0" r="2.3" fill="#2d3f4b"/><circle cx="313.0" cy="394.0" r="2.3" fill="#2d3f4b"/><circle cx="313.0" cy="402.0" r="2.3" fill="#2d3f4b"/><text x="28.0" y="442.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3f4b" >Check: C 8, O 8, H 2 each;</text><text x="28.0" y="458.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" fill="#2d3f4b" >12 e⁻ used.</text></svg>