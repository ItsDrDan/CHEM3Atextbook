<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 332" width="470" height="332" role="img" aria-label="Lewis structures of six molecules, each with every atom ending with an octet, or 2 electrons for hydrogen. Water, H2O: O single-bonded to two H atoms with two lone pairs on O. Ammonia, NH3: N single-bonded to three H atoms with one lone pair on N. Methane, CH4: C single-bonded to four H atoms, no lone pairs. Carbon dioxide, CO2: C double-bonded to each of two O atoms, each O with two lone pairs. Nitrogen, N2: a triple bond between the two N atoms, each with one lone pair. Hydrogen cyanide, HCN: H single-bonded to C, C triple-bonded to N, one lone pair on N. A line is a shared pair (bond); a dot pair is a lone pair. Usual numbers of bonds: H 1, O 2, N 3, C 4 (HONC 1-2-3-4)."><rect width="470" height="332" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Lewis structures: every atom ends with an octet (H: 2)</text><line x1="67.0" y1="80.0" x2="49.0" y2="80.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="93.0" y1="80.0" x2="111.0" y2="80.0" stroke="#2d3f4b" stroke-width="2.2"/><text x="80.0" y="87.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><text x="36.0" y="87.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="124.0" y="87.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="84.0" cy="63.0" r="2.3" fill="#2d3f4b"/><circle cx="76.0" cy="63.0" r="2.3" fill="#2d3f4b"/><circle cx="76.0" cy="97.0" r="2.3" fill="#2d3f4b"/><circle cx="84.0" cy="97.0" r="2.3" fill="#2d3f4b"/><text x="80.0" y="144.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >H<tspan baseline-shift="sub" font-size="11">2</tspan>O, water</text><line x1="223.7" y1="86.4" x2="204.3" y2="97.6" stroke="#2d3f4b" stroke-width="2.2"/><line x1="246.3" y1="86.4" x2="265.7" y2="97.6" stroke="#2d3f4b" stroke-width="2.2"/><line x1="235.0" y1="93.0" x2="235.0" y2="111.0" stroke="#2d3f4b" stroke-width="2.2"/><text x="235.0" y="87.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >N</text><text x="193.0" y="111.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="277.0" y="111.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="235.0" y="131.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="239.0" cy="63.0" r="2.3" fill="#2d3f4b"/><circle cx="231.0" cy="63.0" r="2.3" fill="#2d3f4b"/><text x="235.0" y="144.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >NH<tspan baseline-shift="sub" font-size="11">3</tspan>, ammonia</text><line x1="377.0" y1="80.0" x2="361.0" y2="80.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="403.0" y1="80.0" x2="419.0" y2="80.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="390.0" y1="67.0" x2="390.0" y2="53.0" stroke="#2d3f4b" stroke-width="2.2"/><line x1="390.0" y1="93.0" x2="390.0" y2="107.0" stroke="#2d3f4b" stroke-width="2.2"/><text x="390.0" y="87.2" font-family="Lato, Helvetica, Arial, sans-ser