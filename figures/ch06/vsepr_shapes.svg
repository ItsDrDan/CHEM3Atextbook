<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 752" width="470" height="752" role="img" aria-label="VSEPR shapes for up to four electron groups, drawn as ball-and-stick sketches. Linear: 2 groups, 0 lone pairs, 180 degrees, CO2. Trigonal planar: 3 groups, 0 lone pairs, 120 degrees, CH2O. Tetrahedral: 4 groups, 0 lone pairs, 109.5 degrees, CH4. Bent: 3 groups, 1 lone pair, about 120 degrees, O3 (ozone). Trigonal pyramidal: 4 groups, 1 lone pair, about 109.5 degrees, NH3. Bent: 4 groups, 2 lone pairs, about 109.5 degrees, H2O. Each shape is shown in its own row. Lone pairs are drawn as dashed yellow lobes; they push bonds closer together but are not part of the shape name. A dashed bond points away from you in three dimensions."><rect width="470" height="752" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >VSEPR shapes (up to four electron groups)</text><rect x="14" y="36" width="442" height="104" rx="10" fill="#f8fafc" stroke="#c9d3dc" stroke-width="1.3"/><line x1="94.0" y1="92.0" x2="46.4" y2="92.0" stroke="#2d3f4b" stroke-width="3" /><circle cx="46.4" cy="92.0" r="12" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.6"/><text x="46.4" y="97.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><line x1="94.0" y1="92.0" x2="141.6" y2="92.0" stroke="#2d3f4b" stroke-width="3" /><circle cx="141.6" cy="92.0" r="12" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.6"/><text x="141.6" y="97.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="8