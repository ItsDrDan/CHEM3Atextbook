<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 312" width="470" height="312" role="img" aria-label="Ionic bonding. A sodium atom with one valence electron transfers that electron to a chlorine atom with seven valence electrons, shown by a red curved arrow. The result is Na+ and Cl-, opposite charges that attract. Sodium loses one electron to become Na+ with the octet of neon; chlorine gains one electron to become Cl- with the octet of argon. Below, three kinds of ionic compounds in this course: salts, such as NaCl, CaCl2, and K2SO4; bases (hydroxides), such as NaOH and Ca(OH)2; and metal oxides, such as MgO and Fe2O3."><rect width="470" height="312" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ionic bonding: electrons are transferred</text><g transform="translate(0,26)"><text x="90.0" y="80.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na</text><circle cx="114" cy="66" r="3" fill="#c0392b"/><text x="240.0" y="80.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cl</text><circle cx="236" cy="48" r="2.6" fill="#2d3f4b"/><circle cx="244" cy="48" r="2.6" fill="#2d3f4b"/><circle cx="236" cy="94" r="2.6" fill="#2d3f4b"/><circle cx="244" cy="94" r="2.6" fill="#2d3f4b"/><circle cx="264" cy="68" r="2.6" fill="#2d3f4b"/><circle cx="264" cy="76" r="2.6" fill="#2d3f4b"/><circle cx="216" cy="68" r="2.6" fill="#2d3f4b"/><path d="M118 60 C 150 30, 190 30, 212 62" stroke="#c0392b" stroke-width="2.2" fill="none" marker-end="url(#arr)"/><text x="165.0" y="30.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b" >1 electron moves</text><text x="90.0" y="112.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >1 valence e⁻</text><text x="240.0" y="112.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >7 valence e⁻</text><path d="M300.0 72.0 L350.0 72.0" stroke="#2d3f4b" stroke-width="2.6" fill="none" marker-end="url(#ar)"/><text x="395.0" y="80.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na⁺ Cl⁻</text><text x="395.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >opposite charges</text><text x="395.0" y="120.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >attract</text><text x="235.0" y="146.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Na loses 1 e⁻ → Na⁺ (the octet of neon)</text><text x="235.0" y="162.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Cl gains 1 e⁻ → Cl⁻ (the octet of argon)</text><line x1="20" y1="176" x2="450" y2="176" stroke="#c9d3dc" stroke-width="1.5"/><text x="235.0" y="198.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Three kinds of ionic compounds in this course</text><rect x="14" y="210" width="140" height="62" rx="10" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.8"/><text x="84.0" y="228.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Salts</text><text x="84.0" y="245.9" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >NaCl, CaCl<tspan baseline-shift="sub" font-size="11">2</tspan></text><text x="84.0" y="263.3" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >K<tspan baseline-shift="sub" font-size="11">2</tspan>SO<tspan baseline-shift="sub" font-size="11">4</tspan></text><rect x="165" y="210" width="140" height="62" rx="10" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.8"/><text x="235.0" y="237.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Bases (hydroxides)</text><text x="235.0" y="254.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >NaOH, Ca(OH)<tspan baseline-shift="sub" font-size="11">2</tspan></text><rect x="316" y="210" width="140" height="62" rx="10" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.8"/><text x="386.0" y="237.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Metal oxides</text><text x="386.0" y="254.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >MgO, Fe<tspan baseline-shift="sub" font-size="11">2</tspan>O<tspan baseline-shift="sub" font-size="11">3</tspan></text></g></svg>