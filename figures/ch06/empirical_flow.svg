<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 444" width="470" height="444" role="img" aria-label="Steps for finding an empirical formula, stacked with arrows: 1, grams of each element (from percent composition, assume 100 grams); 2, moles of each element (divide by atomic mass); 3, divide by the smallest number of moles; 4, whole-number subscripts (multiply by 2 or 3 if you see .5 or .33); 5, molecular formula, if needed: multiply by n, where n equals molar mass divided by empirical formula mass. Example: 40.0 percent C, 6.71 percent H, 53.3 percent O gives CH2O; with a molar mass of 180, the molecular formula is C6H12O6."><rect width="470" height="444" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Finding an empirical formula</text><rect x="60" y="36" width="350" height="58" rx="10" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.8"/><text x="235.0" y="61.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1. Grams of each element</text><text x="235.0" y="79.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(from % composition: assume 100 g)</text><path d="M235.0 94.0 L235.0 112.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="60" y="114" width="350" height="58" rx="10" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.8"/><text x="235.0" y="138.9" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2. Moles of each element</text><text x="235.0" y="157.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >divide by atomic mass</text><path d="M235.0 172.0 L235.0 190.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="60" y="192" width="350" height="58" rx="10" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.8"/><text x="235.0" y="216.9" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >3. Divide by the smallest</text><text x="235.0" y="235.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >number of moles</text><path d="M235.0 250.0 L235.0 268.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="60" y="270" width="350" height="58" rx="10" fill="#efe3f7" stroke="#2d3f4b" stroke-width="1.8"/><text x="235.0" y="294.9" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >4. Whole-number subscripts</text><text x="235.0" y="313.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(× 2 or × 3 if you see .5 or .33)</text><path d="M235.0 328.0 L235.0 346.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="60" y="348" width="350" height="58" rx="10" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.8"/><text x="235.0" y="372.9" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >5. Molecular formula?</text><text x="235.0" y="391.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >× n, where n = molar mass ÷ empirical mass</text><text x="235.0" y="432.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Example: 40.0% C, 6.71% H, 53.3% O → CH<tspan baseline-shift="sub" font-size="11">2</tspan>O; molar mass 180 → C<tspan baseline-shift="sub" font-size="11">6</tspan>H<tspan baseline-shift="sub" font-size="11">12</tspan>O<tspan baseline-shift="sub" font-size="11">6</tspan></text></svg>