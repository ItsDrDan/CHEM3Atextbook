<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 566" width="470" height="566" role="img" aria-label="Flowchart of the scientific method, top to bottom: observe (qualitative and quantitative data), ask a question, form a testable, falsifiable hypothesis, experiment (change one variable and keep a control), analyze (do the data support the hypothesis?). A dashed arrow from analyze back to hypothesis says: not supported, revise and test again. Results confirmed many times build scientific laws, which describe what happens, often as an equation, and scientific theories, which explain why it happens."><rect width="470" height="566" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><rect x="20" y="10" width="300" height="62" rx="12" fill="#eef5fb" stroke="#2d3f4b" stroke-width="2"/><text x="170.0" y="36.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Observe</text><text x="170.0" y="58.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >qualitative and quantitative data</text><path d="M170 72 l0 16" stroke="#2d3f4b" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="94" width="300" height="62" rx="12" fill="#eef5fb" stroke="#2d3f4b" stroke-width="2"/><text x="170.0" y="131.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ask a question</text><path d="M170 156 l0 16" stroke="#2d3f4b" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="178" width="300" height="62" rx="12" fill="#eef5fb" stroke="#2d3f4b" stroke-width="2"/><text x="170.0" y="204.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Hypothesis</text><text x="170.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >a testable, falsifiable explanation</text><path d="M170 240 l0 16" stroke="#2d3f4b" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="262" width="300" height="62" rx="12" fill="#eef5fb" stroke="#2d3f4b" stroke-width="2"/><text x="170.0" y="288.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Experiment</text><text x="170.0" y="310.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >change one variable; keep a control</text><path d="M170 324 l0 16" stroke="#2d3f4b" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="346" width="300" height="62" rx="12" fill="#eef5fb" stroke="#2d3f4b" stroke-width="2"/><text x="170.0" y="372.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Analyze</text><text x="170.0" y="394.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >do the data support the hypothesis?</text><path d="M320 377 h30 V209 h-26" fill="none" stroke="#2d3f4b" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="358.0" y="280.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >not</text><text x="358.0" y="297.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >supported:</text><text x="358.0" y="314.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >revise and</text><text x="358.0" y="331.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2d3f4b" >test again</text><path d="M170 434 l0 18" stroke="#2d3f4b" stroke-width="3" marker-end="url(#ar)"/><text x="235.0" y="470.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Results confirmed many times build:</text><rect x="8" y="482" width="220" height="74" rx="12" fill="#f1f8f3" stroke="#2d3f4b" stroke-width="2"/><text x="118.0" y="508.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Scientific law</text><text x="118.0" y="528.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >describes WHAT happens</text><text x="118.0" y="546.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(often an equation)</text><rect x="242" y="482" width="220" height="74" rx="12" fill="#f1f8f3" stroke="#2d3f4b" stroke-width="2"/><text x="352.0" y="508.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Scientific theory</text><text x="352.0" y="528.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >explains WHY it happens</text><text x="352.0" y="546.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(tested many times)</text></svg>