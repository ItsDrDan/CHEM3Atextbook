<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 478" width="470" height="478" role="img" aria-label="A tall cylinder with three liquid layers: corn syrup (1.37 g/mL) on the bottom, water (1.00 g/mL) in the middle, vegetable oil (0.92 g/mL) on top. A cork (0.24 g/mL) floats at the top of the oil, a plastic bead (1.05 g/mL) rests at the boundary between the water and the syrup, and a steel nut (7.9 g/mL) lies on the bottom."><rect width="470" height="478" fill="#fff"/><rect x="42" y="250" width="136" height="80" fill="#e8b04a"/><line x1="190" y1="290.0" x2="214" y2="290.0" stroke="#2d3f4b" stroke-width="1.5"/><text x="222.0" y="288.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2d3f4b" >Corn syrup</text><text x="222.0" y="307.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#2d3f4b" >1.37 g/mL</text><rect x="42" y="170" width="136" height="80" fill="#bfe0f5"/><line x1="190" y1="210.0" x2="214" y2="210.0" stroke="#2d3f4b" stroke-width="1.5"/><text x="222.0" y="208.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2d3f4b" >Water</text><text x="222.0" y="227.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#2d3f4b" >1.00 g/mL</text><rect x="42" y="110" width="136" height="60" fill="#f6e7a1"/><line x1="190" y1="140.0" x2="214" y2="140.0" stroke="#2d3f4b" stroke-width="1.5"/><text x="222.0" y="138.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2d3f4b" >Vegetable oil</text><text x="222.0" y="157.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#2d3f4b" >0.92 g/mL</text><path d="M42 330 a12 12 0 0 0 12 12 h112 a12 12 0 0 0 12 -12 z" fill="#e8b04a"/><path d="M40 30 v300 a14 14 0 0 0 14 14 h112 a14 14 0 0 0 14 -14 v-300" fill="none" stroke="#2d3f4b" stroke-width="3"/><rect x="90" y="104" width="28" height="22" rx="3" fill="#fff" stroke="#2d3f4b" stroke-width="1.5"/><text x="104.0" y="120.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >C</text><circle cx="130" cy="250" r="13" fill="#fff" stroke="#2d3f4b" stroke-width="1.5"/><text x="130.0" y="255.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >P</text><rect x="65" y="315" width="28" height="18" rx="3" fill="#aaa" stroke="#2d3f4b" stroke-width="1.5"/><text x="79.0" y="329.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >S</text><text x="12.0" y="378.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#2d3f4b" xml:space="preserve">C = cork (0.24 g/mL): floats on the oil.</text><text x="12.0" y="399.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#2d3f4b" xml:space="preserve">P = plastic bead (1.05 g/mL): sinks in water,</text><text x="12.0" y="420.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#2d3f4b" xml:space="preserve">  floats on corn syrup.</text><text x="12.0" y="441.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#2d3f4b" xml:space="preserve">S = steel nut (7.9 g/mL): sinks to the bottom.</text><text x="12.0" y="462.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#2d3f4b" xml:space="preserve">Densest layer on the bottom, least dense on top.</text></svg>