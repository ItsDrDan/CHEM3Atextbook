<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 414" width="470" height="414" role="img" aria-label="Flowchart. Matter divides into pure substances (one kind of particle, fixed composition) and mixtures (two or more kinds, not bonded, variable composition). A pure substance is either an element (one kind of atom: He, O2, Fe) or a compound (elements bonded: H2O, NaCl); pure substances are separated only by chemical change. A mixture is either homogeneous (uniform: saline, air) or heterogeneous (not uniform: whole blood); mixtures are separated by physical methods."><rect width="470" height="414" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><rect x="120.0" y="8" width="230" height="58" rx="10" fill="#eef5fb" stroke="#2d3f4b" stroke-width="2"/><text x="235.0" y="33.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Matter</text><text x="235.0" y="54.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >has mass, takes up space</text><path d="M190 66 L125 112" stroke="#2d3f4b" stroke-width="2" marker-end="url(#ar)"/><path d="M280 66 L345 112" stroke="#2d3f4b" stroke-width="2" marker-end="url(#ar)"/><text x="118.0" y="90.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#2d3f4b" font-style="italic">one kind</text><text x="118.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end" fill="#2d3f4b" font-style="italic">of particle</text><text x="352.0" y="90.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" font-style="italic">two or more kinds,</text><text x="352.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" font-style="italic">not bonded</text><rect x="12.0" y="114" width="212" height="58" rx="10" fill="#eef5fb" stroke="#2d3f4b" stroke-width="2"/><text x="118.0" y="139.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Pure substance</text><text x="118.0" y="160.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >fixed composition</text><rect x="246.0" y="114" width="212" height="58" rx="10" fill="#eef5fb" stroke="#2d3f4b" stroke-width="2"/><text x="352.0" y="139.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Mixture</text><text x="352.0" y="160.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >variable composition</text><path d="M118 172 L118 210" stroke="#2d3f4b" stroke-width="2" marker-end="url(#ar)"/><path d="M352 172 L352 210" stroke="#2d3f4b" stroke-width="2" marker-end="url(#ar)"/><rect x="12.0" y="212" width="212" height="58" rx="10" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><text x="118.0" y="237.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Element</text><text x="118.0" y="258.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >one kind of atom: He, O₂, Fe</text><rect x="246.0" y="212" width="212" height="58" rx="10" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><text x="352.0" y="237.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Homogeneous</text><text x="352.0" y="258.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >uniform: saline, air</text><text x="118.0" y="292.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" font-style="italic">or</text><text x="352.0" y="292.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" font-style="italic">or</text><rect x="12.0" y="302" width="212" height="58" rx="10" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><text x="118.0" y="327.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Compound</text><text x="118.0" y="348.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >elements bonded: H₂O, NaCl</text><rect x="246.0" y="302" width="212" height="58" rx="10" fill="#fff" stroke="#2d3f4b" stroke-width="2"/><text x="352.0" y="327.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Heterogeneous</text><text x="352.0" y="348.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >not uniform: whole blood</text><text x="118.0" y="388.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" font-style="italic">separated only by</text><text x="118.0" y="404.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" font-style="italic">chemical change</text><text x="352.0" y="388.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" font-style="italic">separated by</text><text x="352.0" y="404.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" font-style="italic">physical methods</text></svg>