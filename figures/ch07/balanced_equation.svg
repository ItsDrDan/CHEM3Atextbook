<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 308" width="470" height="308" role="img" aria-label="A balanced equation for the combustion of methane: CH4(g) + 2 O2(g) gives CO2(g) + 2 H2O(g), drawn with ball molecules. Reactants: one methane molecule (one C, four H) and two O2 molecules. Products: one CO2 molecule and two water molecules. Atom counts: carbon 1 on each side; hydrogen 4 on the left and 2 times 2 equals 4 on the right; oxygen 2 times 2 equals 4 on the left and 2 plus 2 equals 4 on the right. Coefficients count molecules; never change subscripts to balance."><rect width="470" height="308" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A balanced equation: atoms are only rearranged</text><text x="235.0" y="52.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >CH<tspan baseline-shift="sub" font-size="11">4</tspan>(g) + 2 O<tspan baseline-shift="sub" font-size="11">2</tspan>(g) → CO<tspan baseline-shift="sub" font-size="11">2</tspan>(g) + 2 H<tspan baseline-shift="sub" font-size="11">2</tspan>O(g)</text><circle cx="40" cy="110" r="13" fill="#d9dde2" stroke="#2d3f4b" stroke-width="1.2"/><text x="40.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><circle cx="22" cy="94" r="9" fill="#ffffff" stroke="#2d3f4b" stroke-width="1.2"/><text x="22.0" y="98.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="58" cy="94" r="9" fill="#ffffff" stroke="#2d3f4b" stroke-width="1.2"/><text x="58.0" y="98.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="22" cy="126" r="9" fill="#ffffff" stroke="#2d3f4b" stroke-width="1.2"/><text x="22.0" y="130.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="58" cy="126" r="9" fill="#ffffff" stroke="#2d3f4b" stroke-width="1.2"/><text x="58.0" y="130.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="78.0" y="115.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#2d3f4b" >+</text><circle cx="108" cy="90" r="11" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.2"/><text x="108.0" y="94.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="128" cy="90" r="11" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.2"/><text x="128.0" y="94.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="108" cy="130" r="11" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.2"/><text x="108.0" y="134.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="128" cy="130" r="11" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.2"/><text x="128.0" y="134.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><path d="M160.0 110.0 L220.0 110.0" stroke="#2d3f4b" stroke-width="2.6" fill="none" marker-end="url(#ar)"/><circle cx="232" cy="110" r="11" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.2"/><text x="232.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="254" cy="110" r="13" fill="#d9dde2" stroke="#2d3f4b" stroke-width="1.2"/><text x="254.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >C</text><circle cx="276" cy="110" r="11" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.2"/><text x="276.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><text x="304.0" y="115.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#2d3f4b" >+</text><circle cx="345" cy="88" r="11" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.2"/><text x="345.0" y="92.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="329" cy="100" r="9" fill="#ffffff" stroke="#2d3f4b" stroke-width="1.2"/><text x="329.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="361" cy="100" r="9" fill="#ffffff" stroke="#2d3f4b" stroke-width="1.2"/><text x="361.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="400" cy="122" r="11" fill="#f6d5d1" stroke="#2d3f4b" stroke-width="1.2"/><text x="400.0" y="126.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O</text><circle cx="384" cy="134" r="9" fill="#ffffff" stroke="#2d3f4b" stroke-width="1.2"/><text x="384.0" y="138.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><circle cx="416" cy="134" r="9" fill="#ffffff" stroke="#2d3f4b" stroke-width="1.2"/><text x="416.0" y="138.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H</text><text x="100.0" y="174.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Reactants</text><text x="340.0" y="174.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Products</text><text x="100.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >C: 1</text><text x="340.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >C: 1</text><text x="100.0" y="224.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >H: 4</text><text x="340.0" y="224.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >H: 2 × 2 = 4</text><text x="100.0" y="246.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >O: 2 × 2 = 4</text><text x="340.0" y="246.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >O: 2 + 2 = 4</text><text x="235.0" y="278.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Coefficients (big numbers in front) count molecules;</text><text x="235.0" y="296.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >never change subscripts to balance.</text></svg>