<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 430" width="470" height="430" role="img" aria-label="Five reaction patterns, each in its own colored row with a general form and an example. Combination: A + B gives AB; example 2 Mg + O2 gives 2 MgO. Decomposition: AB gives A + B; example 2 H2O2 gives 2 H2O + O2. Single displacement: A + BC gives AC + B; example Zn + CuSO4 gives ZnSO4 + Cu. Double displacement: AB + CD gives AD + CB; example AgNO3 + NaCl gives AgCl + NaNO3. Combustion: fuel + O2 gives CO2 + H2O; example CH4 + 2 O2 gives CO2 + 2 H2O."><rect width="470" height="430" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Five reaction patterns</text><rect x="14" y="36" width="442" height="70" rx="10" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.5"/><text x="28.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >Combination</text><text x="442.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#2d3f4b" >A + B → AB</text><text x="28.0" y="88.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >Example: 2 Mg + O<tspan baseline-shift="sub" font-size="11">2</tspan> → 2 MgO</text><rect x="14" y="114" width="442" height="70" rx="10" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.5"/><text x="28.0" y="138.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >Decomposition</text><text x="442.0" y="138.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#2d3f4b" >AB → A + B</text><text x="28.0" y="166.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >Example: 2 H<tspan baseline-shift="sub" font-size="11">2</tspan>O<tspan baseline-shift="sub" font-size="11">2</tspan> → 2 H<tspan baseline-shift="sub" font-size="11">2</tspan>O + O<tspan baseline-shift="sub" font-size="11">2</tspan></text><rect x="14" y="192" width="442" height="70" rx="10" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.5"/><text x="28.0" y="216.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >Single displacement</text><text x="442.0" y="216.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#2d3f4b" >A + BC → AC + B</text><text x="28.0" y="244.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >Example: Zn + CuSO<tspan baseline-shift="sub" font-size="11">4</tspan> → ZnSO<tspan baseline-shift="sub" font-size="11">4</tspan> + Cu</text><rect x="14" y="270" width="442" height="70" rx="10" fill="#efe3f7" stroke="#2d3f4b" stroke-width="1.5"/><text x="28.0" y="294.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >Double displacement</text><text x="442.0" y="294.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#2d3f4b" >AB + CD → AD + CB</text><text x="28.0" y="322.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >Example: AgNO<tspan baseline-shift="sub" font-size="11">3</tspan> + NaCl → AgCl + NaNO<tspan baseline-shift="sub" font-size="11">3</tspan></text><rect x="14" y="348" width="442" height="70" rx="10" fill="#fbe3d8" stroke="#2d3f4b" stroke-width="1.5"/><text x="28.0" y="372.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#2d3f4b" >Combustion</text><text x="442.0" y="372.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" fill="#2d3f4b" >fuel + O<tspan baseline-shift="sub" font-size="11">2</tspan> → CO<tspan baseline-shift="sub" font-size="11">2</tspan> + H<tspan baseline-shift="sub" font-size="11">2</tspan>O</text><text x="28.0" y="400.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >Example: CH<tspan baseline-shift="sub" font-size="11">4</tspan> + 2 O<tspan baseline-shift="sub" font-size="11">2</tspan> → CO<tspan baseline-shift="sub" font-size="11">2</tspan> + 2 H<tspan baseline-shift="sub" font-size="11">2</tspan>O</text></svg>