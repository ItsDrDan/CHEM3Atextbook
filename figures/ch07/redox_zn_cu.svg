<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 314" width="470" height="314" role="img" aria-label="A zinc strip standing in blue copper(II) sulfate solution. Two electrons, shown by a red arrow, move from the zinc to a Cu2+ ion; reddish copper metal forms on the strip and Zn2+ ions enter the solution. Oxidation, LEO: Zn(s) gives Zn2+(aq) + 2 electrons. Reduction, GER: Cu2+(aq) + 2 electrons gives Cu(s). Overall: Zn(s) + Cu2+(aq) gives Zn2+(aq) + Cu(s). Zinc is the reducing agent; Cu2+ is the oxidizing agent. The blue color fades as Cu2+ is used up."><rect width="470" height="314" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Zinc metal in copper(II) sulfate solution</text><path d="M150 40 L150 182 Q150 190 158 190 L312 190 Q320 190 320 182 L320 40" fill="none" stroke="#2d3f4b" stroke-width="2"/><rect x="152" y="68" width="166" height="120" fill="#cfe2f7"/><rect x="222" y="30" width="26" height="150" fill="#b8bec6" stroke="#2d3f4b" stroke-width="1.5"/><text x="235.0" y="50.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Zn</text><circle cx="250" cy="150" r="4" fill="#b8733f" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="256" cy="165" r="4" fill="#b8733f" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="246" cy="172" r="4" fill="#b8733f" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="222" cy="160" r="4" fill="#b8733f" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="216" cy="172" r="4" fill="#b8733f" stroke="#2d3f4b" stroke-width="0.8"/><circle cx="185" cy="120" r="14" fill="#cfe2f7" stroke="#2d3f4b" stroke-width="1.3"/><text x="185.0" y="124.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cu²⁺</text><circle cx="290" cy="110" r="14" fill="#cfe2f7" stroke="#2d3f4b" stroke-width="1.3"/><text x="290.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cu²⁺</text><circle cx="290" cy="160" r="14" fill="#eee" stroke="#2d3f4b" stroke-width="1.3"/><text x="290.0" y="164.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Zn²⁺</text><path d="M222 120 C 210 112, 205 115, 200 118" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="190.0" y="96.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#c0392b" >2 e⁻</text><text x="330.0" y="148.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#2d3f4b" >copper</text><text x="330.0" y="162.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#2d3f4b" >metal forms</text><text x="235.0" y="214.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Oxidation (LEO): Zn(s) → Zn²⁺(aq) + 2 e⁻</text><text x="235.0" y="236.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Reduction (GER): Cu²⁺(aq) + 2 e⁻ → Cu(s)</text><text x="235.0" y="260.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Overall: Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)</text><text x="235.0" y="284.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Zn is the reducing agent; Cu²⁺ is the oxidizing agent.</text><text x="235.0" y="302.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >The blue color fades as Cu²⁺ is used up.</text></svg>