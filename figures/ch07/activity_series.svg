<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 488" width="470" height="488" role="img" aria-label="A short activity series of metals, listed from most active at the top to least active at the bottom: Li, K, Ca, Na, Mg, Al, Zn, Fe, Ni, Sn, Pb, H2, Cu, Ag, Au. An arrow pointing up is labeled more easily oxidized, more active. Notes: the metals at the very top react with water and with acids; metals above hydrogen react with acids, releasing H2; metals below hydrogen (Cu, Ag, Au) do not react with acids. A metal replaces the ions of any metal below it: Zn + Cu2+ reacts; Cu + Zn2+ gives no reaction."><rect width="470" height="488" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A short activity series of metals</text><rect x="150" y="44" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Li</text><rect x="150" y="70" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="86.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >K</text><rect x="150" y="96" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="112.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ca</text><rect x="150" y="122" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="138.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na</text><rect x="150" y="148" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="164.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Mg</text><rect x="150" y="174" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="190.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Al</text><rect x="150" y="200" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="216.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Zn</text><rect x="150" y="226" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="242.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Fe</text><rect x="150" y="252" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="268.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ni</text><rect x="150" y="278" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="294.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Sn</text><rect x="150" y="304" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="320.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Pb</text><rect x="150" y="330" width="90" height="22" rx="5" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="346.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H₂</text><rect x="150" y="356" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="372.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cu</text><rect x="150" y="382" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="398.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ag</text><rect x="150" y="408" width="90" height="22" rx="5" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.2"/><text x="195.0" y="424.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Au</text><path d="M120.0 430.0 L120.0 48.0" stroke="#2d3f4b" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="108.0" y="240.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2d3f4b" transform="rotate(-90 108 240)">more easily oxidized (more active)</text><text x="260.0" y="60.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >React with water</text><text x="260.0" y="74.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >and with acids</text><text x="260.0" y="200.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >React with acids,</text><text x="260.0" y="214.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >releasing H₂</text><text x="260.0" y="370.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >Do not react</text><text x="260.0" y="384.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >with acids</text><text x="235.0" y="456.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A metal replaces the ions of any metal BELOW it.</text><text x="235.0" y="476.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Zn + Cu²⁺ → reacts.   Cu + Zn²⁺ → no reaction.</text></svg>