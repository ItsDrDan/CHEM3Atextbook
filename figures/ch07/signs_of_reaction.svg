<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 382" width="470" height="382" role="img" aria-label="Four kinds of evidence that a chemical reaction happened, each with a beaker sketch: gas forms (bubbles rising in the liquid); a solid forms (a precipitate settling at the bottom of a clear solution); color changes (a blue solution becoming a green one, a new substance); and energy changes (heat, light, or cold, shown as wavy lines above the beaker). Evidence is a clue, not proof: boiling water bubbles too, which is a physical change."><rect width="470" height="382" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Evidence that a chemical reaction happened</text><rect x="14" y="36" width="218" height="150" rx="10" fill="#f8fafc" stroke="#c9d3dc"/><path d="M83 50 L83 132 Q83 140 91 140 L155 140 Q163 140 163 132 L163 50" fill="none" stroke="#2d3f4b" stroke-width="2"/><rect x="85" y="78" width="76" height="60" fill="#e8f2fb"/><circle cx="103" cy="106" r="5" fill="#fff" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="123" cy="91" r="6" fill="#fff" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="141" cy="111" r="4" fill="#fff" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="113" cy="76" r="5" fill="#fff" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="133" cy="126" r="5" fill="#fff" stroke="#2d3f4b" stroke-width="1.3"/><text x="123.0" y="164.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Gas forms</text><text x="123.0" y="180.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >bubbles</text><rect x="242" y="36" width="218" height="150" rx="10" fill="#f8fafc" stroke="#c9d3dc"/><path d="M311 50 L311 132 Q311 140 319 140 L383 140 Q391 140 391 132 L391 50" fill="none" stroke="#2d3f4b" stroke-width="2"/><rect x="313" y="78" width="76" height="60" fill="#e8f2fb"/><path d="M315 134 Q351 122 387 134 L387 138 L315 138z" fill="#f4f4f4" stroke="#2d3f4b" stroke-width="1.3"/><circle cx="321.0" cy="132" r="2.2" fill="#2d3f4b"/><circle cx="326.5" cy="130" r="2.2" fill="#2d3f4b"/><circle cx="332.0" cy="128" r="2.2" fill="#2d3f4b"/><circle cx="337.5" cy="132" r="2.2" fill="#2d3f4b"/><circle cx="343.0" cy="130" r="2.2" fill="#2d3f4b"/><circle cx="348.5" cy="128" r="2.2" fill="#2d3f4b"/><circle cx="354.0" cy="132" r="2.2" fill="#2d3f4b"/><circle cx="359.5" cy="130" r="2.2" fill="#2d3f4b"/><circle cx="365.0" cy="128" r="2.2" fill="#2d3f4b"/><circle cx="370.5" cy="132" r="2.2" fill="#2d3f4b"/><circle cx="376.0" cy="130" r="2.2" fill="#2d3f4b"/><circle cx="381.5" cy="128" r="2.2" fill="#2d3f4b"/><text x="351.0" y="164.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >A solid forms</text><text x="351.0" y="180.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >precipitate</text><rect x="14" y="196" width="218" height="150" rx="10" fill="#f8fafc" stroke="#c9d3dc"/><path d="M53 210 L53 292 Q53 300 61 300 L105 300 Q113 300 113 292 L113 210" fill="none" stroke="#2d3f4b" stroke-width="2"/><rect x="55" y="238" width="56" height="60" fill="#cfe2f7"/><path d="M119.0 266.0 L139.0 266.0" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M145 210 L145 292 Q145 300 153 300 L197 300 Q205 300 205 292 L205 210" fill="none" stroke="#2d3f4b" stroke-width="2"/><rect x="147" y="238" width="56" height="60" fill="#d8ead2"/><text x="8