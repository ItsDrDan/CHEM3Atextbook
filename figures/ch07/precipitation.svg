<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 272" width="470" height="272" role="img" aria-label="Particle view of a precipitation reaction. One box shows silver nitrate solution as separate Ag+ and NO3- ions; a second box shows sodium chloride solution as separate Na+ and Cl- ions. After mixing, the third box shows Na+ and NO3- ions still free in solution, and a layer of solid AgCl at the bottom. Molecular equation: AgNO3(aq) + NaCl(aq) gives AgCl(s) + NaNO3(aq). Spectator ions, unchanged: Na+ and NO3-. Net ionic equation: Ag+(aq) + Cl-(aq) gives AgCl(s)."><rect width="470" height="272" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Mixing AgNO<tspan baseline-shift="sub" font-size="11">3</tspan>(aq) and NaCl(aq)</text><rect x="14" y="40" width="140" height="120" rx="8" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.5"/><rect x="166" y="40" width="140" height="120" rx="8" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.5"/><circle cx="40" cy="70" r="13" fill="#d9dde2" stroke="#2d3f4b" stroke-width="1.3"/><text x="40.0" y="74.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ag⁺</text><circle cx="110" cy="90" r="13" fill="#d9dde2" stroke="#2d3f4b" stroke-width="1.3"/><text x="110.0" y="94.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ag⁺</text><circle cx="60" cy="130" r="13" fill="#d9dde2" stroke="#2d3f4b" stroke-width="1.3"/><text x="60.0" y="134.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ag⁺</text><circle cx="80" cy="64" r="15" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.3"/><text x="80.0" y="68.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NO₃⁻</text><circle cx="40" cy="112" r="15" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.3"/><text x="40.0" y="116.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NO₃⁻</text><circle cx="120" cy="135" r="15" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.3"/><text x="120.0" y="139.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NO₃⁻</text><circle cx="195" cy="70" r="13" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.3"/><text x="195.0" y="74.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na⁺</text><circle cx="260" cy="100" r="13" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.3"/><text x="260.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na⁺</text><circle cx="220" cy="135" r="13" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.3"/><text x="220.0" y="139.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na⁺</text><circle cx="240" cy="62" r="13" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.3"/><text x="240.0" y="66.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cl⁻</text><circle cx="190" cy="110" r="13" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.3"/><text x="190.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cl⁻</text><circle cx="280" cy="140" r="13" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.3"/><text x="280.0" y="144.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Cl⁻</text><text x="84.0" y="178.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >AgNO<tspan baseline-shift="sub" font-size="11">3</tspan>(aq)</text><text x="236.0" y="178.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >NaCl(aq)</text><path d="M318.0 100.0 L350.0 100.0" stroke="#2d3f4b" stroke-width="2.6" fill="none" marker-end="url(#ar)"/><rect x="356" y="40" width="100" height="120" rx="8" fill="#f6fafe" stroke="#2d3f4b" stroke-width="1.5"/><circle cx="380" cy="60" r="13" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.3"/><text x="380.0" y="64.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na⁺</text><circle cx="430" cy="72" r="13" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.3"/><text x="430.0" y="76.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na⁺</text><circle cx="390" cy="100" r="13" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.3"/><text x="390.0" y="104.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Na⁺</text><circle cx="420" cy="105" r="15" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.3"/><text x="420.0" y="109.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NO₃⁻</text><circle cx="375" cy="130" r="15" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.3"/><text x="375.0" y="134.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NO₃⁻</text><circle cx="440" cy="135" r="15" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.3"/><text x="440.0" y="139.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >NO₃⁻</text><rect x="360" y="148" width="92" height="12" fill="#eee" stroke="#2d3f4b"/><text x="406.0" y="158.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#2d3f4b" >AgCl(s)</text><text x="406.0" y="178.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >after mixing</text><text x="235.0" y="212.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2d3f4b" >Molecular: AgNO<tspan baseline-shift="sub" font-size="11">3</tspan>(aq) + NaCl(aq) → AgCl(s) + NaNO<tspan baseline-shift="sub" font-size="11">3</tspan>(aq)</text><text x="235.0" y="234.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Spectator ions (unchanged): Na⁺ and NO₃⁻</text><text x="235.0" y="258.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Net ionic: Ag⁺(aq) + Cl⁻(aq) → AgCl(s)</text></svg>