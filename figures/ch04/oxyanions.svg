<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 386" width="470" height="386" role="img" aria-label="Oxyanions of chlorine, all with a 1- charge, listed from most to fewest oxygen atoms: perchlorate, ClO4-, 4 oxygens, one more oxygen than the -ate ion; chlorate, ClO3-, 3 oxygens, the -ate ion on the green sheet; chlorite, ClO2-, 2 oxygens, one less oxygen than -ate; hypochlorite, ClO-, 1 oxygen, one less oxygen than -ite. The same pattern works for bromine and iodine, for example BrO3- bromate and IO- hypoiodite. Adding or removing oxygen never changes the charge."><rect width="470" height="386" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="24.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Oxyanions of chlorine (all 1− charge)</text><rect x="20" y="44" width="430" height="64" rx="10" fill="#efe3f7" stroke="#2d3f4b" stroke-width="1.5"/><text x="40.0" y="72.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start" fill="#2d3f4b" >ClO<tspan baseline-shift="sub" font-size="11">4</tspan><tspan baseline-shift="super" font-size="11">−</tspan></text><text x="150.0" y="72.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#2d3f4b" >perchlorate</text><text x="150.0" y="94.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >one MORE O than -ate</text><text x="400.0" y="72.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >4 O</text><rect x="20" y="118" width="430" height="64" rx="10" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.5"/><text x="40.0" y="146.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start" fill="#2d3f4b" >ClO<tspan baseline-shift="sub" font-size="11">3</tspan><tspan baseline-shift="super" font-size="11">−</tspan></text><text x="150.0" y="146.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#2d3f4b" >chlorate</text><text x="150.0" y="168.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >the -ate ion on your green sheet</text><text x="400.0" y="146.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >3 O</text><rect x="20" y="192" width="430" height="64" rx="10" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.5"/><text x="40.0" y="220.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start" fill="#2d3f4b" >ClO<tspan baseline-shift="sub" font-size="11">2</tspan><tspan baseline-shift="super" font-size="11">−</tspan></text><text x="150.0" y="220.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#2d3f4b" >chlorite</text><text x="150.0" y="242.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >one LESS O than -ate</text><text x="400.0" y="220.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2 O</text><rect x="20" y="266" width="430" height="64" rx="10" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.5"/><text x="40.0" y="294.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start" fill="#2d3f4b" >ClO<tspan baseline-shift="super" font-size="11">−</tspan></text><text x="150.0" y="294.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#2d3f4b" >hypochlorite</text><text x="150.0" y="316.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >one less O than -ite</text><text x="400.0" y="294.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1 O</text><text x="235.0" y="354.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Same pattern for Br and I: BrO<tspan baseline-shift="sub" font-size="11">3</tspan><tspan baseline-shift="super" font-size="11">−</tspan> bromate, IO<tspan baseline-shift="super" font-size="11">−</tspan> hypoiodite.</text><text x="235.0" y="374.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Adding or removing O never changes the charge.</text></svg>