<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 494" width="984" height="494" role="img" aria-label="Flowchart for naming any compound, in the order of the blue naming sheet. First question: is there a metal (or the ammonium ion, NH4+)? If yes, ask: can the metal have more than one charge? (Transition metals except Zn and Ag can, and so can Sn and Pb.) If no, count the elements: 2 elements is an ionic binary compound, named metal plus nonmetal with an -ide ending, for example NaCl, sodium chloride; 3 or more elements is an ionic ternary compound, named metal plus the polyatomic ion, keeping its ending, for example K2CO3, potassium carbonate. If yes, count the elements the same way, but write the metal charge as a Roman numeral: FeCl3, iron(III) chloride; CuSO4, copper(II) sulfate. If there is no metal, ask: is H written first (and is it aqueous)? If yes, it is an acid: H plus one element is named hydro-, root, -ic acid, for example HCl(aq), hydrochloric acid; an -ate ion becomes an -ic acid, for example HNO3, nitric acid; an -ite ion becomes an -ous acid, for example HNO2, nitrous acid. If no, count the elements: 1 element is a diatomic element, named as the element, for example Cl2, chlorine; 2 elements is a covalent binary compound, named with prefixes (no mono- on the first element) and an -ide ending, for example N2O4, dinitrogen tetroxide."><title>How to name any compound (blue naming sheet order)</title><rect width="984" height="494" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="492.0" y="26.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Naming any compound</text><rect x="302.0" y="38" width="380" height="44" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="492.0" y="65.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Is there a metal (or NH<tspan baseline-shift="sub" font-size="13">4</tspan><tspan baseline-shift="super" font-size="13">+</tspan>)?</text><path d="M492.0 82 V98" stroke="#2d3f4b" stroke-width="2.2" fill="none"/><path d="M248.0 98 H736.0" stroke="#2d3f4b" stroke-width="2.2" fill="none"/><path d="M248.0 98 L248.0 118" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M736.0 98 L736.0 118" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="253.0" y="100" width="39" height="18" fill="#fff"/><text x="256.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#2d3f4b" >YES</text><rect x="741.0" y="100" width="28" height="18" fill="#fff"/><text x="744.0" y="114.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#2d3f4b" >NO</text><rect x="68.0" y="120" width="360" height="74" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="248.0" y="141.9" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Can the metal have</text><text x="248.0" y="161.9" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >more than one charge?</text><text x="248.0" y="183.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#4a5a66" font-style="italic">transition metals except Zn, Ag; also Sn, Pb</text><rect x="576.0" y="120" width="320" height="74" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="736.0" y="152.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Is H written first</text><text x="736.0" y="172.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >(and aqueous)?</text><path d="M248.0 194 V208" stroke="#2d3f4b" stroke-width="2.2" fill="none"/><path d="M126.0 208 H370.0" stroke="#2d3f4b" stroke-width="2.2" fill="none"/><path d="M126.0 208 L126.0 230" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M370.0 208 L370.0 230" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="131.0" y="212" width="28" height="18" fill="#fff"/><text x="134.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#2d3f4b" >NO</text><rect x="375.0" y="212" width="39" height="18" fill="#fff"/><text x="378.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#2d3f4b" >YES</text><path d="M736.0 194 V208" stroke="#2d3f4b" stroke-width="2.2" fill="none"/><path d="M614.0 208 H858.0" stroke="#2d3f4b" stroke-width="2.2" fill="none"/><path d="M614.0 208 L614.0 230" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M858.0 208 L858.0 230" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="619.0" y="212" width="39" height="18" fill="#fff"/><text x="622.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#2d3f4b" >YES</text><rect x="863.0" y="212" width="28" height="18" fill="#fff"/><text x="866.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#2d3f4b" >NO</text><rect x="8.0" y="232" width="236" height="34" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="126.0" y="254.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Count the elements</text><rect x="252.0" y="232" width="236" height="34" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="370.0" y="254.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Count the elements</text><rect x="496.0" y="232" width="236" height="34" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="614.0" y="254.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Acid</text><rect x="740.0" y="232" width="236" height="34" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="858.0" y="254.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Count the elements</text><rect x="24" y="280" width="220" height="68" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="134.0" y="303.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2 elements: ionic binary</text><text x="134.0" y="321.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >metal + nonmetal-ide</text><text x="134.0" y="339.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >NaCl, sodium chloride</text><rect x="24" y="358" width="220" height="86" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="134.0" y="381.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >3 or more: ionic ternary</text><text x="134.0" y="399.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >metal + polyatomic ion</text><text x="134.0" y="417.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(keep its ending)</text><text x="134.0" y="435.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >K<tspan baseline-shift="sub" font-size="12">2</tspan>CO<tspan baseline-shift="sub" font-size="12">3</tspan>, potassium carbonate</text><path d="M13 266 V401.0" stroke="#2d3f4b" stroke-width="2" fill="none"/><path d="M13 314.0 L23 314.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M13 401.0 L23 401.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="268" y="280" width="220" height="86" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="378.0" y="303.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2 elements: ionic binary</text><text x="378.0" y="321.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >metal (Roman numeral charge)</text><text x="378.0" y="339.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >+ nonmetal-ide</text><text x="378.0" y="357.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >FeCl<tspan baseline-shift="sub" font-size="12">3</tspan>, iron(III) chloride</text><rect x="268" y="376" width="220" height="104" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="378.0" y="399.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >3 or more: ionic ternary</text><text x="378.0" y="417.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >metal (Roman numeral charge)</text><text x="378.0" y="435.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >+ polyatomic ion</text><text x="378.0" y="453.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(keep ending)</text><text x="378.0" y="471.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >CuSO<tspan baseline-shift="sub" font-size="12">4</tspan>, copper(II) sulfate</text><path d="M257 266 V428.0" stroke="#2d3f4b" stroke-width="2" fill="none"/><path d="M257 323.0 L267 323.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M257 428.0 L267 428.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="512" y="280" width="220" height="68" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="622.0" y="303.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H + one element</text><text x="622.0" y="321.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >hydro- root -ic acid</text><text x="622.0" y="339.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >HCl(aq), hydrochloric acid</text><rect x="512" y="358" width="220" height="50" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="622.0" y="381.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >-ate ion → -ic acid</text><text x="622.0" y="399.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >HNO<tspan baseline-shift="sub" font-size="12">3</tspan>, nitric acid</text><rect x="512" y="418" width="220" height="50" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="622.0" y="441.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >-ite ion → -ous acid</text><text x="622.0" y="459.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >HNO<tspan baseline-shift="sub" font-size="12">2</tspan>, nitrous acid</text><path d="M501 266 V443.0" stroke="#2d3f4b" stroke-width="2" fill="none"/><path d="M501 314.0 L511 314.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M501 383.0 L511 383.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M501 443.0 L511 443.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><rect x="756" y="280" width="220" height="68" rx="8" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.6"/><text x="866.0" y="303.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1 element: diatomic</text><text x="866.0" y="321.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >name the element</text><text x="866.0" y="339.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Cl<tspan baseline-shift="sub" font-size="12">2</tspan>, chlorine</text><rect x="756" y="358" width="220" height="86" rx="8" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.6"/><text x="866.0" y="381.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2 elements: covalent binary</text><text x="866.0" y="399.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >prefixes + -ide</text><text x="866.0" y="417.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(no mono- on the first)</text><text x="866.0" y="435.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >N<tspan baseline-shift="sub" font-size="12">2</tspan>O<tspan baseline-shift="sub" font-size="12">4</tspan>, dinitrogen tetroxide</text><path d="M745 266 V401.0" stroke="#2d3f4b" stroke-width="2" fill="none"/><path d="M745 314.0 L755 314.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M745 401.0 L755 401.0" stroke="#2d3f4b" stroke-width="2" fill="none" marker-end="url(#ar)"/></svg>