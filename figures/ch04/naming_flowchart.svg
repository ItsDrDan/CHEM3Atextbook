<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 482" width="470" height="482" role="img" aria-label="Flowchart for naming any compound. Look at the formula. First question: does it start with H and is it dissolved in water (aq)? If yes, it is an acid (Section 4.5). If no, does it start with a metal or NH4? If yes, it is ionic (Sections 4.2 and 4.3). If no, is it only nonmetals? If yes, it is molecular (Section 4.4). Summary of rules: Acid: H plus an -ide ion gives hydro- -ic acid; -ate gives -ic acid; -ite gives -ous acid. Ionic: a fixed-charge metal (groups 1 and 2, plus Al, Zn, and Ag) keeps its name; any other metal gets a Roman numeral for its charge; the anion ends in -ide if it is one element, or keeps its polyatomic name. Molecular: Greek prefixes, no mono- on the first element, second element ends in -ide."><rect width="470" height="482" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Naming any compound</text><rect x="85" y="36" width="300" height="48" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="65.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Look at the formula</text><path d="M235 84 L235 104" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="20" y="106" width="430" height="62" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="133.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Starts with H and is dissolved in water (aq)?</text><text x="235.0" y="150.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >YES → ACID (Section 4.5)</text><path d="M235 168 L235 188" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="244.0" y="182.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >no</text><rect x="20" y="190" width="430" height="62" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="217.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Starts with a metal or NH<tspan baseline-shift="sub" font-size="11">4</tspan>?</text><text x="235.0" y="234.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >YES → IONIC (Sections 4.2–4.3)</text><path d="M235 252 L235 272" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="244.0" y="266.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#2d3f4b" >no</text><rect x="20" y="274" width="430" height="62" rx="8" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="301.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Only nonmetals?</text><text x="235.0" y="318.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >YES → MOLECULAR (Section 4.4)</text><text x="20.0" y="360.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="start" fill="#2d3f4b" >ACID</text><text x="80.0" y="360.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >H + -ide → hydro-…-ic acid;  -ate → -ic;  -ite → -ous</text><text x="20.0" y="386.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="start" fill="#2d3f4b" >IONIC</text><text x="80.0" y="386.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >Fixed-charge metal (groups 1, 2; Al, Zn, Ag) → metal name</text><text x="80.0" y="405.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >Any other metal → Roman numeral for its charge</text><text x="80.0" y="424.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >Anion: -ide for one element; polyatomic name as is</text><text x="20.0" y="450.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" text-anchor="start" fill="#2d3f4b" >MOLEC.</text><text x="80.0" y="450.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >Greek prefixes (no mono- on the first element);</text><text x="80.0" y="469.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#2d3f4b" >second element ends in -ide</text></svg>