<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 626" width="470" height="626" role="img" aria-label="Flowchart for naming any compound, in the order of the blue naming sheet. First question: is there a metal (or the ammonium ion, NH4+)? If yes, ask: can the metal have more than one charge? (Transition metals except Zn and Ag can, and so can Sn and Pb.) If no, count the elements: 2 elements is an ionic binary compound, named metal plus nonmetal with an -ide ending, for example NaCl, sodium chloride; 3 or more elements is an ionic ternary compound, named metal plus the polyatomic ion, keeping its ending, for example K2CO3, potassium carbonate. If yes, count the elements the same way, but write the metal charge as a Roman numeral: FeCl3, iron(III) chloride; CuSO4, copper(II) sulfate. If there is no metal, ask: is H written first (and is it aqueous)? If yes, it is an acid: H plus one element is named hydro-, root, -ic acid, for example HCl(aq), hydrochloric acid; an -ate ion becomes an -ic acid, for example HNO3, nitric acid; an -ite ion becomes an -ous acid, for example HNO2, nitrous acid. If no, count the elements: 1 element is a diatomic element, named as the element, for example Cl2, chlorine; 2 elements is a covalent binary compound, named with prefixes (no mono- on the first element) and an -ide ending, for example N2O4, dinitrogen tetroxide."><title>How to name any compound (blue naming sheet order)</title><rect width="470" height="626" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="22.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Naming any compound</text><rect x="100" y="34" width="270" height="40" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="235.0" y="54.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Is there a metal (or NH<tspan baseline-shift="sub" font-size="11">4</tspan><tspan baseline-shift="super" font-size="11">+</tspan>)?</text><path d="M235 74 V86 H129.0 V104" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M235 86 H347.0 V104" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="137.0" y="100.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >YES</text><text x="355.0" y="100.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >NO</text><rect x="20" y="106" width="218" height="82" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="129.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Can the metal have</text><text x="129.0" y="141.4" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >more than one charge?</text><text x="129.0" y="160.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#4a5a66" font-style="italic">transition metals except Zn, Ag;</text><text x="129.0" y="175.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#4a5a66" font-style="italic">also Sn, Pb</text><path d="M129.0 188 L129.0 206" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="137.0" y="202.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >NO</text><rect x="20" y="208" width="218" height="28" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="129.0" y="226.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Count the elements</text><rect x="38" y="248" width="200" height="60" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="138.0" y="268.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2 elements: ionic binary</text><text x="138.0" y="284.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >metal + nonmetal-ide</text><text x="138.0" y="300.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >NaCl, sodium chloride</text><rect x="38" y="316" width="200" height="76" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="138.0" y="336.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >3 or more: ionic ternary</text><text x="138.0" y="352.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >metal + polyatomic ion</text><text x="138.0" y="368.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(keep its ending)</text><text x="138.0" y="384.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >K<tspan baseline-shift="sub" font-size="11">2</tspan>CO<tspan baseline-shift="sub" font-size="11">3</tspan>, potassium carbonate</text><path d="M25 236 V354.0" stroke="#2d3f4b" stroke-width="1.8" fill="none"/><path d="M25 278.0 L37 278.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><path d="M25 354.0 L37 354.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><path d="M20 160 H10 V424 H19" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="3" y="268.5" width="14" height="33" fill="#fff"/><text x="14.3" y="285.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" transform="rotate(-90 14.3 285.0)">YES</text><rect x="20" y="410" width="218" height="28" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="129.0" y="428.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Count the elements</text><rect x="38" y="450" width="200" height="76" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="138.0" y="470.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2 elements: ionic binary</text><text x="138.0" y="486.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >metal (Roman numeral charge)</text><text x="138.0" y="502.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >+ nonmetal-ide</text><text x="138.0" y="518.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >FeCl<tspan baseline-shift="sub" font-size="11">3</tspan>, iron(III) chloride</text><rect x="38" y="534" width="200" height="76" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="138.0" y="554.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >3 or more: ionic ternary</text><text x="138.0" y="570.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >metal (Roman numeral charge)</text><text x="138.0" y="586.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >+ polyatomic ion (keep ending)</text><text x="138.0" y="602.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >CuSO<tspan baseline-shift="sub" font-size="11">4</tspan>, copper(II) sulfate</text><path d="M25 438 V572.0" stroke="#2d3f4b" stroke-width="1.8" fill="none"/><path d="M25 488.0 L37 488.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><path d="M25 572.0 L37 572.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><rect x="246" y="106" width="202" height="50" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="347.0" y="124.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Is H written first</text><text x="347.0" y="141.4" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle" fill="#2d3f4b" >(and aqueous)?</text><path d="M347.0 156 L347.0 174" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="355.0" y="170.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" fill="#2d3f4b" >YES</text><rect x="246" y="176" width="202" height="28" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="347.0" y="194.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Acid</text><rect x="264" y="216" width="184" height="60" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="356.0" y="236.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >H + one element</text><text x="356.0" y="252.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >hydro- root -ic acid</text><text x="356.0" y="268.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >HCl(aq), hydrochloric acid</text><rect x="264" y="284" width="184" height="44" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="356.0" y="304.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >-ate ion → -ic acid</text><text x="356.0" y="320.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >HNO<tspan baseline-shift="sub" font-size="11">3</tspan>, nitric acid</text><rect x="264" y="336" width="184" height="44" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="356.0" y="356.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >-ite ion → -ous acid</text><text x="356.0" y="372.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >HNO<tspan baseline-shift="sub" font-size="11">2</tspan>, nitrous acid</text><path d="M251 204 V358.0" stroke="#2d3f4b" stroke-width="1.8" fill="none"/><path d="M251 246.0 L263 246.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><path d="M251 306.0 L263 306.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><path d="M251 358.0 L263 358.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><path d="M448 131 H460 V412 H449" stroke="#2d3f4b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="453" y="252.5" width="14" height="24" fill="#fff"/><text x="464.3" y="264.5" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2d3f4b" transform="rotate(-90 464.3 264.5)">NO</text><rect x="246" y="398" width="202" height="28" rx="8" fill="#f3f6fa" stroke="#2d3f4b" stroke-width="1.6"/><text x="347.0" y="416.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Count the elements</text><rect x="264" y="438" width="184" height="60" rx="8" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.6"/><text x="356.0" y="458.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >1 element: diatomic</text><text x="356.0" y="474.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >name the element</text><text x="356.0" y="490.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Cl<tspan baseline-shift="sub" font-size="11">2</tspan>, chlorine</text><rect x="264" y="506" width="184" height="76" rx="8" fill="#e3f2e1" stroke="#2d3f4b" stroke-width="1.6"/><text x="356.0" y="526.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >2 elements: covalent binary</text><text x="356.0" y="542.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >prefixes + -ide</text><text x="356.0" y="558.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >(no mono- on the first)</text><text x="356.0" y="574.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2d3f4b" >N<tspan baseline-shift="sub" font-size="11">2</tspan>O<tspan baseline-shift="sub" font-size="11">4</tspan>, dinitrogen tetroxide</text><path d="M251 426 V544.0" stroke="#2d3f4b" stroke-width="1.8" fill="none"/><path d="M251 468.0 L263 468.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/><path d="M251 544.0 L263 544.0" stroke="#2d3f4b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/></svg>