<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 382" width="470" height="382" role="img" aria-label="Matching anion names to acid names. An -ide ion becomes a hydro- -ic acid: chloride, Cl-, becomes hydrochloric acid, HCl(aq). An -ate ion becomes an -ic acid: chlorate, ClO3-, becomes chloric acid, HClO3. An -ite ion becomes an -ous acid: chlorite, ClO2-, becomes chlorous acid, HClO2. Prefixes stay: hypochlorite becomes hypochlorous acid and perchlorate becomes perchloric acid. Add enough H+ to cancel the anion charge: sulfate, SO4 2-, becomes H2SO4, sulfuric acid. Memory aids: I hate this mnemonic, for -ate to -ic; Sprite is delicious, for -ite to -ous."><rect width="470" height="382" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="24.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >From anion name to acid name</text><rect x="14" y="44" width="170" height="64" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="99.0" y="72.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >-ide ion</text><text x="99.0" y="89.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >chloride, Cl<tspan baseline-shift="super" font-size="11">−</tspan></text><path d="M188 76 L224 76" stroke="#2d3f4b" stroke-width="2.6" fill="none" marker-end="url(#ar)"/><rect x="230" y="44" width="228" height="64" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="344.0" y="72.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >hydro-___-ic acid</text><text x="344.0" y="89.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >hydrochloric acid, HCl(aq)</text><rect x="14" y="124" width="170" height="64" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="99.0" y="152.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >-ate ion</text><text x="99.0" y="169.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >chlorate, ClO<tspan baseline-shift="sub" font-size="11">3</tspan><tspan baseline-shift="super" font-size="11">−</tspan></text><path d="M188 156 L224 156" stroke="#2d3f4b" stroke-width="2.6" fill="none" marker-end="url(#ar)"/><rect x="230" y="124" width="228" height="64" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="344.0" y="152.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >___-ic acid</text><text x="344.0" y="169.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >chloric acid, HClO<tspan baseline-shift="sub" font-size="11">3</tspan></text><rect x="14" y="204" width="170" height="64" rx="8" fill="#dbe7f6" stroke="#2d3f4b" stroke-width="1.6"/><text x="99.0" y="232.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >-ite ion</text><text x="99.0" y="249.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >chlorite, ClO<tspan baseline-shift="sub" font-size="11">2</tspan><tspan baseline-shift="super" font-size="11">−</tspan></text><path d="M188 236 L224 236" stroke="#2d3f4b" stroke-width="2.6" fill="none" marker-end="url(#ar)"/><rect x="230" y="204" width="228" height="64" rx="8" fill="#fde9c8" stroke="#2d3f4b" stroke-width="1.6"/><text x="344.0" y="232.2" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >___-ous acid</text><text x="344.0" y="249.6" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3f4b" >chlorous acid, HClO<tspan baseline-shift="sub" font-size="11">2</tspan></text><text x="235.0" y="290.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Prefixes stay: hypochlorite → hypochlorous acid;</text><text x="235.0" y="308.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >perchlorate → perchloric acid.</text><text x="235.0" y="328.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Add enough H<tspan baseline-shift="super" font-size="11">+</tspan> to cancel the anion charge: SO<tspan baseline-shift="sub" font-size="11">4</tspan><tspan baseline-shift="super" font-size="11">2−</tspan> → H<tspan baseline-shift="sub" font-size="11">2</tspan>SO<tspan baseline-shift="sub" font-size="11">4</tspan> (sulfuric acid).</text><text x="235.0" y="352.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Memory aids: "I hate this mnemonic" (-ate → -ic);</text><text x="235.0" y="370.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#2d3f4b" >"Sprite is delicious" (-ite → -ous)</text></svg>