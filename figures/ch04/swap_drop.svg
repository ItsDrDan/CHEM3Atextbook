<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 408" width="470" height="408" role="img" aria-label="Swap-drop method. Aluminum ion, Al 3+, and oxide ion, O 2-, are written side by side. Crossing arrows carry the 3 from aluminum down to become the subscript of oxygen and the 2 from oxide down to become the subscript of aluminum, giving Al2O3. Check: 2 times 3+ plus 3 times 2- equals 6+ plus 6- equals 0. Second example: Ca 2+ and O 2- swap to Ca2O2, which reduces to CaO, because ionic formulas use the smallest whole-number ratio."><rect width="470" height="408" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2d3f4b"/></marker></defs><text x="235.0" y="24.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Swap-drop: aluminum oxide</text><text x="150.0" y="82.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Al<tspan baseline-shift="super" font-size="20">3+</tspan></text><text x="320.0" y="82.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle" fill="#2d3f4b" >O<tspan baseline-shift="super" font-size="20">2−</tspan></text><path d="M180 94 C 230 120, 280 140, 330 160" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path d="M345 94 C 290 120, 220 140, 165 160" stroke="#2f6f9a" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><text x="235.0" y="200.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Al<tspan baseline-shift="sub" font-size="24">2</tspan>O<tspan baseline-shift="sub" font-size="24">3</tspan></text><text x="235.0" y="250.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >The number of each charge (not its sign) becomes</text><text x="235.0" y="268.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >the subscript of the OTHER ion.</text><text x="235.0" y="292.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Check: 2(3+) + 3(2−) = 6+ + 6− = 0</text><line x1="20" y1="300" x2="450" y2="300" stroke="#c9d3dc" stroke-width="1.5"/><text x="235.0" y="326.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Reduce when you can: calcium oxide</text><text x="235.0" y="362.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#2d3f4b" >Ca<tspan baseline-shift="super" font-size="15">2+</tspan>  O<tspan baseline-shift="super" font-size="15">2−</tspan>  →  Ca<tspan baseline-shift="sub" font-size="15">2</tspan>O<tspan baseline-shift="sub" font-size="15">2</tspan>  →  CaO</text><text x="235.0" y="394.0" font-family="Lato, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3f4b" >Ionic formulas use the smallest whole-number ratio.</text></svg>